<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fast Money | Pass the Phone</title>
<meta name="description" content="A Fast Money style party game. One host, players in headphones, a survey board, and a clock.">
<meta name="theme-color" content="#0b1f70">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: a game show set. Marquee sign up top, the answer board center stage, the host's controls docked under it. */
:root{
  color-scheme:dark;
  --night:#030a2a;
  --stage:#0b1f70;
  --board:#06124d;
  --tile-top:#3466ea;
  --tile-mid:#1638b6;
  --tile-low:#0a2385;
  --line:#6f92ff;
  --gold:#ffc53a;
  --gold-hi:#ffe9a0;
  --gold-lo:#a96508;
  --ink:#f4f7ff;
  --mist:#aab8e8;
  --dim:#7181ba;
  --strike:#f0313b;
  --well:#020720;
  --on-gold:#2a1600;
  --f-display:"Anton","Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
  --f-board:"Oswald","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--night)}
body{margin:0;min-height:100vh;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(ellipse 80% 55% at 50% -8%,rgba(70,120,255,.55),transparent 70%),
  repeating-conic-gradient(from 0deg at 50% -25%,rgba(255,255,255,.05) 0deg 5deg,transparent 5deg 10deg),
  linear-gradient(180deg,var(--stage) 0%,var(--night) 72%)}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{max-width:1040px;margin:0 auto;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.back-link{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:999px;font-family:var(--f-board);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-hi);text-decoration:none;box-shadow:inset 0 0 0 1px rgba(111,146,255,.55);background:rgba(10,30,110,.6)}
.back-link:hover{color:var(--ink)}
.back-link:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
.back-link svg{width:16px;height:16px}

/* Type */
.eyebrow{margin:0;font-family:var(--f-board);font-weight:500;text-transform:uppercase;letter-spacing:.16em;font-size:13px;color:var(--gold-hi)}
.title{margin:6px 0 0;font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(40px,8vw,72px);line-height:1;text-wrap:balance}
.lead{margin:12px auto 0;max-width:34em;font-size:clamp(17px,2.2vw,20px);color:var(--mist);text-wrap:pretty}
.h-sec{margin:0 0 12px;font-family:var(--f-board);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:15px;color:var(--gold)}
.hint{margin:10px 0 0;font-size:14px;color:var(--dim);text-align:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 20px;border:0;border-radius:10px;cursor:pointer;font-family:var(--f-board);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:rgba(10,30,110,.6);box-shadow:inset 0 0 0 2px var(--line);transition:transform .08s ease,box-shadow .15s ease,background .15s ease}
.btn:hover{background:rgba(30,60,170,.7)}
.btn:active{transform:translateY(2px)}
.btn-gold{color:var(--on-gold);background:linear-gradient(180deg,#ffe78f 0%,#ffc533 52%,#e8960a 100%);box-shadow:0 4px 0 #8a5204,0 10px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7)}
.btn-gold:hover{background:linear-gradient(180deg,#fff0b0 0%,#ffcf4d 52%,#f0a21a 100%)}
.btn-gold:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5204,0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7)}
.btn-ghost{background:transparent;box-shadow:inset 0 0 0 1px rgba(111,146,255,.55);color:var(--mist)}
.btn-ghost:hover{color:var(--ink);background:rgba(30,60,170,.35)}
.btn-big{min-height:60px;padding:14px 30px;font-size:21px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn:focus-visible,.icon-btn:focus-visible,.pcard:focus-visible,.fm-row:focus-visible,.link:focus-visible,.mini-logo:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
.link{background:none;border:0;padding:0;color:var(--gold-hi);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;background:rgba(10,30,110,.6);box-shadow:inset 0 0 0 1px rgba(111,146,255,.55);color:var(--gold-hi)}
.icon-btn svg{width:22px;height:22px}

/* Marquee sign */
.marquee{position:relative;max-width:620px;margin:10px auto 0;padding:26px 30px 28px;border-radius:26px;text-align:center;
  background:radial-gradient(ellipse at 50% 0%,#1d4ade 0%,#0b2180 55%,#061450 100%);
  box-shadow:0 0 0 3px var(--gold-lo),0 0 0 7px var(--gold),0 0 0 10px var(--gold-lo),0 0 60px rgba(255,197,58,.25),0 24px 60px rgba(0,0,0,.55)}
.marquee::before{content:"";position:absolute;inset:8px;border-radius:19px;border:5px dotted var(--gold-hi);pointer-events:none;filter:drop-shadow(0 0 4px rgba(255,233,160,.95));animation:bulbs .9s ease-in-out infinite alternate}
@keyframes bulbs{from{opacity:1}to{opacity:.4}}
.logo{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(54px,13.5vw,116px);line-height:.95;letter-spacing:.01em;text-transform:uppercase;padding-inline:.06em;
  background:linear-gradient(180deg,#fffbe6 0%,#ffe27a 30%,#ffb81c 58%,#e08a00 72%,#ffd65c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #7a4300) drop-shadow(0 4px 0 #04103f) drop-shadow(0 12px 16px rgba(0,0,0,.5));transform:skewX(-7deg)}
.tag{margin:10px 0 0;font-family:var(--f-board);font-weight:500;text-transform:uppercase;letter-spacing:.34em;font-size:13px;color:var(--gold-hi)}

/* Top bar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.mini-logo{border:0;background:none;padding:0;cursor:pointer;font-family:var(--f-display);font-size:26px;line-height:1;text-transform:uppercase;transform:skewX(-7deg);
  background:linear-gradient(180deg,#fff3c4,#ffc533 60%,#e8960a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #04103f)}
.tb-info{flex:1;min-width:0;font-family:var(--f-board);text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--mist);text-align:center}

/* Panels and setup */
.panel{border-radius:16px;padding:20px;background:linear-gradient(180deg,rgba(16,40,140,.88),rgba(5,16,70,.92));box-shadow:inset 0 0 0 1px rgba(111,146,255,.35),0 12px 30px rgba(0,0,0,.35)}
.home-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px;margin-top:34px}
@media (max-width:760px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.resume{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:30px;padding:14px 16px;border-radius:14px;background:rgba(255,197,58,.1);box-shadow:inset 0 0 0 2px var(--gold)}
.resume p{margin:0;flex:1 1 220px;min-width:0}
.plist{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.plist li{display:flex;align-items:center;gap:10px}
.plist input{flex:1;min-width:0;height:48px;padding:0 14px;border-radius:10px;border:2px solid rgba(111,146,255,.45);background:var(--well);color:var(--ink);font:600 18px/1 var(--f-body)}
.plist input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,197,58,.25)}
.plist input::placeholder{color:var(--dim)}
.plist .icon-btn{width:40px;height:40px;flex:none;color:var(--mist)}
.plist .icon-btn svg{width:18px;height:18px}
.settings{display:grid;gap:14px;margin:22px 0 22px}
.seg{border:0;margin:0;padding:0;min-width:0}
.seg legend{padding:0;margin-bottom:6px;font-size:15px;font-weight:600;color:var(--mist)}
.seg-opts{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:grid;place-items:center;min-width:56px;height:42px;padding:0 14px;border-radius:9px;font-family:var(--f-board);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:var(--well);box-shadow:inset 0 0 0 1px rgba(111,146,255,.45);color:var(--mist)}
.seg input:checked+span{background:linear-gradient(180deg,#ffe78f,#ffc533 55%,#e8960a);color:var(--on-gold);box-shadow:0 2px 0 #8a5204}
.seg input:focus-visible+span{outline:3px solid var(--gold-hi);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--mist);cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--gold)}
.steps{margin:0;padding-left:1.4em;display:grid;gap:10px;color:var(--ink)}
.steps li::marker{font-family:var(--f-display);color:var(--gold)}
.steps b{color:var(--gold-hi);font-weight:600}
.bank{margin:18px 0 0;padding-top:14px;border-top:1px solid rgba(111,146,255,.25);font-size:14px;color:var(--mist)}
.start-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* Player dots and score chips */
.pdot{display:inline-grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--c,var(--gold));color:#10123a;font:700 13px/1 var(--f-board);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.scores{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 5px 5px 6px;border-radius:999px;background:rgba(5,16,70,.85);box-shadow:inset 0 0 0 1px rgba(111,146,255,.4);font-family:var(--f-board);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.chip b{min-width:34px;padding:3px 9px;border-radius:999px;background:var(--well);color:var(--gold);font:400 17px/1.1 var(--f-display);text-align:center;font-variant-numeric:tabular-nums}
.chip.lead{box-shadow:inset 0 0 0 2px var(--gold)}

/* Handoff and interstitial screens */
.stage{padding-block:18px}
.center{text-align:center}
.upnext{margin:22px 0 0;font-family:var(--f-board);text-transform:uppercase;letter-spacing:.3em;font-size:15px;color:var(--mist)}
.bigname{margin:4px 0 0;font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(56px,14vw,128px);line-height:1;color:var(--gold);text-shadow:0 4px 0 #6b3a00,0 0 40px rgba(255,197,58,.35);overflow-wrap:anywhere}
.hostnote{max-width:560px;margin:26px auto 26px;padding:14px 18px;border-radius:12px;text-align:left;background:rgba(2,7,32,.7);box-shadow:inset 0 0 0 1px rgba(111,146,255,.35)}
.hostnote p{margin:4px 0 0;color:var(--mist)}
.stage .scores{margin-top:28px}

/* Answer screen (host view) */
.ans-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ans-who{display:flex;align-items:center;gap:12px;min-width:0}
.ans-who .pdot{width:40px;height:40px;font-size:20px}
.ans-name{margin:0;font-family:var(--f-display);font-size:32px;line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.clockwrap{display:grid;gap:6px;justify-items:stretch}
.clock{min-width:132px;padding:6px 18px 4px;border-radius:12px;text-align:center;background:var(--well);color:var(--gold);font:400 64px/1 var(--f-display);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(255,197,58,.6);box-shadow:inset 0 0 0 3px var(--gold-lo),0 0 26px rgba(255,197,58,.2)}
.clock.low{color:var(--strike);text-shadow:0 0 18px rgba(240,49,59,.7);box-shadow:inset 0 0 0 3px var(--strike);animation:pulse .5s ease-in-out infinite alternate}
.clock.paused{opacity:.55;animation:none}
.clock.off{font-size:22px;padding:14px 18px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--f-board);font-weight:600}
@keyframes pulse{to{transform:scale(1.05)}}
.clockbar{height:6px;border-radius:3px;background:var(--well);overflow:hidden}
.clockbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold-lo),var(--gold));transform-origin:left;transition:transform .1s linear}
.qcard{margin-top:18px;padding:22px 22px 24px;border-radius:16px;background:linear-gradient(180deg,#0f2b98,#081b6a);box-shadow:0 0 0 2px var(--gold-lo),0 0 0 4px var(--gold),0 14px 34px rgba(0,0,0,.4)}
.qnum{margin:0;font-family:var(--f-board);text-transform:uppercase;letter-spacing:.16em;font-size:13px;color:var(--gold-hi)}
.qtext{margin:8px 0 0;font-weight:700;font-size:clamp(24px,4.2vw,40px);line-height:1.18;text-wrap:balance}
.ans-form{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.ans-input{flex:1 1 260px;min-width:0;height:60px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--well);color:var(--ink);font:600 clamp(20px,3vw,26px)/1 var(--f-body)}
.ans-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,197,58,.22)}
.ans-input::placeholder{color:var(--dim);font-weight:500}
.ans-form .btn{min-height:60px;flex:0 0 auto;padding-inline:24px}
.slots{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:6px}
.slot{display:grid;grid-template-columns:46px minmax(0,1fr);min-height:44px;border-radius:7px;overflow:hidden;background:var(--well);box-shadow:inset 0 0 0 1px rgba(111,146,255,.25)}
.slot-n{display:grid;place-items:center;font:400 20px/1 var(--f-display);color:var(--mist);background:rgba(52,102,234,.2)}
.slot-t{align-self:center;padding:8px 14px;font-family:var(--f-board);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere}
.slot.current{box-shadow:inset 0 0 0 2px var(--gold)}
.slot.current .slot-n{background:var(--gold);color:var(--on-gold)}
.slot.passed .slot-t{color:var(--gold-hi);font-weight:500}
.slot.skipped .slot-t{color:var(--dim);font-weight:500}
.turn-tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}

/* Turn recap */
.recap{list-style:none;margin:22px auto 26px;padding:0;max-width:680px;display:grid;gap:12px;text-align:left}
.recap label{display:block;margin-bottom:6px;font-size:15px;color:var(--mist)}
.recap input{width:100%;height:50px;padding:0 14px;border-radius:10px;border:2px solid rgba(111,146,255,.45);background:var(--well);color:var(--ink);font:600 19px/1 var(--f-body)}
.recap input:focus{outline:none;border-color:var(--gold)}
.recap input::placeholder{color:var(--dim)}

/* Reveal: the board */
.qbanner{margin:18px auto 0;max-width:900px;padding:14px 20px 16px;border-radius:14px 14px 0 0;text-align:center;background:linear-gradient(180deg,#0d2a95,#06155a)}
.qbanner .qtext{font-size:clamp(21px,3.4vw,32px)}
.board{max-width:900px;margin:0 auto;padding:14px;border-radius:0 0 18px 18px;background:var(--board);box-shadow:0 0 0 3px var(--gold-lo),0 0 0 7px var(--gold),0 0 0 10px var(--gold-lo),0 22px 50px rgba(0,0,0,.55)}
.qbanner{box-shadow:0 0 0 3px var(--gold-lo),0 0 0 7px var(--gold),0 0 0 10px var(--gold-lo);position:relative;z-index:1}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:column;grid-template-rows:repeat(4,auto)}
@media (max-width:620px){.tiles{grid-template-columns:minmax(0,1fr);grid-auto-flow:row;grid-template-rows:none}.tile.empty{display:none}}
.tile{height:62px;perspective:900px}
.tile-in{position:relative;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.35,.5,1);transition-delay:var(--d,0ms)}
.tile.open .tile-in{transform:rotateX(-180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;border-radius:6px;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.front{justify-content:center;background:linear-gradient(180deg,var(--tile-top) 0%,var(--tile-mid) 50%,var(--tile-low) 100%);box-shadow:inset 0 0 0 2px rgba(160,190,255,.5),inset 0 -6px 12px rgba(0,0,40,.35)}
.num{display:grid;place-items:center;width:66px;height:40px;border-radius:50%;font:400 24px/1 var(--f-display);color:#fff;text-shadow:0 2px 0 #0a2280;background:radial-gradient(ellipse at 50% 30%,#6c9cff 0%,#1d4ad8 70%);box-shadow:0 0 0 2px #b5ccff,0 3px 8px rgba(0,0,0,.5)}
.back{transform:rotateX(180deg);background:linear-gradient(180deg,#4c80f7 0%,#2150d6 50%,#1438b4 100%);box-shadow:inset 0 0 0 2px rgba(210,225,255,.7)}
.back .txt{flex:1;min-width:0;padding:0 12px 0 16px;font-family:var(--f-board);font-weight:600;font-size:clamp(17px,2.3vw,22px);line-height:1.05;letter-spacing:.02em;text-transform:uppercase;color:#fff;text-shadow:0 2px 0 rgba(0,0,40,.55);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.back .who{align-self:stretch;flex:none;min-width:64px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:3px;padding:4px 8px;background:linear-gradient(180deg,#0d2a8f,#061a66);border-left:2px solid rgba(210,225,255,.6)}
.back .who .pdot{width:22px;height:22px;font-size:12px}
.tile.empty .front{background:linear-gradient(180deg,#0b2178,#06155a);box-shadow:inset 0 0 0 2px rgba(80,110,220,.25)}
.pcards{max-width:900px;margin:26px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.pcard{position:relative;display:block;min-width:0;padding:12px 14px 14px;border:0;border-radius:12px;text-align:left;cursor:pointer;background:linear-gradient(180deg,#102c94,#07196a);box-shadow:inset 0 0 0 2px rgba(111,146,255,.35);transition:box-shadow .2s ease,transform .2s ease}
.pcard:disabled{cursor:default}
.pcard.now{box-shadow:inset 0 0 0 2px var(--gold-hi),0 0 0 3px rgba(255,233,160,.18)}
.pcard.ok{box-shadow:inset 0 0 0 3px var(--gold),0 0 24px rgba(255,197,58,.28)}
.pcard.no{box-shadow:inset 0 0 0 3px var(--strike)}
.pn{display:flex;align-items:center;gap:8px;padding-right:44px;font-family:var(--f-board);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);overflow-wrap:anywhere}
.pa{display:block;margin-top:8px;font-family:var(--f-board);font-weight:600;font-size:clamp(20px,2.6vw,24px);line-height:1.1;text-transform:uppercase;overflow-wrap:anywhere}
.pa.hide{color:rgba(170,184,232,.35);letter-spacing:.3em}
.pa.blank{color:var(--dim)}
.pr{position:absolute;top:10px;right:10px;display:grid;place-items:center;min-width:36px;height:30px;padding:0 6px;border-radius:8px;font:400 18px/1 var(--f-display)}
.pr.ok{background:var(--gold);color:var(--on-gold)}
.pr.no{background:var(--strike);color:#fff}
.pr svg{width:16px;height:16px}
.hostcall{display:block;margin-top:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-hi)}
.console{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px;padding:16px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(3,10,42,0),rgba(3,10,42,.95) 38%)}

/* Strike X */
.xmark{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none}
.xmark svg{width:min(52vw,320px);height:auto;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.xmark.show svg{animation:strike 1s ease forwards}
@keyframes strike{0%{transform:scale(1.6);opacity:0}12%{transform:scale(1);opacity:1}75%{opacity:1}100%{opacity:0}}

/* Round results: Fast Money boards */
.fm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:22px;margin-top:24px}
.fm{min-width:0;padding:12px;border-radius:14px;background:var(--board);box-shadow:0 0 0 2px var(--gold-lo),0 0 0 5px var(--gold),0 0 0 7px var(--gold-lo),0 16px 34px rgba(0,0,0,.45)}
.fm-head{display:flex;align-items:center;gap:10px;margin:2px 4px 10px;font-family:var(--f-display);font-size:24px;text-transform:uppercase;overflow-wrap:anywhere}
.fm-row{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:6px;width:100%;margin-top:6px;padding:0;border:0;background:none;cursor:pointer;text-align:left}
.fm-ans{padding:10px 12px;border-radius:5px;background:linear-gradient(180deg,#2a5ae4,#1438b4);font-family:var(--f-board);font-weight:600;font-size:18px;line-height:1.15;text-transform:uppercase;overflow-wrap:anywhere;box-shadow:inset 0 0 0 1px rgba(210,225,255,.4)}
.fm-pts{display:grid;place-items:center;border-radius:5px;background:var(--well);color:var(--gold);font:400 26px/1 var(--f-display);font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px rgba(255,197,58,.35)}
.fm-row.miss .fm-ans{background:linear-gradient(180deg,#14256b,#0b1850);color:var(--dim);box-shadow:inset 0 0 0 1px rgba(111,146,255,.2)}
.fm-row.miss .fm-pts{color:var(--dim);box-shadow:inset 0 0 0 1px rgba(111,146,255,.2)}
.fm-total{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:6px;margin-top:10px}
.fm-total span:first-child{align-self:center;justify-self:end;padding-right:6px;font-family:var(--f-board);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-hi)}
.fm-total .fm-pts{height:48px;font-size:32px;box-shadow:inset 0 0 0 2px var(--gold)}
.standings{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:560px}
.standings li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(5,16,70,.85);box-shadow:inset 0 0 0 1px rgba(111,146,255,.35)}
.standings li.top{box-shadow:inset 0 0 0 2px var(--gold)}
.rank{width:26px;font:400 22px/1 var(--f-display);color:var(--gold-hi);text-align:center}
.sname{flex:1;min-width:0;font-family:var(--f-board);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.04em;overflow-wrap:anywhere}
.spts{min-width:48px;padding:4px 10px;border-radius:8px;background:var(--well);color:var(--gold);font:400 24px/1.1 var(--f-display);text-align:center;font-variant-numeric:tabular-nums}
.results-foot{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:30px}
.final .standings{margin:28px auto 0;text-align:left}
.final .marquee{margin-top:26px}
.win-name{overflow-wrap:anywhere}
.confetti{position:fixed;inset:0;z-index:40;pointer-events:none}

@media (max-width:520px){
  .clock{min-width:104px;font-size:52px}
  .tile{height:54px}
  .num{width:56px;height:34px;font-size:20px}
  .qcard{padding:18px}
  .panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0ms!important}
}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="xmark" class="xmark" hidden aria-hidden="true">
  <svg viewBox="0 0 100 100"><path d="M20 20L80 80M80 20L20 80" stroke="#fff" stroke-width="27" stroke-linecap="square"/><path d="M20 20L80 80M80 20L20 80" stroke="#f0313b" stroke-width="17" stroke-linecap="square"/></svg>
</div>
<canvas id="confetti" class="confetti" hidden aria-hidden="true"></canvas>
<div id="live" class="sr" aria-live="polite"></div>

<script src="../shared/party.js"></script>
<script src="questions.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- Answer matching ---------- */
  const STOP = new Set(['a', 'an', 'the', 'my', 'your', 'his', 'her', 'their', 'our', 'some', 'to', 'of', 'and', 'i', 'you']);

  function stemWord(w) {
    if (w.length <= 3) return w;
    if (/(ch|sh|x|z|ss)es$/.test(w)) return w.slice(0, -2);
    if (/(ss|us|is)$/.test(w)) return w;
    if (w.length > 5 && /oes$/.test(w)) return w.slice(0, -2);
    if (/s$/.test(w)) w = w.slice(0, -1);
    if (w.length > 3 && /ie$/.test(w)) w = w.slice(0, -2) + 'y';
    return w;
  }
  function norm(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/['\u2019`]/g, '').replace(/&/g, ' and ')
      .replace(/[^a-z0-9]+/g, ' ').trim().split(' ')
      .filter(w => w && !STOP.has(w)).map(stemWord).join(' ');
  }
  function lev(a, b) {
    if (a === b) return 0;
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    let prev = new Array(n + 1), curr = new Array(n + 1);
    for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++) {
      curr[0] = i;
      for (let j = 1; j <= n; j++) {
        curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      const t = prev; prev = curr; curr = t;
    }
    return prev[n];
  }
  const tol = L => (L <= 4 ? 0 : L <= 7 ? 1 : L <= 12 ? 2 : 3);
  function hasSeq(hay, needle) {
    outer: for (let i = 0; i + needle.length <= hay.length; i++) {
      for (let j = 0; j < needle.length; j++) if (hay[i + j] !== needle[j]) continue outer;
      return true;
    }
    return false;
  }
  const near = (w, t) => w === t || (Math.min(w.length, t.length) > 4 && lev(w, t) <= tol(Math.max(w.length, t.length)));
  function score(c, k) {
    if (!c || !k) return 0;
    if (c === k) return 100;
    if (lev(c, k) <= tol(Math.max(c.length, k.length))) return 90;
    const ct = c.split(' '), kt = k.split(' ');
    const bonus = Math.min(k.length, 30);
    if (hasSeq(ct, kt)) return 60 + bonus;
    if (kt.every(t => ct.some(w => near(w, t)))) return 55 + bonus;
    if (c.length >= 4 && hasSeq(kt, ct)) return 30 + Math.min(c.length, 20);
    return 0;
  }

  const RAW = Array.isArray(window.FM_QUESTIONS) ? window.FM_QUESTIONS : [];
  const QS = RAW.map(row => ({
    q: row[0],
    a: row.slice(1).map(s => {
      const parts = s.split('|');
      return { label: parts[0].trim(), keys: [...new Set(parts.map(norm).filter(Boolean))] };
    })
  }));

  function matchAnswer(qIdx, text) {
    const c = norm(text);
    if (!c || !QS[qIdx]) return -1;
    let best = -1, bestScore = 0;
    QS[qIdx].a.forEach((ans, i) => {
      ans.keys.forEach(k => { const s = score(c, k); if (s > bestScore) { bestScore = s; best = i; } });
    });
    return best;
  }

  /* ---------- Storage ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } }
  };
  const K_GAME = 'fmp.game', K_SETUP = 'fmp.setup', K_USED = 'fmp.used';
  const DEFAULTS = { perRound: 5, timer: 20, rounds: 3 };
  const MAX_PLAYERS = 8;
  const PCOL = ['#ff7a7a', '#56d6ff', '#b9f25c', '#ffa94d', '#c79bff', '#ff86cf', '#4fe3a0', '#ffe066'];

  function loadSetup() {
    const s = store.get(K_SETUP, null) || {};
    const roster = window.Party ? window.Party.getRoster() : [];
    const names = roster.length ? roster.slice(0, MAX_PLAYERS)
      : Array.isArray(s.names) && s.names.length ? s.names.slice(0, MAX_PLAYERS).map(n => String(n || '')) : ['', '', ''];
    while (names.length < 2) names.push('');
    const st = Object.assign({}, DEFAULTS, s.settings || {});
    return { names, settings: st, sound: s.sound !== false };
  }
  function saveSetup() {
    store.set(K_SETUP, setup);
    if (window.Party) window.Party.setRoster(setup.names);
  }
  function loadGame() {
    const g = store.get(K_GAME, null);
    if (!g || !Array.isArray(g.players) || !g.players.length || !Array.isArray(g.rounds) || !g.settings) return null;
    const ok = g.rounds.every(R => Array.isArray(R.qs) && R.qs.every(i => QS[i]));
    return ok ? g : null;
  }

  let setup = loadSetup();
  let S = loadGame();
  let screen = 'home';
  let T = null;
  let clockTimer = null;
  let fx = null;
  let celebrate = false;

  function persist() { if (S) store.set(K_GAME, S); else store.del(K_GAME); }

  /* ---------- Helpers ---------- */
  const $ = sel => document.querySelector(sel);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const initial = n => (String(n).trim()[0] || '?').toUpperCase();
  const possessive = n => (/s$/i.test(n) ? n + "'" : n + "'s");
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function cur() { return S.rounds[S.rounds.length - 1]; }
  function nameOf(p) { return S.players[p].name; }
  function dot(p, extra) { return `<span class="pdot" style="--c:${PCOL[p % PCOL.length]}"${extra || ''} aria-hidden="true">${esc(initial(nameOf(p)))}</span>`; }
  function announce(msg) { const l = $('#live'); if (l) l.textContent = msg; }

  const ICON = {
    soundOn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    close: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>',
    x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square"/></svg>'
  };

  /* ---------- Sound ---------- */
  const sfx = (function () {
    let ctx = null;
    function ac() {
      if (!setup.sound) return null;
      try {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      } catch (e) { return null; }
    }
    function note(c, t, freq, type, peak, dur, attack) {
      const o = c.createOscillator(), v = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      v.gain.setValueAtTime(0.0001, t);
      v.gain.exponentialRampToValueAtTime(peak, t + (attack || 0.008));
      v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(v); v.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.05);
      return o;
    }
    return {
      unlock() { ac(); },
      ding() {
        const c = ac(); if (!c) return;
        const t = c.currentTime + 0.01;
        note(c, t, 1318.5, 'sine', 0.28, 1.6);
        note(c, t, 2637, 'sine', 0.09, 1.1);
        note(c, t, 3955, 'sine', 0.035, 0.7);
        note(c, t, 659.25, 'sine', 0.07, 1.2);
      },
      buzz(len) {
        const c = ac(); if (!c) return;
        len = len || 0.8;
        const t = c.currentTime + 0.01;
        const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1500;
        const v = c.createGain();
        v.gain.setValueAtTime(0.0001, t);
        v.gain.exponentialRampToValueAtTime(0.2, t + 0.015);
        v.gain.setValueAtTime(0.2, t + len - 0.06);
        v.gain.exponentialRampToValueAtTime(0.0001, t + len);
        f.connect(v); v.connect(c.destination);
        [98, 104, 196].forEach(fr => { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.connect(f); o.start(t); o.stop(t + len + 0.03); });
      },
      tick() { const c = ac(); if (!c) return; note(c, c.currentTime + 0.005, 1760, 'square', 0.05, 0.05, 0.003); },
      blip() {
        const c = ac(); if (!c) return;
        const t = c.currentTime + 0.005;
        const o = note(c, t, 620, 'triangle', 0.12, 0.18, 0.005);
        o.frequency.exponentialRampToValueAtTime(990, t + 0.1);
      },
      flip(n) {
        const c = ac(); if (!c) return;
        const t = c.currentTime + 0.01;
        for (let i = 0; i < Math.min(n, 8); i++) note(c, t + i * 0.12, 520 + i * 45, 'triangle', 0.08, 0.09, 0.004);
      },
      fanfare() {
        const c = ac(); if (!c) return;
        const t = c.currentTime + 0.02;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => note(c, t + i * 0.13, f, 'triangle', 0.16, i === 3 ? 0.9 : 0.22));
        note(c, t + 0.39, 1318.5, 'sine', 0.06, 0.9);
      }
    };
  })();

  /* ---------- Screen wake lock ---------- */
  let wakeLock = null;
  async function wake() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S && screen === 'game') wake(); });

  /* ---------- Question picking ---------- */
  function pickQuestions(n) {
    const inGame = new Set();
    if (S) S.rounds.forEach(R => R.qs.forEach(i => inGame.add(i)));
    let used = new Set(store.get(K_USED, []));
    let pool = QS.map((_, i) => i).filter(i => !inGame.has(i) && !used.has(QS[i].q));
    if (pool.length < n) {
      used = new Set();
      pool = QS.map((_, i) => i).filter(i => !inGame.has(i));
    }
    const pick = shuffle(pool).slice(0, n);
    pick.forEach(i => used.add(QS[i].q));
    store.set(K_USED, [...used]);
    return pick;
  }

  /* ---------- Game flow ---------- */
  function startGame() {
    sfx.unlock();
    const names = setup.names.map((n, i) => (n.trim() || 'Player ' + (i + 1)).slice(0, 18));
    S = { players: names.map(n => ({ name: n })), settings: Object.assign({}, setup.settings), rounds: [], phase: 'handoff' };
    newRound();
    screen = 'game';
    wake();
    persist(); render();
  }
  function newRound() {
    const n = S.players.length, r = S.rounds.length;
    const order = S.players.map((_, i) => (i + r) % n);
    const qs = pickQuestions(S.settings.perRound);
    const ans = {};
    order.forEach(p => { ans[p] = qs.map(() => ''); });
    S.rounds.push({ qs, order, ans, res: null, turn: 0, rq: 0, rstep: 0, done: false });
    S.phase = 'handoff';
  }
  function playAgain() {
    S.rounds = [];
    newRound();
    persist(); render();
  }

  function beginTurn() {
    sfx.unlock();
    const R = cur(), p = R.order[R.turn];
    R.ans[p] = R.qs.map(() => '');
    T = { queue: R.qs.map((_, i) => i), passed: [], skipped: [], left: S.settings.timer * 1000, total: S.settings.timer * 1000, paused: false, last: performance.now(), lastSec: null, ended: false };
    S.phase = 'answer';
    persist(); render();
    clearInterval(clockTimer);
    if (S.settings.timer > 0) clockTimer = setInterval(tickClock, 100);
  }
  function tickClock() {
    if (!T || T.ended) { clearInterval(clockTimer); return; }
    const now = performance.now(), dt = now - T.last;
    T.last = now;
    if (T.paused) return;
    T.left -= dt;
    paintClock();
    if (T.left <= 0) endTurn('time');
  }
  function paintClock() {
    if (!T || !(S.settings.timer > 0)) return;
    const sec = Math.max(0, Math.ceil(T.left / 1000));
    const el = $('#clock'), bar = $('#clockbar');
    if (bar) bar.style.transform = 'scaleX(' + Math.max(0, T.left / T.total).toFixed(3) + ')';
    if (el && sec !== T.lastSec) {
      T.lastSec = sec;
      el.textContent = sec;
      el.classList.toggle('low', sec <= 5);
      if (sec > 0 && sec <= 5 && !T.paused) sfx.tick();
    }
  }
  function submitAnswer(text) {
    if (!T || T.ended || !T.queue.length) return;
    text = String(text || '').trim().slice(0, 60);
    if (!text) { passQuestion(); return; }
    const R = cur(), p = R.order[R.turn], qi = T.queue.shift();
    R.ans[p][qi] = text;
    T.passed = T.passed.filter(x => x !== qi);
    sfx.blip();
    afterStep();
  }
  function passQuestion() {
    if (!T || T.ended || !T.queue.length) return;
    const qi = T.queue.shift();
    if (!T.passed.includes(qi)) { T.passed.push(qi); T.queue.push(qi); }
    else { T.passed = T.passed.filter(x => x !== qi); T.skipped.push(qi); }
    afterStep();
  }
  function afterStep() {
    if (!T.queue.length) endTurn('done');
    else { paintAnswer(); focusInput(); }
  }
  function togglePause() {
    if (!T || T.ended || !(S.settings.timer > 0)) return;
    T.paused = !T.paused;
    T.last = performance.now();
    const b = $('#pauseBtn'); if (b) b.textContent = T.paused ? 'Resume' : 'Pause';
    const c = $('#clock'); if (c) c.classList.toggle('paused', T.paused);
    focusInput();
  }
  function swapQuestion() {
    if (!T || T.ended) return;
    const R = cur();
    if (R.turn !== 0 || !T.queue.length) return;
    const qi = T.queue[0];
    const pick = pickQuestions(1);
    if (!pick.length) return;
    R.qs[qi] = pick[0];
    persist();
    paintAnswer(); focusInput();
  }
  function endTurn(reason) {
    if (!T || T.ended) return;
    T.ended = true;
    clearInterval(clockTimer);
    if (reason === 'time') sfx.buzz(1.1);
    S.phase = 'turnDone';
    S.turnReason = reason;
    persist(); render();
  }
  function nextAfterTurn() {
    const R = cur();
    R.turn++;
    T = null;
    if (R.turn < R.order.length) S.phase = 'handoff';
    else { buildResults(R); S.phase = 'revealIntro'; }
    persist(); render();
  }
  function buildResults(R) {
    R.res = {};
    R.order.forEach(p => {
      R.res[p] = R.qs.map((qIdx, qi) => {
        const m = matchAnswer(qIdx, R.ans[p][qi]);
        return { m, ok: m >= 0, host: false };
      });
    });
    R.rq = 0; R.rstep = 0; R.done = false;
  }

  /* ---------- Reveal ---------- */
  function stepsOf(R) {
    const s = [];
    R.order.forEach(p => { s.push({ t: 'say', p }); s.push({ t: 'judge', p }); });
    s.push({ t: 'rest' });
    return s;
  }
  function judged(R, qi, p) {
    if (!R.res) return false;
    if (R.done) return true;
    if (qi < R.rq) return true;
    if (qi > R.rq) return false;
    return R.rstep > 2 * R.order.indexOf(p) + 1;
  }
  function openTiles(R) {
    const st = stepsOf(R), set = new Set();
    for (let i = 0; i < R.rstep && i < st.length; i++) {
      const s = st[i];
      if (s.t === 'judge') { const r = R.res[s.p][R.rq]; if (r.m >= 0) set.add(r.m); }
      if (s.t === 'rest') QS[R.qs[R.rq]].a.forEach((_, j) => set.add(j));
    }
    return set;
  }
  function scores() {
    const out = S.players.map(() => 0);
    S.rounds.forEach(R => {
      if (!R.res) return;
      R.order.forEach(p => R.res[p].forEach((r, qi) => { if (r.ok && judged(R, qi, p)) out[p]++; }));
    });
    return out;
  }
  function revealNext() {
    const R = cur(), st = stepsOf(R);
    if (R.rstep < st.length) {
      const before = openTiles(R);
      const s = st[R.rstep];
      R.rstep++;
      const after = openTiles(R);
      fx = { fresh: [...after].filter(i => !before.has(i)) };
      if (s.t === 'say') {
        sfx.blip();
        const a = R.ans[s.p][R.rq];
        announce(nameOf(s.p) + ' said ' + (a || 'nothing'));
      } else if (s.t === 'judge') {
        const r = R.res[s.p][R.rq];
        if (r.ok) { sfx.ding(); announce('On the board. Plus 1 for ' + nameOf(s.p)); }
        else { sfx.buzz(); flashX(); announce('Not on the board'); }
      } else if (fx.fresh.length) {
        sfx.flip(fx.fresh.length);
      }
    } else if (R.rq < R.qs.length - 1) {
      R.rq++; R.rstep = 0; fx = null;
    } else {
      R.done = true; S.phase = 'summary'; fx = null;
      sfx.fanfare();
    }
    persist(); render();
  }
  function revealBack() {
    const R = cur();
    if (R.rstep > 0) R.rstep--;
    else if (R.rq > 0) { R.rq--; R.rstep = stepsOf(R).length; }
    fx = null;
    persist(); render();
  }
  function toggleCall(p, qi) {
    const R = cur();
    if (qi == null) qi = R.rq;
    if (!R.res || !R.res[p] || !judged(R, qi, p)) return;
    const r = R.res[p][qi];
    r.ok = !r.ok;
    r.host = !r.host;
    if (r.ok) sfx.ding(); else sfx.buzz(0.45);
    fx = null;
    persist(); render();
  }
  function nextLabel(R) {
    const st = stepsOf(R);
    if (R.rstep < st.length) {
      const s = st[R.rstep];
      if (s.t === 'say') return 'Show ' + esc(possessive(nameOf(s.p))) + ' answer';
      if (s.t === 'judge') return 'Survey says';
      return 'Show the whole board';
    }
    return R.rq < R.qs.length - 1 ? 'Next question' : 'See round results';
  }
  function flashX() {
    const x = $('#xmark'); if (!x) return;
    x.hidden = false;
    x.classList.remove('show');
    void x.offsetWidth;
    x.classList.add('show');
    clearTimeout(flashX.t);
    flashX.t = setTimeout(() => { x.hidden = true; x.classList.remove('show'); }, 1000);
  }

  function goHome() {
    if (S && S.phase === 'answer') { clearInterval(clockTimer); T = null; S.phase = 'handoff'; }
    screen = 'home';
    persist(); render();
    window.scrollTo(0, 0);
  }
  function toggleSound() {
    setup.sound = !setup.sound;
    saveSetup();
    document.querySelectorAll('[data-act="sound"]').forEach(b => {
      b.innerHTML = setup.sound ? ICON.soundOn : ICON.soundOff;
      b.setAttribute('aria-label', setup.sound ? 'Sound on. Turn off' : 'Sound off. Turn on');
      b.setAttribute('aria-pressed', String(setup.sound));
    });
    const cb = $('#soundToggle'); if (cb) cb.checked = setup.sound;
    if (setup.sound) sfx.blip();
  }

  /* ---------- Views ---------- */
  function soundBtn() {
    return `<button class="icon-btn" type="button" data-act="sound" aria-pressed="${setup.sound}" aria-label="${setup.sound ? 'Sound on. Turn off' : 'Sound off. Turn on'}">${setup.sound ? ICON.soundOn : ICON.soundOff}</button>`;
  }
  function topbar() {
    const R = cur();
    const total = S.settings.rounds > 0 ? ' of ' + S.settings.rounds : '';
    return `<header class="topbar">
      <button class="mini-logo" type="button" data-act="home" aria-label="Back to setup">Fast Money</button>
      <div class="tb-info">Round ${S.rounds.length}${total}${R ? '. ' + plural(R.qs.length, 'question') : ''}</div>
      ${soundBtn()}
    </header>`;
  }
  function scoresStrip() {
    const sc = scores(), max = Math.max.apply(null, sc);
    return `<div class="scores" aria-label="Scores">${S.players.map((pl, i) =>
      `<span class="chip${max > 0 && sc[i] === max ? ' lead' : ''}">${dot(i)}${esc(pl.name)}<b>${sc[i]}</b></span>`).join('')}</div>`;
  }
  function standingsHTML() {
    const sc = scores();
    const idx = S.players.map((_, i) => i).sort((a, b) => sc[b] - sc[a]);
    let rank = 0, prev = null;
    return `<ol class="standings">${idx.map((i, k) => {
      if (sc[i] !== prev) { rank = k + 1; prev = sc[i]; }
      return `<li class="${rank === 1 && sc[i] > 0 ? 'top' : ''}"><span class="rank">${rank}</span>${dot(i)}<span class="sname">${esc(nameOf(i))}</span><span class="spts" aria-label="${plural(sc[i], 'point')}">${sc[i]}</span></li>`;
    }).join('')}</ol>`;
  }
  function seg(name, label, opts) {
    return `<fieldset class="seg"><legend>${label}</legend><div class="seg-opts">${opts.map(([v, t]) =>
      `<label><input type="radio" id="${name}-${v}" name="${name}" value="${v}"${Number(setup.settings[name]) === v ? ' checked' : ''}><span>${t}</span></label>`).join('')}</div></fieldset>`;
  }

  function viewHome() {
    const used = new Set(store.get(K_USED, []));
    const fresh = QS.filter(q => !used.has(q.q)).length;
    const saved = S && S.phase !== 'final' && S.rounds.length;
    const n = setup.names.length;
    return `
    <a class="back-link" href="../"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>All games</a>
    <section class="hero">
      <div class="marquee">
        <h1 class="logo">Fast Money</h1>
        <p class="tag">Headphones edition</p>
      </div>
    </section>
    ${saved ? `<div class="resume" role="region" aria-label="Game in progress">
        <p><strong>Game in progress.</strong> Round ${S.rounds.length}, ${plural(S.players.length, 'player')}.</p>
        <button class="btn btn-gold" type="button" data-act="resume">Resume game</button>
        <button class="btn btn-ghost" type="button" data-act="discard">End it</button>
      </div>` : ''}
    <div class="home-grid">
      <section class="panel" aria-labelledby="players-h">

        <ol class="plist">

            <span class="pdot" style="--c:${PCOL[i % PCOL.length]}" aria-hidden="true">${i + 1}</span>

        <div class="settings">
          ${seg('perRound', 'Questions per round', [[3, '3'], [4, '4'], [5, '5'], [6, '6']])}

          ${seg('rounds', 'Rounds', [[1, '1'], [2, '2'], [3, '3'], [5, '5'], [0, 'No limit']])}

        </div>

      <section class="panel" aria-labelledby="how-h">
        <h2 class="h-sec" id="how-h">How to play</h2>
        <ol class="steps">
          <li>Pick a <b>host</b>. The host holds this phone or laptop and does not play.</li>

      </section>

  function viewHandoff() {
    const R = cur(), p = R.order[R.turn], nm = esc(nameOf(p));
    const others = R.turn === 0 ? 'Everyone else keeps theirs on.' : 'Players who have not gone yet keep theirs on.';
    const clock = S.settings.timer > 0 ? `You have ${S.settings.timer} seconds.` : 'There is no clock this game.';
    return `
    <section class="stage center">
      <p class="eyebrow">Turn ${R.turn + 1} of ${R.order.length}</p>

      <p class="lead">${nm}, take your headphones off. ${others}</p>
      <div class="hostnote">
        <strong class="h-sec">Host</strong>
        <p>Read each question out loud and type what ${nm} says. Press Enter to save it. If they say pass, press Pass. ${clock}</p>

  function viewAnswer() {
    const R = cur(), p = R.order[R.turn];
    const timed = S.settings.timer > 0;
    return `
    <section class="answer">
      <div class="ans-top">
        <div class="ans-who">${dot(p)}<div><p class="eyebrow">Answering now</p><p class="ans-name">${esc(nameOf(p))}</p></div></div>
        <div class="clockwrap" role="timer" aria-label="Time left">
          ${timed ? `<div class="clock" id="clock">${S.settings.timer}</div><div class="clockbar"><i id="clockbar"></i></div>` : '<div class="clock off">No clock</div>'}
        </div>
      </div>
      <div class="qcard">
        <p class="qnum" id="qnum"></p>
        <p class="qtext" id="qtext"></p>
      </div>
      <form class="ans-form" id="ansForm" autocomplete="off">
        <label class="sr" for="ansInput">Their answer</label>
        <input id="ansInput" class="ans-input" type="text" maxlength="60" placeholder="Type their answer" enterkeyhint="next" autocapitalize="sentences" autocorrect="off" spellcheck="false">
        <button class="btn btn-gold" type="submit">Save</button>
        <button class="btn" type="button" data-act="pass">Pass</button>
      </form>

        <button class="btn btn-ghost" type="button" id="swapBtn" data-act="swap">Swap question</button>
        <button class="btn btn-ghost" type="button" data-act="end-turn">End turn</button>
      </div>

  }
  function slotsHTML() {
    const R = cur(), p = R.order[R.turn], live = T && !T.ended ? T.queue[0] : -1;
    return R.qs.map((_, i) => {
      const a = R.ans[p][i];
      let cls = 'slot', txt = '';
      if (a) { cls += ' filled'; txt = esc(a); }
      else if (T && T.passed.includes(i)) { cls += ' passed'; txt = 'Passed'; }
      else if (T && T.skipped.includes(i)) { cls += ' skipped'; txt = 'No answer'; }
      if (i === live) cls += ' current';
      return `<li class="${cls}"><span class="slot-n">${i + 1}</span><span class="slot-t">${txt}</span></li>`;
    }).join('');
  }
  function paintAnswer() {
    if (!T || !T.queue.length) return;
    const R = cur(), qi = T.queue[0];
    const back = T.passed.includes(qi);
    $('#qnum').textContent = 'Question ' + (qi + 1) + ' of ' + R.qs.length + (back ? '. Passed earlier.' : '');
    $('#qtext').textContent = QS[R.qs[qi]].q;
    $('#slots').innerHTML = slotsHTML();
    const sw = $('#swapBtn'); if (sw) sw.hidden = !(R.turn === 0 && !back);
    const inp = $('#ansInput'); if (inp) inp.value = '';
  }
  function focusInput() { const i = $('#ansInput'); if (i) i.focus(); }

  function viewTurnDone() {
    const R = cur(), p = R.order[R.turn], nm = esc(nameOf(p));
    const last = R.turn === R.order.length - 1;
    const nextP = last ? null : R.order[R.turn + 1];
    return `
    <section class="stage center">
      <p class="eyebrow">${nm} is done</p>
      <h2 class="title">${S.turnReason === 'time' ? "Time's up" : 'All done'}</h2>
      <p class="lead">Fix any typos now. Keep this screen away from players who have not gone yet.</p>
      <ol class="recap">
        ${R.qs.map((qIdx, i) => `<li>
          <label for="fix-${i}">${i + 1}. ${esc(QS[qIdx].q)}</label>
          <input id="fix-${i}" data-fix="${i}" type="text" maxlength="60" autocomplete="off" placeholder="No answer" value="${esc(R.ans[p][i])}">
        </li>`).join('')}
      </ol>
      <button class="btn btn-gold btn-big" type="button" data-act="next-player">${last ? 'Everyone is done' : 'Next player: ' + esc(nameOf(nextP))}</button>
    </section>`;
  }

  function viewRevealIntro() {
    const R = cur();
    return `
    <section class="stage center">
      <p class="eyebrow">Round ${S.rounds.length} reveal</p>
      <h2 class="title">Headphones off</h2>
      <p class="lead">Everyone can listen now. The host reads each question, then what every player said. If it is on the board, it scores.</p>
      <div class="hostnote">
        <strong class="h-sec">Host</strong>
        <p>Press the big button to go one step at a time. You can also press Space. If the board gets one wrong, tap that player's answer to change the call.</p>
      </div>
      <button class="btn btn-gold btn-big" type="button" data-act="reveal-start">Show question 1 of ${R.qs.length}</button>
      ${scoresStrip()}
    </section>`;
  }

  function viewReveal() {
    const R = cur(), Q = QS[R.qs[R.rq]], st = stepsOf(R);
    const open = openTiles(R), fresh = new Set(fx ? fx.fresh : []);
    const nowStep = st[R.rstep];
    const tiles = [];
    Q.a.forEach((ans, i) => {
      const isOpen = open.has(i), isFresh = fresh.has(i);
      const who = R.order.filter(p => R.res[p][R.rq].m === i && R.res[p][R.rq].ok && judged(R, R.rq, p)).map(p => dot(p, ` title="${esc(nameOf(p))}"`)).join('');
      const delay = isFresh ? [...fresh].indexOf(i) * 120 : 0;
      tiles.push(`<div class="tile${isOpen && !isFresh ? ' open' : ''}"${isFresh ? ' data-flip' : ''} style="--d:${delay}ms">
        <div class="tile-in">
          <div class="face front"><span class="num">${i + 1}</span></div>
          <div class="face back"${isOpen ? '' : ' aria-hidden="true"'}><span class="txt">${isOpen ? esc(ans.label) : ''}</span><span class="who">${who}</span></div>
        </div></div>`);
    });
    for (let i = Q.a.length; i < 8; i++) tiles.push('<div class="tile empty" aria-hidden="true"><div class="tile-in"><div class="face front"></div></div></div>');

    const cards = R.order.map((p, k) => {
      const said = R.rstep > 2 * k, jd = R.rstep > 2 * k + 1;
      const r = R.res[p][R.rq], a = R.ans[p][R.rq];
      const isNow = nowStep && nowStep.p === p;
      let cls = 'pcard';
      if (jd) cls += r.ok ? ' ok' : ' no';
      if (isNow) cls += ' now';
      const ansHtml = said ? (a ? `<span class="pa">${esc(a)}</span>` : '<span class="pa blank">No answer</span>') : '<span class="pa hide">???</span>';
      const badge = jd ? (r.ok ? '<span class="pr ok">+1</span>' : `<span class="pr no">${ICON.x}</span>`) : '';
      const label = jd ? `${esc(nameOf(p))}: ${esc(a || 'no answer')}. ${r.ok ? 'Counts.' : 'Does not count.'} Tap to change.` : esc(nameOf(p));
      return `<button class="${cls}" type="button" data-act="toggle" data-p="${p}"${jd ? '' : ' disabled'} aria-label="${label}">
        <span class="pn">${dot(p)}${esc(nameOf(p))}</span>${ansHtml}${badge}${jd && r.host ? '<span class="hostcall">Host call</span>' : ''}
      </button>`;
    }).join('');

    return `
    ${scoresStrip()}
    <section class="reveal">
      <div class="qbanner">
        <p class="qnum">Question ${R.rq + 1} of ${R.qs.length}</p>
        <p class="qtext">${esc(Q.q)}</p>
      </div>
      <div class="board"><div class="tiles">${tiles.join('')}</div></div>
      <div class="pcards">${cards}</div>
      <div class="console">
        <button class="btn btn-ghost" type="button" data-act="reveal-back"${R.rq === 0 && R.rstep === 0 ? ' disabled' : ''}>Back</button>
        <button class="btn btn-gold btn-big" type="button" data-act="reveal-next">${nextLabel(R)}</button>
      </div>
      <p class="hint">Tap an answer to change the call. Space also moves on.</p>
    </section>`;
  }

  function viewSummary() {
    const R = cur();
    const limit = S.settings.rounds;
    const isLast = limit > 0 && S.rounds.length >= limit;
    const boards = R.order.map(p => {
      const total = R.res[p].filter(r => r.ok).length;
      return `<div class="fm">
        <div class="fm-head">${dot(p)}<span>${esc(nameOf(p))}</span></div>
        ${R.qs.map((qIdx, qi) => {
          const r = R.res[p][qi], a = R.ans[p][qi];
          return `<button class="fm-row${r.ok ? '' : ' miss'}" type="button" data-act="toggle-sum" data-p="${p}" data-q="${qi}" aria-label="${esc(QS[qIdx].q)} ${esc(nameOf(p))} said ${esc(a || 'nothing')}. ${r.ok ? '1 point' : '0 points'}. Tap to change.">
            <span class="fm-ans">${a ? esc(a) : 'No answer'}</span><span class="fm-pts">${r.ok ? 1 : 0}</span>
          </button>`;
        }).join('')}
        <div class="fm-total"><span>Total</span><span class="fm-pts">${total}</span></div>
      </div>`;
    }).join('');
    return `
    <section class="stage">
      <div class="center">
        <p class="eyebrow">Round ${S.rounds.length}${limit > 0 ? ' of ' + limit : ''}</p>
        <h2 class="title">Round results</h2>
      </div>
      <div class="fm-grid">${boards}</div>
      <p class="hint">Tap an answer to change the call.</p>
      <div class="results-foot">
        <h3 class="h-sec">Standings</h3>
        ${standingsHTML()}
      </div>
      <div class="console">
        ${isLast
          ? '<button class="btn btn-gold btn-big" type="button" data-act="end-game">See the winner</button>'
          : `<button class="btn btn-ghost" type="button" data-act="end-game">End game</button>
             <button class="btn btn-gold btn-big" type="button" data-act="next-round">Start round ${S.rounds.length + 1}</button>`}
      </div>
    </section>`;
  }

  function viewFinal() {
    const sc = scores(), max = Math.max.apply(null, sc);
    const winners = S.players.map((_, i) => i).filter(i => sc[i] === max);
    const tie = winners.length > 1;
    const names = winners.map(nameOf);
    const joined = names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names[0];
    const line = tie ? `${esc(joined)} tie with ${plural(max, 'point')}.` : `${esc(joined)} wins with ${plural(max, 'point')}.`;
    return `
    <section class="stage center final">
      <p class="eyebrow">Game over</p>
      <div class="marquee">
        <p class="tag">${tie ? 'Tie game' : 'Winner'}</p>
        <h2 class="logo win-name">${esc(tie ? names.join(' & ') : names[0])}</h2>
      </div>
      <p class="lead">${line}</p>
      ${standingsHTML()}
      <div class="console">
        <button class="btn btn-ghost" type="button" data-act="new-game">New players</button>
        <button class="btn btn-gold btn-big" type="button" data-act="play-again">Play again</button>
      </div>
    </section>`;
  }

  /* ---------- Render ---------- */
  const app = document.getElementById('app');
  const VIEWS = { handoff: viewHandoff, answer: viewAnswer, turnDone: viewTurnDone, revealIntro: viewRevealIntro, reveal: viewReveal, summary: viewSummary, final: viewFinal };
  function render() {
    stopConfetti();
    if (!S || screen !== 'game' || S.phase !== 'reveal') { const x = $('#xmark'); if (x) { x.hidden = true; x.classList.remove('show'); } }
    if (screen !== 'game' || !S) { app.innerHTML = viewHome(); return; }
    const v = VIEWS[S.phase] || viewHandoff;
    app.innerHTML = topbar() + v();
    if (S.phase === 'answer') {
      paintAnswer();
      if (T) { T.lastSec = null; paintClock(); }
      focusInput();
    }
    if (S.phase === 'reveal' && fx && fx.fresh.length) {
      const els = app.querySelectorAll('.tile[data-flip]');
      requestAnimationFrame(() => requestAnimationFrame(() => els.forEach(el => el.classList.add('open'))));
    }
    if (S.phase === 'final' && celebrate) { celebrate = false; confetti(); }
  }

  /* ---------- Confetti ---------- */
  let confettiRAF = 0;
  function confetti() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = $('#confetti'); if (!cv || !cv.getContext) return;
    const ctx = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = window.innerWidth, H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.scale(dpr, dpr);
    cv.hidden = false;
    const cols = ['#ffc53a', '#ffe9a0', '#3466ea', '#ffffff', '#f0313b', '#56d6ff'];
    const parts = Array.from({ length: 170 }, () => ({
      x: Math.random() * W, y: -20 - Math.random() * H * 0.7,
      vx: (Math.random() - 0.5) * 2.4, vy: 2 + Math.random() * 3.4,
      r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.25,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 10,
      c: cols[(Math.random() * cols.length) | 0]
    }));
    const start = performance.now();
    cancelAnimationFrame(confettiRAF);
    function frame(now) {
      ctx.clearRect(0, 0, W, H);
      let alive = 0;
      parts.forEach(pt => {
        pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.02; pt.r += pt.vr;
        if (pt.y < H + 30) alive++;
        ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(pt.r);
        ctx.fillStyle = pt.c;
        ctx.fillRect(-pt.w / 2, -pt.h / 2, pt.w, Math.max(1, pt.h * Math.abs(Math.cos(pt.r * 2))));
        ctx.restore();
      });
      if (alive && now - start < 8000) confettiRAF = requestAnimationFrame(frame);
      else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
    }
    confettiRAF = requestAnimationFrame(frame);
  }
  function stopConfetti() {
    cancelAnimationFrame(confettiRAF);
    const cv = $('#confetti'); if (cv) cv.hidden = true;
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    switch (act) {
      case 'sound': toggleSound(); break;
      case 'home': goHome(); break;
      case 'add-player':
        if (setup.names.length < MAX_PLAYERS) { setup.names.push(''); saveSetup(); render(); const el = $('#pname-' + (setup.names.length - 1)); if (el) el.focus(); }
        break;
      case 'remove-player':
        if (setup.names.length > 1) { setup.names.splice(Number(b.dataset.i), 1); saveSetup(); render(); }
        break;
      case 'start': startGame(); break;
      case 'resume':
        sfx.unlock();
        if (S.phase === 'answer') S.phase = 'handoff';
        screen = 'game'; wake(); render(); window.scrollTo(0, 0);
        break;
      case 'discard': S = null; persist(); render(); break;
      case 'reset-used': store.del(K_USED); render(); break;
      case 'start-turn': beginTurn(); break;
      case 'pass': passQuestion(); break;
      case 'pause': togglePause(); break;
      case 'swap': swapQuestion(); break;
      case 'end-turn': endTurn('done'); break;
      case 'next-player': nextAfterTurn(); window.scrollTo(0, 0); break;
      case 'reveal-start': sfx.unlock(); S.phase = 'reveal'; fx = null; persist(); render(); window.scrollTo(0, 0); break;
      case 'reveal-next': revealNext(); break;
      case 'reveal-back': revealBack(); break;
      case 'toggle': toggleCall(Number(b.dataset.p)); break;
      case 'toggle-sum': toggleCall(Number(b.dataset.p), Number(b.dataset.q)); break;
      case 'next-round': newRound(); persist(); render(); window.scrollTo(0, 0); break;
      case 'end-game': S.phase = 'final'; celebrate = true; sfx.fanfare(); persist(); render(); window.scrollTo(0, 0); break;
      case 'play-again': playAgain(); window.scrollTo(0, 0); break;
      case 'new-game': S = null; persist(); screen = 'home'; render(); window.scrollTo(0, 0); break;
    }
  });

  document.addEventListener('submit', e => {
    if (e.target.id === 'ansForm') {
      e.preventDefault();
      const i = $('#ansInput');
      submitAnswer(i ? i.value : '');
    } else {
      e.preventDefault();
    }
  });

  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.name != null) { setup.names[Number(t.dataset.name)] = t.value; saveSetup(); }
    else if (t.dataset.fix != null && S && S.phase === 'turnDone') {
      const R = cur(), p = R.order[R.turn];
      R.ans[p][Number(t.dataset.fix)] = t.value.trim().slice(0, 60);
      persist();
    }
  });

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.type === 'radio' && t.name in DEFAULTS) { setup.settings[t.name] = Number(t.value); saveSetup(); }
    else if (t.id === 'soundToggle') { if (t.checked !== setup.sound) toggleSound(); }
  });

  document.addEventListener('keydown', e => {
    if (screen !== 'game' || !S || S.phase !== 'reveal') return;
    if (e.target.closest && e.target.closest('button,input,textarea,select,a')) return;
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); revealNext(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); revealBack(); }
  });

  /* ---------- Boot ---------- */
  function boot(data) {
    if (data && data.S) { S = data.S; screen = data.screen || 'home'; }
    if (S && S.phase === 'answer') S.phase = 'handoff';
    render();
  }
  boot({});

})();
</script>
</body>
</html>
