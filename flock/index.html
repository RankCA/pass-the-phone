<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flock | Pass the Phone</title>
<meta name="description" content="Think like the flock. Everyone answers the same question in secret, and the most popular answer scores. Stand alone and you get the black sheep.">
<meta name="theme-color" content="#dff0ff">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;900&family=Lexend:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../shared/base.css?v=21cb0b0f">
<style>
/* Layout: a field of sheep. Sky at the top, wool-white cards, grass-green buttons. */
:root{
  color-scheme:light;
  --bg:#f3f0e4;
  --fg:#1f2a1b;
  --muted:#4a5a42;
  --panel:#ffffff;
  --line:rgba(31,42,27,.22);
  --field:#ffffff;
  --field-ink:#1f2a1b;
  --accent:#2d7a34;
  --accent-ink:#ffffff;
  --accent-shadow:#1b4d20;
  --focus:#2d7a34;
  --f-display:"Grandstander","Arial Rounded MT Bold",sans-serif;
  --f-body:"Lexend",system-ui,-apple-system,sans-serif;
}
html{background:var(--bg)}
body{background:linear-gradient(180deg,#dff0ff 0,#eef6ef 220px,var(--bg) 420px)}
.title{font-weight:900;color:var(--fg)}
.hero{display:block;width:min(60vw,230px);height:auto;margin-top:6px}
.panel{box-shadow:0 1px 0 rgba(31,42,27,.08),0 14px 30px -22px rgba(31,42,27,.5)}
.label,.btn,.howto summary{font-weight:700}
.big{font-weight:900}
.q{margin:8px auto 0;max-width:16em;font-family:var(--f-display);font-weight:900;font-size:clamp(30px,8vw,52px);line-height:1.08;text-wrap:balance;overflow-wrap:anywhere}
.q.small{font-size:clamp(22px,6vw,32px)}
.groups{display:grid;gap:10px;max-width:520px;margin:20px auto 0;text-align:left}
.grp{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:18px;background:#fff;color:var(--fg);font:inherit;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line)}
.grp[aria-pressed="true"]{background:#e3f2df;box-shadow:inset 0 0 0 3px var(--accent)}
.grp.win{box-shadow:inset 0 0 0 3px var(--accent);background:#e3f2df}
div.grp{cursor:default}
.grp .n{display:grid;place-items:center;min-width:44px;height:44px;padding:0 8px;border-radius:14px;background:var(--fg);color:#fff;font-family:var(--f-display);font-weight:900;font-size:22px}
.grp b{display:block;font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.grp small{display:block;margin-top:2px;font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.board{list-style:none;margin:18px auto 0;padding:0;display:grid;gap:6px;max-width:440px;text-align:left}
.board li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:#fff;font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.board li.top{box-shadow:inset 0 0 0 3px var(--accent)}
.board li span{flex:1;min-width:0;overflow-wrap:anywhere}
.board li b{font-family:var(--f-display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.bs{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 4px;border-radius:999px;background:#1f2a1b;color:#fff;font-size:13px;font-weight:700}
.bs svg{width:22px;height:22px}
.verdict{margin:6px 0 0;font-family:var(--f-display);font-weight:900;font-size:clamp(28px,7vw,44px);line-height:1.1;text-wrap:balance}
.note{margin:12px auto 0;max-width:30em;font-size:17px;color:var(--muted)}
.merge{position:sticky;bottom:12px;z-index:5}
.field input{box-shadow:inset 0 0 0 2px var(--line)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../shared/party.js?v=ab12cd68"></script>
<script src="../shared/online.js?v=29268f09"></script>
<script src="questions.js?v=d3ce72d7"></script>
<script>
(function () {
  'use strict';
  const P = window.Party, sfx = P.sfx, esc = P.esc;
  const KEY = 'ptp.flock';
  const app = document.getElementById('app');
  const deck = P.deck('flock', window.FLOCK_QUESTIONS || ['Name a pizza topping.']);
  const sheepG = (wool, face) => '<g fill="' + face + '"><rect x="34" y="62" width="8" height="22" rx="3"/><rect x="54" y="64" width="8" height="22" rx="3"/><rect x="72" y="64" width="8" height="22" rx="3"/><rect x="88" y="62" width="8" height="22" rx="3"/></g><path d="M30 50a14 14 0 0 1 10-24 16 16 0 0 1 26-8 16 16 0 0 1 26 6 14 14 0 0 1 8 26 13 13 0 0 1-14 18 16 16 0 0 1-26 2 15 15 0 0 1-24-2 13 13 0 0 1-6-18z" fill="' + wool + '" stroke="#1f2a1b" stroke-width="4"/><ellipse cx="22" cy="42" rx="15" ry="18" fill="' + face + '" stroke="#1f2a1b" stroke-width="4"/><circle cx="17" cy="39" r="3" fill="#fff"/><circle cx="26" cy="39" r="3" fill="#fff"/><path d="M8 30q-6-2-8 4M34 28q6-4 9 1" stroke="#1f2a1b" stroke-width="4" fill="none" stroke-linecap="round"/>';
  const SHEEP = (wool, face) => '<svg viewBox="0 0 120 90" aria-hidden="true">' + sheepG(wool, face) + '</svg>';
  const HERO = '<svg class="hero" viewBox="0 0 260 120" aria-hidden="true"><ellipse cx="130" cy="112" rx="124" ry="10" fill="#7fc36b"/><g transform="translate(10 18)">' + sheepG('#fff', '#3b3b3b') + '</g><g transform="translate(130 18)">' + sheepG('#fff', '#3b3b3b') + '</g><g transform="translate(76 30) scale(.8)">' + sheepG('#2b2b2b', '#111') + '</g></svg>';
  const BLACK = SHEEP('#2b2b2b', '#111');

  const saved = P.store.get(KEY, {}) || {};
  const S = {
    settings: Object.assign({ goal: 8, sheep: 'yes' }, saved.settings || {}),
    screen: 'setup', players: [], scores: {}, sheep: null, q: '', answers: {}, at: 0, groups: [], sel: [], round: 0, last: null, winner: []
  };
  let editor = null, shown = null;
  function persist() { P.store.set(KEY, { settings: S.settings }); }

  /* ---------- Rounds ---------- */
  function newRound() {
    S.round++;
    S.q = deck.one([S.q]);
    S.answers = {};
    S.at = 0;
    S.groups = [];
    S.sel = [];
    S.screen = 'question';
    render();
  }
  function group() {
    const gs = [];
    S.players.forEach(n => {
      const a = S.answers[n];
      const g = gs.find(x => x.keys.some(k => P.sameAnswer(k, a)));
      if (g) { g.names.push(n); g.keys.push(a); } else gs.push({ label: a, keys: [a], names: [n] });
    });
    S.groups = gs.sort((a, b) => b.names.length - a.names.length);
    S.sel = [];
  }
  function merge() {
    if (S.sel.length < 2) return;
    const picked = S.sel.map(i => S.groups[i]).sort((a, b) => b.names.length - a.names.length);
    const into = picked[0];
    picked.slice(1).forEach(g => { into.names.push(...g.names); into.keys.push(...g.keys); });
    S.groups = S.groups.filter(g => !picked.slice(1).includes(g)).sort((a, b) => b.names.length - a.names.length);
    S.sel = [];
    sfx.pop();
    render();
  }
  function scoreRound() {
    const gs = S.groups;
    const top = gs[0].names.length;
    const tied = gs.filter(g => g.names.length === top).length > 1;
    const winners = !tied && top > 1 ? gs[0].names.slice() : [];
    winners.forEach(n => { S.scores[n] = (S.scores[n] || 0) + 1; });
    let lone = null;
    if (S.settings.sheep === 'yes') {
      const loners = gs.filter(g => g.names.length === 1);
      if (loners.length === 1) lone = loners[0].names[0];
    }
    const passedFrom = lone && S.sheep && S.sheep !== lone ? S.sheep : null;
    if (lone) S.sheep = lone;
    S.last = { winners, tied, top, lone, passedFrom, label: gs[0].label };
    const eligible = S.players.filter(n => (S.scores[n] || 0) >= S.settings.goal && n !== S.sheep);
    if (eligible.length) {
      const best = Math.max(...eligible.map(n => S.scores[n]));
      S.winner = eligible.filter(n => S.scores[n] === best);
      S.screen = 'final';
      render();
      sfx.win();
      P.confetti({ colors: ['#2d7a34', '#ffffff', '#7fc36b', '#ffd23f', '#1f2a1b'] });
      return;
    }
    S.screen = 'score';
    render();
    if (winners.length) sfx.ding(); else sfx.lose();
  }

  /* ---------- Views ---------- */
  function boardHTML() {
    const rows = S.players.map(n => [n, S.scores[n] || 0]).sort((a, b) => b[1] - a[1]);
    const top = rows.length ? rows[0][1] : 0;
    return '<ol class="board">' + rows.map(r => '<li' + (top > 0 && r[1] === top ? ' class="top"' : '') + '><span>' + esc(r[0]) + '</span>' +
      (S.sheep === r[0] ? '<span class="bs">' + BLACK + 'Black sheep</span>' : '') + '<b>' + r[1] + '</b></li>').join('') + '</ol>';
  }
  function viewSetup() {
    return P.header() + `
    <h1 class="title">Flock</h1>
    ${HERO}
    <p class="tagline">Think like the flock. Everyone answers the same question in secret, and the most popular answer scores.</p>
    <div class="panel">
      <div class="sec"><span class="label">Players</span><div id="players"></div></div>
      <div class="sec"><span class="label">First to</span>${P.seg('goal', [[5, '5 points'], [8, '8 points'], [10, '10 points']], S.settings.goal)}</div>
      <div class="sec"><span class="label">Black sheep</span>${P.seg('sheep', [['yes', 'On'], ['no', 'Off']], S.settings.sheep)}<p class="hint">Anyone left alone with an answer takes the black sheep. You cannot win while you hold it.</p></div>
      <div class="actions"><button class="btn btn-main btn-big" type="button" data-act="start">Round them up</button></div>
    </div>
    <div class="panel">
      <span class="label">Play online</span>
      <p class="hint">Everyone answers on their own phone. Make a game, then send the code to your friends.</p>
      <div class="actions"><a class="btn btn-alt" href="?lobby=new">Make an online game</a><a class="btn btn-alt" href="../online/">Join with a code</a></div>
    </div>
    <details class="howto">
      <summary>How to play</summary>
      <ol>
        <li>Someone reads the question out loud, like "Name a pizza topping".</li>
        <li>Pass the phone round. Everyone types an answer in secret. Try to give the answer you think most people will give.</li>
        <li>The phone groups matching answers. Tap two groups to merge them if they mean the same thing.</li>
        <li>Everyone in the biggest group scores a point. If two groups tie for biggest, nobody scores.</li>
        <li>If exactly one player stands alone, they take the black sheep until someone else does. First to the goal wins, but not while holding the black sheep.</li>
      </ol>
    </details>`;
  }
  function viewQuestion() {
    return P.header() + `
    <section class="center">
      <p class="eyebrow">Question ${S.round}</p>
      <p class="q">${esc(S.q)}</p>
      <p class="lead">Read it out loud. Then pass the phone so everyone can answer in secret.</p>
      <div class="actions center"><button class="btn btn-main btn-big" type="button" data-act="begin">Start answering</button><button class="btn btn-alt" type="button" data-act="skip">Another question</button></div>
      ${boardHTML()}
    </section>`;
  }
  function viewPass() {
    const n = S.players[S.at];
    return P.header() + P.passScreen({ eyebrow: 'Answer ' + (S.at + 1) + ' of ' + S.players.length, name: n, lead: 'Only ' + esc(n) + ' looks at the screen.', act: 'me' });
  }
  function viewAnswer() {
    const n = S.players[S.at];
    return P.header() + `
    <section class="center">
      <p class="eyebrow">${esc(n)}</p>
      <p class="q small">${esc(S.q)}</p>
      <div class="field"><label for="ans">Your answer</label><input id="ans" type="text" maxlength="32" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" placeholder="Think like the flock"></div>
      <div class="actions center"><button class="btn btn-main btn-big" type="button" data-act="lock" id="lockBtn" disabled>Lock it in</button></div>
    </section>`;
  }
  function viewReady() {
    return P.header() + `
    <section class="center">
      <p class="eyebrow">Everyone has answered</p>
      <h2 class="big">Gather round</h2>
      <p class="lead">Put the phone where everyone can see it.</p>
      <div class="actions center"><button class="btn btn-main btn-big" type="button" data-act="reveal">Show the answers</button></div>
    </section>`;
  }
  function viewReveal() {
    return P.header() + `
    <section class="center">
      <p class="eyebrow">Question ${S.round}</p>
      <p class="q small">${esc(S.q)}</p>
      <p class="note">Tap groups that mean the same thing, then merge them.</p>
      <div class="groups">${S.groups.map((g, i) => `<button type="button" class="grp" data-act="pick" data-i="${i}" aria-pressed="${S.sel.includes(i)}"><span class="n">${g.names.length}</span><span><b>${esc(g.label)}</b><small>${esc(P.listNames(g.names))}</small></span></button>`).join('')}</div>
      <div class="actions center merge">${S.sel.length >= 2 ? '<button class="btn btn-alt" type="button" data-act="merge">Merge these ' + S.sel.length + '</button>' : ''}<button class="btn btn-main btn-big" type="button" data-act="score">Score the round</button></div>
    </section>`;
  }
  function viewScore() {
    const L = S.last;
    let head, line;
    if (L.winners.length) { head = 'The flock said ' + L.label; line = P.listNames(L.winners) + (L.winners.length === 1 ? ' scores a point.' : ' score a point each.'); }
    else if (L.tied) { head = 'Split flock'; line = 'Two groups tied for biggest, so nobody scores.'; }
    else { head = 'No flock at all'; line = 'Everyone said something different, so nobody scores.'; }
    let sheep = '';
    if (L.lone) sheep = esc(L.lone) + ' stood alone and takes the black sheep' + (L.passedFrom ? ' from ' + esc(L.passedFrom) : '') + '.';
    return P.header() + `
    <section class="center">
      <p class="eyebrow">Question ${S.round}</p>
      <h2 class="verdict">${esc(head)}</h2>
      <p class="lead">${esc(line)}</p>
      ${sheep ? `<p class="lead"><span class="bs">${BLACK}Black sheep</span> ${sheep}</p>` : ''}
      ${boardHTML()}
      <div class="actions center"><button class="btn btn-main btn-big" type="button" data-act="next">Next question</button></div>
    </section>`;
  }
  function viewFinal() {
    return P.header() + `
    <section class="center">
      <p class="eyebrow">Game over</p>
      <h2 class="big">${esc(P.listNames(S.winner))} ${S.winner.length > 1 ? 'win' : 'wins'}</h2>
      <p class="lead">Nobody thinks like the flock quite like ${S.winner.length > 1 ? 'them' : esc(S.winner[0])}.</p>
      ${boardHTML()}
      <div class="actions center"><button class="btn btn-alt" type="button" data-act="setup">Change setup</button><button class="btn btn-main btn-big" type="button" data-act="again">Play again</button></div>
    </section>`;
  }

  const VIEWS = { setup: viewSetup, question: viewQuestion, pass: viewPass, answer: viewAnswer, ready: viewReady, reveal: viewReveal, score: viewScore, final: viewFinal };
  function render() {
    app.innerHTML = (VIEWS[S.screen] || viewSetup)();
    if (S.screen === 'setup') editor = P.playerEditor(document.getElementById('players'), { min: 3, max: 16 });
    if (S.screen === 'answer') { const f = document.getElementById('ans'); if (f) f.focus(); }
    if (S.screen !== shown || S.screen === 'pass') window.scrollTo(0, 0);
    shown = S.screen;
  }
  function lock() {
    const f = document.getElementById('ans');
    const v = f ? f.value.replace(/\s+/g, ' ').trim().slice(0, 32) : '';
    if (!v) return;
    S.answers[S.players[S.at]] = v;
    sfx.pop();
    S.at++;
    S.screen = S.at >= S.players.length ? 'ready' : 'pass';
    render();
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    switch (b.getAttribute('data-act')) {
      case 'start':
        S.players = editor.get();
        S.scores = {};
        S.sheep = null;
        S.round = 0;
        sfx.unlock();
        P.stayAwake();
        newRound();
        break;
      case 'skip': S.round--; newRound(); break;
      case 'begin': S.at = 0; S.screen = 'pass'; render(); break;
      case 'me': S.screen = 'answer'; render(); break;
      case 'lock': lock(); break;
      case 'reveal': group(); S.screen = 'reveal'; sfx.whoosh(); render(); break;
      case 'pick': {
        const i = Number(b.getAttribute('data-i'));
        const at = S.sel.indexOf(i);
        if (at >= 0) S.sel.splice(at, 1); else S.sel.push(i);
        render();
        break;
      }
      case 'merge': merge(); break;
      case 'score': scoreRound(); break;
      case 'next': newRound(); break;
      case 'again': S.scores = {}; S.sheep = null; S.round = 0; newRound(); break;
      case 'setup': S.screen = 'setup'; render(); break;
    }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'ans') { const btn = document.getElementById('lockBtn'); if (btn) btn.disabled = !e.target.value.trim(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'ans') { e.preventDefault(); lock(); }
  });
  document.addEventListener('change', e => {
    if (e.target.name === 'goal') { S.settings.goal = Number(e.target.value); persist(); }
    if (e.target.name === 'sheep') { S.settings.sheep = e.target.value; persist(); }
  });

  /* ---------- Online: everyone answers on their own phone ---------- */
  const cleanAns = t => String(t == null ? '' : t).replace(/\s+/g, ' ').trim().slice(0, 32);
  function newQuestion(F) {
    F.round++;
    F.qid++;
    F.q = deck.one([F.q]);
    F.answers = {};
    F.groups = [];
    F.phase = 'answer';
  }
  function revealAll(F) {
    const gs = [];
    F.players.forEach(p => {
      const a = F.answers[p.id];
      if (!a) return;
      const g = gs.find(x => x.keys.some(k => P.sameAnswer(k, a)));
      if (g) { g.ids.push(p.id); g.keys.push(a); } else gs.push({ label: a, keys: [a], ids: [p.id] });
    });
    F.groups = gs.sort((a, b) => b.ids.length - a.ids.length);
    F.phase = 'reveal';
  }
  function scoreOnline(F) {
    const gs = F.groups;
    const top = gs.length ? gs[0].ids.length : 0;
    const tied = gs.filter(g => g.ids.length === top).length > 1;
    const winners = !tied && top > 1 ? gs[0].ids.slice() : [];
    winners.forEach(id => { F.scores[id] = (F.scores[id] || 0) + 1; });
    let lone = null;
    if (F.sheepOn) {
      const loners = gs.filter(g => g.ids.length === 1);
      if (loners.length === 1) lone = loners[0].ids[0];
    }
    const passedFrom = lone && F.sheep && F.sheep !== lone ? F.sheep : null;
    if (lone) F.sheep = lone;
    F.last = { winners, tied, top, lone, passedFrom, label: gs.length ? gs[0].label : '' };
    const eligible = F.players.filter(p => (F.scores[p.id] || 0) >= F.goal && p.id !== F.sheep);
    if (eligible.length) {
      const best = Math.max(...eligible.map(p => F.scores[p.id]));
      F.winner = eligible.filter(p => F.scores[p.id] === best).map(p => p.id);
      F.phase = 'final';
    } else F.phase = 'score';
  }
  function onlineBoard(F, me) {
    const rows = F.players.map(p => [p, F.scores[p.id] || 0]).sort((a, b) => b[1] - a[1]);
    const top = rows.length ? rows[0][1] : 0;
    return '<ol class="board">' + rows.map(([p, n]) => '<li' + (top > 0 && n === top ? ' class="top"' : '') + '><span>' + esc(p.name) + (p.id === me ? ' (you)' : '') + '</span>' +
      (F.sheep === p.id ? '<span class="bs">' + BLACK + 'Black sheep</span>' : '') + '<b>' + n + '</b></li>').join('') + '</ol>';
  }
  const ONLINE = {
    game: 'flock', title: 'Flock', min: 3, max: 12,
    options() {
      return `<p class="label">First to</p>${P.seg('o-goal', [[5, '5 points'], [8, '8 points'], [10, '10 points']], S.settings.goal)}
        <p class="label" style="margin-top:18px">Black sheep</p>${P.seg('o-sheep', [['yes', 'On'], ['no', 'Off']], S.settings.sheep)}`;
    },
    readOptions() { return { goal: S.settings.goal, sheep: S.settings.sheep }; },
    start(players, o) {
      const F = { players, goal: o.goal, sheepOn: o.sheep === 'yes', scores: {}, sheep: null, round: 0, qid: 0, game: 1, q: '', answers: {}, groups: [], last: null, winner: [], phase: 'answer' };
      newQuestion(F);
      return F;
    },
    view(F) {
      const v = Object.assign({}, F);
      v.answered = F.players.filter(p => F.answers[p.id]).map(p => p.id);
      delete v.answers;
      return v;
    },
    secrets(F) {
      const out = {};
      F.players.forEach(p => { out[p.id] = { q: F.qid, a: F.answers[p.id] || '' }; });
      return out;
    },
    act(F, from, a, ctx) {
      if (!F.players.some(p => p.id === from)) return false;
      const host = from === ctx.host;
      if (a.t === 'again') {
        if (F.phase !== 'final' || a.g !== F.game) return false;
        F.scores = {};
        F.sheep = null;
        F.round = 0;
        F.game++;
        F.winner = [];
        F.last = null;
        newQuestion(F);
        return true;
      }
      if (a.q !== F.qid) return false;
      switch (a.t) {
        case 'answer': {
          const ans = cleanAns(a.a);
          if (F.phase !== 'answer' || !ans) return false;
          F.answers[from] = ans;
          if (F.players.every(p => F.answers[p.id])) revealAll(F);
          return true;
        }
        case 'reveal':
          if (!host || F.phase !== 'answer' || Object.keys(F.answers).length < 2) return false;
          revealAll(F);
          return true;
        case 'skip':
          if (!host || F.phase !== 'answer') return false;
          F.round--;
          newQuestion(F);
          return true;
        case 'merge': {
          if (!host || F.phase !== 'reveal' || !Array.isArray(a.sel)) return false;
          const idx = [...new Set(a.sel.map(Number))].filter(i => i >= 0 && i < F.groups.length);
          if (idx.length < 2) return false;
          const picked = idx.map(i => F.groups[i]).sort((x, y) => y.ids.length - x.ids.length);
          const into = picked[0];
          picked.slice(1).forEach(g => { into.ids.push(...g.ids); into.keys.push(...g.keys); });
          F.groups = F.groups.filter(g => !picked.slice(1).includes(g)).sort((x, y) => y.ids.length - x.ids.length);
          return true;
        }
        case 'score':
          if (!host || F.phase !== 'reveal') return false;
          scoreOnline(F);
          return true;
        case 'next':
          if (F.phase !== 'score') return false;
          newQuestion(F);
          return true;
      }
      return false;
    },
    leave(F, ids) {
      const gone = F.players.filter(p => !ids.includes(p.id)).map(p => p.id);
      if (!gone.length) return;
      F.players = F.players.filter(p => ids.includes(p.id));
      if (F.players.length < 3) return 'open';
      gone.forEach(id => { delete F.answers[id]; delete F.scores[id]; if (F.sheep === id) F.sheep = null; });
      F.groups = F.groups.map(g => {
        const keep = g.ids.map((id, i) => [id, g.keys[i]]).filter(x => !gone.includes(x[0]));
        return { label: g.label, ids: keep.map(x => x[0]), keys: keep.map(x => x[1]) };
      }).filter(g => g.ids.length).sort((x, y) => y.ids.length - x.ids.length);
      if (F.phase === 'answer' && F.players.every(p => F.answers[p.id])) revealAll(F);
    },
    render(v) {
      const F = v.pub, me = v.me;
      const nm = id => { const p = F.players.find(x => x.id === id); return p ? p.name : 'Someone'; };
      const names = ids => esc(P.listNames(ids.map(nm)));
      const playing = F.players.some(p => p.id === me);
      const head = `<p class="eyebrow">Question ${F.round}</p>`;
      if (F.phase === 'answer') {
        const mine = v.mine && v.mine.q === F.qid ? v.mine.a : '';
        const editing = v.local.flockEdit === F.qid;
        const waiting = F.players.filter(p => !F.answered.includes(p.id)).map(p => p.id);
        let body;
        if (!playing) body = '<p class="lead">You are watching this round.</p>';
        else if (mine && !editing) body = `<p class="lead">Your answer is <b>${esc(mine)}</b>.</p><div class="actions center"><button class="btn btn-alt" type="button" data-ui="edit">Change it</button></div>`;
        else {
          body = `<div class="field"><label for="oans-${F.qid}">Your answer</label><input id="oans-${F.qid}" data-keep data-enter="lock" type="text" maxlength="32" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" placeholder="Think like the flock" value="${esc(mine)}"></div>
            <div class="actions center"><button class="btn btn-main btn-big" type="button" data-ui="lock"${v.pending ? ' disabled' : ''}>Lock it in</button></div>`;
        }
        const status = waiting.length ? 'Waiting for ' + names(waiting) + '.' : 'Everyone has answered.';
        const hostBtns = v.host ? `<div class="actions center"><button class="btn btn-alt" type="button" ${Online.sendAttr({ t: 'skip', q: F.qid })}>Another question</button>${F.answered.length >= 2 && waiting.length ? `<button class="btn btn-alt" type="button" ${Online.sendAttr({ t: 'reveal', q: F.qid })}>Show answers now</button>` : ''}</div>` : '';
        return `<section class="center">${head}<p class="q">${esc(F.q)}</p>${body}<p class="note">${status}</p>${hostBtns}${onlineBoard(F, me)}</section>`;
      }
      if (F.phase === 'reveal') {
        const s = v.local.flockSel;
        const sel = s && s.q === F.qid && s.n === F.groups.length ? s.list : [];
        const groups = F.groups.map((g, i) => {
          const inner = `<span class="n">${g.ids.length}</span><span><b>${esc(g.label)}</b><small>${names(g.ids)}</small></span>`;
          return v.host ? `<button type="button" class="grp" data-ui="pick" data-i="${i}" aria-pressed="${sel.includes(i)}">${inner}</button>` : `<div class="grp">${inner}</div>`;
        }).join('');
        const foot = v.host
          ? `<div class="actions center merge">${sel.length >= 2 ? `<button class="btn btn-alt" type="button" data-ui="merge">Merge these ${sel.length}</button>` : ''}<button class="btn btn-main btn-big" type="button" ${Online.sendAttr({ t: 'score', q: F.qid })}>Score the round</button></div>`
          : `<p class="note">${esc(v.nameOf(v.hostId))} is checking the answers. Say so if two groups mean the same thing.</p>`;
        return `<section class="center">${head}<p class="q small">${esc(F.q)}</p>${v.host ? '<p class="note">Tap groups that mean the same thing, then merge them.</p>' : ''}<div class="groups">${groups}</div>${foot}</section>`;
      }
      if (F.phase === 'score') {
        const L = F.last;
        let title, line;
        if (L.winners.length) { title = 'The flock said ' + L.label; line = P.listNames(L.winners.map(nm)) + (L.winners.length === 1 ? ' scores a point.' : ' score a point each.'); }
        else if (L.tied) { title = 'Split flock'; line = 'Two groups tied for biggest, so nobody scores.'; }
        else { title = 'No flock at all'; line = 'Everyone said something different, so nobody scores.'; }
        const sheep = L.lone ? esc(nm(L.lone)) + ' stood alone and takes the black sheep' + (L.passedFrom ? ' from ' + esc(nm(L.passedFrom)) : '') + '.' : '';
        return `<section class="center">${head}<h2 class="verdict">${esc(title)}</h2><p class="lead">${esc(line)}</p>
          ${sheep ? `<p class="lead"><span class="bs">${BLACK}Black sheep</span> ${sheep}</p>` : ''}
          ${onlineBoard(F, me)}
          <div class="actions center"><button class="btn btn-main btn-big" type="button" ${Online.sendAttr({ t: 'next', q: F.qid })}>Next question</button></div></section>`;
      }
      const w = F.winner.map(nm);
      return `<section class="center"><p class="eyebrow">Game over</p>
        <h2 class="big">${esc(P.listNames(w))} ${w.length > 1 ? 'win' : 'wins'}</h2>
        <p class="lead">Nobody thinks like the flock quite like ${w.length > 1 ? 'them' : esc(w[0])}.</p>
        ${onlineBoard(F, me)}
        <div class="actions center"><button class="btn btn-main btn-big" type="button" ${Online.sendAttr({ t: 'again', g: F.game })}>Play again</button></div></section>`;
    },
    click(name, el, v) {
      const F = v.pub;
      if (name === 'lock') {
        const f = document.getElementById('oans-' + F.qid);
        const a = cleanAns(f ? f.value : '');
        if (!a) { if (f) f.focus(); return; }
        v.local.flockEdit = null;
        v.send({ t: 'answer', q: F.qid, a });
        sfx.pop();
      } else if (name === 'edit') {
        v.local.flockEdit = F.qid;
        v.redraw();
      } else if (name === 'pick') {
        let s = v.local.flockSel;
        if (!s || s.q !== F.qid || s.n !== F.groups.length) s = v.local.flockSel = { q: F.qid, n: F.groups.length, list: [] };
        const i = Number(el.getAttribute('data-i'));
        const at = s.list.indexOf(i);
        if (at >= 0) s.list.splice(at, 1); else s.list.push(i);
        v.redraw();
      } else if (name === 'merge') {
        const s = v.local.flockSel;
        if (s && s.list.length >= 2) { v.send({ t: 'merge', q: F.qid, sel: s.list.slice() }); s.list = []; sfx.pop(); }
      }
    },
    fx(v, prev) {
      const F = v.pub, B = prev && prev.pub;
      if (!B || B.game !== F.game) return;
      if (F.phase === 'answer' && B.phase === 'answer' && F.qid === B.qid && F.answered.length > B.answered.length) sfx.tick();
      if (F.phase === 'reveal' && B.phase !== 'reveal') sfx.whoosh();
      if (F.phase === 'score' && B.phase !== 'score') { if (F.last.winners.length) sfx.ding(); else sfx.lose(); }
      if (F.phase === 'final' && B.phase !== 'final') { sfx.win(); P.confetti({ colors: ['#2d7a34', '#ffffff', '#7fc36b', '#ffd23f', '#1f2a1b'] }); }
    }
  };
  document.addEventListener('change', e => {
    if (e.target.name === 'o-goal') { S.settings.goal = Number(e.target.value); persist(); }
    if (e.target.name === 'o-sheep') { S.settings.sheep = e.target.value; persist(); }
  });

  if (window.Online && Online.wanted()) Online.room(ONLINE);
  else render();
})();
</script>
</body>
</html>
