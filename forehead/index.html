<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forehead | Pass the Phone</title>
<meta name="description" content="Hold the phone on your forehead while friends give clues. Tilt down when you get it, up to pass.">
<meta name="theme-color" content="#5b21d6">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Lilita+One&display=swap">
<style>
/* Layout: one giant word. Setup is a stack of colorful deck cards; play is a full-bleed card that flashes green or orange. */
:root{
  color-scheme:dark;
  --violet:#5b21d6;
  --violet-deep:#2b0d73;
  --white:#ffffff;
  --mist:#ddd0ff;
  --ink:#170a3a;
  --lime:#c6ff3d;
  --good:#16c172;
  --skip:#ff8c1a;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--violet-deep)}
body{margin:0;min-height:100vh;color:var(--white);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(circle at 15% 0%,rgba(167,139,250,.55),transparent 45%),radial-gradient(circle at 100% 100%,rgba(236,72,153,.45),transparent 50%),linear-gradient(160deg,var(--violet),var(--violet-deep));background-attachment:fixed}
body.playing{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(48px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:6px 14px 6px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:var(--white);text-decoration:none;font-weight:800;font-size:15px}
.back svg{width:16px;height:16px}
.ptp-sound{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:var(--white);cursor:pointer}
.ptp-sound svg{width:22px;height:22px}
:is(.back,.ptp-sound,.btn,.who,.deck,.howto summary):focus-visible{outline:3px solid var(--lime);outline-offset:3px}

.title{display:flex;flex-wrap:wrap;align-items:center;gap:.2em;margin:24px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(46px,15vw,128px);line-height:.9;letter-spacing:.005em}
.title svg{width:.85em;height:.85em;flex:none}
.tagline{margin:12px 0 0;font-size:19px;color:var(--mist)}
.label{display:block;margin:28px 0 12px;font-family:var(--f-display);font-size:24px;line-height:1}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.deck{position:relative;display:block;cursor:pointer}
.deck input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.deck span{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:96px;padding:12px 14px;border-radius:20px;background:var(--c);color:var(--ink);transform:rotate(var(--r,0deg));transition:transform .15s ease,box-shadow .15s ease;box-shadow:0 8px 0 rgba(23,10,58,.35)}
.deck b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.05}
.deck small{font-weight:800;font-size:13px;opacity:.7}
.deck input:checked+span{transform:rotate(0) translateY(-4px);box-shadow:0 0 0 4px var(--white),0 12px 0 rgba(23,10,58,.4)}
.deck input:focus-visible+span{outline:3px solid var(--lime);outline-offset:6px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.seg span{display:grid;place-items:center;min-width:70px;height:46px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:800;font-size:17px}
.seg input:checked+span{background:var(--white);color:var(--ink)}
.seg input:focus-visible+span{outline:3px solid var(--lime);outline-offset:2px}
.check{display:flex;align-items:flex-start;gap:12px;margin-top:16px;font-weight:600;cursor:pointer}
.check input{width:24px;height:24px;margin:1px 0 0;flex:none;accent-color:var(--lime)}
.check small{display:block;font-weight:400;color:var(--mist)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 28px;border:0;border-radius:999px;cursor:pointer;font-family:var(--f-display);font-weight:400;font-size:24px;touch-action:manipulation;transition:transform .08s ease}
.btn:active{transform:scale(.97)}
.btn-lime{background:var(--lime);color:var(--ink);box-shadow:0 6px 0 #7fae13}
.btn-white{background:var(--white);color:var(--ink);box-shadow:0 6px 0 #b9a8f0}
.btn-ghost{background:rgba(255,255,255,.14);color:var(--white)}
.btn-big{min-height:66px;padding-inline:38px;font-size:30px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:26px}
.actions.center{justify-content:center}

.center{text-align:center}
.eyebrow{margin:30px 0 0;font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.big{margin:8px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(42px,10vw,76px);line-height:1;text-wrap:balance;overflow-wrap:anywhere}
.lead{margin:14px auto 0;max-width:30em;font-size:19px;color:var(--mist);text-wrap:pretty}
.lead b{color:var(--white)}
.whos{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.who{min-height:56px;padding:8px 22px;border:0;border-radius:999px;background:var(--white);color:var(--ink);font-family:var(--f-display);font-size:24px;cursor:pointer;box-shadow:0 5px 0 #b9a8f0;overflow-wrap:anywhere}
.who:active{transform:translateY(3px);box-shadow:0 2px 0 #b9a8f0}
.howto-pic{display:block;width:min(70vw,260px);height:auto;margin:20px auto 0}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;max-width:560px;margin:22px auto 0;text-align:left}
.tip{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.12);font-weight:600}
.tip i{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;font-style:normal;font-family:var(--f-display);font-size:16px;color:var(--ink)}

.play{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--bg,#7c3aed);color:var(--white);overflow:hidden;transition:background-color .25s ease;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));-webkit-user-select:none;user-select:none}
.zone{position:absolute;top:0;bottom:0;width:50%;border:0;background:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.zone.l{left:0}
.zone.r{right:0}
.zone span{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.18);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.zone.l span{left:max(18px,env(safe-area-inset-left))}
.zone.r span{right:max(18px,env(safe-area-inset-right))}
.zone:focus-visible{outline:4px solid var(--white);outline-offset:-10px}
.word{position:relative;z-index:1;max-width:94vw;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,min(13vw,24vh),180px);line-height:1;text-align:center;text-wrap:balance;overflow-wrap:anywhere;pointer-events:none;text-shadow:0 6px 0 rgba(0,0,0,.18);animation:in .25s cubic-bezier(.2,1.5,.4,1)}
@keyframes in{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.clock{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:2;font-family:var(--f-display);font-size:clamp(28px,6vw,44px);pointer-events:none;font-variant-numeric:tabular-nums}
.clock.low{color:#fff36b;animation:beat .5s ease-in-out infinite alternate}
@keyframes beat{to{transform:translateX(-50%) scale(1.12)}}
.bar{position:absolute;left:0;right:0;top:0;height:8px;background:rgba(0,0,0,.18);pointer-events:none}
.bar i{display:block;height:100%;width:100%;background:rgba(255,255,255,.85);transform-origin:left}
.count{font-family:var(--f-display);font-size:clamp(120px,40vmin,320px);line-height:1;animation:in .35s cubic-bezier(.2,1.5,.4,1)}
.flash{position:absolute;inset:0;z-index:3;display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(56px,16vmin,160px);color:var(--white);pointer-events:none;opacity:0}
.flash.good{background:var(--good);animation:fl .7s ease forwards}
.flash.skip{background:var(--skip);animation:fl .7s ease forwards}
@keyframes fl{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
.mode{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:2;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;pointer-events:none}

.score-big{font-family:var(--f-display);font-size:clamp(90px,26vw,170px);line-height:1;color:var(--lime)}
.results{list-style:none;margin:22px auto 0;padding:0;max-width:520px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.results li{padding:6px 14px;border-radius:999px;font-weight:800}
.results .ok{background:var(--white);color:var(--ink)}
.results .no{background:rgba(255,255,255,.12);color:var(--mist);text-decoration:line-through}
.board{max-width:440px;margin:26px auto 0;text-align:left}
.board ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.board li{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-radius:16px;background:rgba(255,255,255,.12);font-weight:800}
.board li span{min-width:0;overflow-wrap:anywhere}
.board b{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--lime)}
.howto{margin-top:28px;color:var(--mist)}
.howto summary{display:flex;align-items:center;min-height:44px;cursor:pointer;font-family:var(--f-display);font-size:22px;color:var(--white)}
.howto ol{margin:4px 0 0;padding-left:1.3em;display:grid;gap:8px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .flash.good,.flash.skip{opacity:1}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../shared/party.js?v=ab12cd68"></script>
<script src="decks.js?v=4437bc71"></script>
<script>
(function () {
  'use strict';
  const P = window.Party, sfx = P.sfx, esc = P.esc;
  const RAW = window.FOREHEAD_DECKS || [];
  const all = [];
  RAW.forEach(d => d.words.forEach(w => { if (!all.includes(w)) all.push(w); }));
  const DECKS = RAW.concat([{ id: 'mix', name: 'Mix of everything', color: '#ffb3e6', words: all }]);
  const KEY = 'ptp.forehead';
  const BG = ['#7c3aed', '#db2777', '#0ea5e9', '#f97316', '#16a34a', '#e11d48', '#9333ea', '#0891b2'];
  const BACK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const app = document.getElementById('app');

  const saved = P.store.get(KEY, {}) || {};
  const S = {
    settings: Object.assign({ deck: 'animals', time: 60, tilt: true }, saved.settings || {}),
    scores: saved.scores && typeof saved.scores === 'object' ? saved.scores : {},
    screen: 'setup', guesser: null, pile: null, word: null, results: [],
    left: 0, total: 0, last: 0, locked: false, lastSec: null, color: 0
  };
  if (!DECKS.some(d => d.id === S.settings.deck)) S.settings.deck = 'animals';
  let loop = null, shown = null;
  const tilt = { listening: false, seen: false, base: null, armed: true };
  function persist() { P.store.set(KEY, { settings: S.settings, scores: S.scores }); }
  const deckOf = id => DECKS.find(d => d.id === id) || DECKS[0];

  /* ---------- Tilt ---------- */
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    if (!tilt.seen) {
      tilt.seen = true;
      const m = document.getElementById('mode');
      if (m) m.textContent = 'Tilt or tap';
    }
    const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    const up = Math.asin(Math.max(-1, Math.min(1, Math.cos(b) * Math.cos(g)))) * 180 / Math.PI;
    if (S.screen !== 'play' || S.locked) return;
    if (tilt.base == null) { tilt.base = up; return; }
    const d = up - tilt.base;
    if (!tilt.armed) { if (Math.abs(d) < 20) tilt.armed = true; return; }
    if (d <= -42) { tilt.armed = false; mark(true); }
    else if (d >= 42) { tilt.armed = false; mark(false); }
  }
  async function enableTilt() {
    if (!S.settings.tilt || tilt.listening || typeof window.DeviceOrientationEvent === 'undefined') return;
    try {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') return;
      }
      window.addEventListener('deviceorientation', onOrient);
      tilt.listening = true;
    } catch (e) { /* tilt stays off; taps still work */ }
  }

  /* ---------- Views ---------- */
  function header() { return `<header class="top"><a class="back" href="../">${BACK}All games</a>${P.soundToggle()}</header>`; }
  function seg(name, opts) {
    return `<div class="seg" role="radiogroup">${opts.map(([v, t]) => `<label><input type="radio" name="${name}" id="${name}-${v}" value="${v}"${String(S.settings[name]) === String(v) ? ' checked' : ''}><span>${t}</span></label>`).join('')}</div>`;
  }
  function board() {
    const rows = Object.entries(S.scores).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    if (!rows.length) return '';
    return `<div class="board"><span class="label">Scores</span><ol>${rows.map(([n, v]) => `<li><span>${esc(n)}</span><b>${v}</b></li>`).join('')}</ol>
      <div class="actions"><button class="btn btn-ghost" type="button" data-act="reset">Reset scores</button></div></div>`;
  }
  const HEAD = '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M18 100c3-22 61-22 64 0" fill="#2b0d73" stroke="#170a3a" stroke-width="5"/><circle cx="50" cy="58" r="27" fill="#ffd23f" stroke="#170a3a" stroke-width="5"/><rect x="26" y="14" width="48" height="27" rx="6" fill="#fff" stroke="#170a3a" stroke-width="5" transform="rotate(-6 50 27)"/><path d="M40 31h20" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" transform="rotate(-6 50 27)"/><circle cx="41" cy="60" r="3.5" fill="#170a3a"/><circle cx="59" cy="60" r="3.5" fill="#170a3a"/><ellipse cx="50" cy="72" rx="5" ry="6" fill="#170a3a"/></svg>';

  function viewSetup() {
    return header() + `
    <h1 class="title">${HEAD}Forehead</h1>
    <p class="tagline">Phone on your head. Friends give clues. Guess as many as you can.</p>
    <span class="label">Pick a deck</span>
    <div class="decks" role="radiogroup" aria-label="Deck">${DECKS.map((d, i) => `<label class="deck"><input type="radio" name="deck" id="deck-${d.id}" value="${d.id}"${S.settings.deck === d.id ? ' checked' : ''}><span style="--c:${d.color};--r:${((i * 53) % 5) - 2}deg"><b>${esc(d.name)}</b><small>${d.words.length} words</small></span></label>`).join('')}</div>
    <span class="label">Time per turn</span>
    ${seg('time', [[30, '30 sec'], [60, '60 sec'], [90, '90 sec']])}
    <label class="check"><input type="checkbox" id="tilt"${S.settings.tilt ? ' checked' : ''}><span>Tilt to play<small>Tilt the phone down when you get it, up to pass. Tapping the screen always works too.</small></span></label>
    <div class="actions"><button class="btn btn-lime btn-big" type="button" data-act="go">Play</button></div>
    ${board()}
    <details class="howto">
      <summary>How to play</summary>
      <ol>
        <li>The guesser holds the phone on their forehead with the screen facing out.</li>
        <li>Everyone else gives clues, acts it out or makes noises. No saying the word.</li>
        <li>Got it? Tilt the phone down, or tap the right side. Stuck? Tilt it up, or tap the left side.</li>
        <li>Guess as many as you can before time runs out, then hand the phone to the next guesser.</li>
      </ol>
    </details>`;
  }
  function viewWho() {
    const names = P.getRoster();
    return header() + `
    <section class="center">
      <p class="eyebrow">${esc(deckOf(S.settings.deck).name)}</p>
      <h2 class="big">Who is guessing?</h2>
      <div class="whos">${names.map((n, i) => `<button class="who" type="button" data-act="who" data-i="${i}">${esc(n)}</button>`).join('')}</div>
      <div class="actions center"><button class="btn btn-ghost" type="button" data-act="who" data-i="-1">${names.length ? 'Someone else' : 'Just play'}</button></div>
      ${names.length ? '' : '<p class="lead">Add names on the Pass the Phone home page to keep score.</p>'}
    </section>`;
  }
  function viewReady() {
    const g = S.guesser;
    return header() + `
    <section class="center">
      <p class="eyebrow">${g ? esc(g) + ' is guessing' : 'Get ready'}</p>
      <h2 class="big">Phone on your forehead</h2>
      <p class="lead">Screen facing out, so everyone else can read it. Sideways works best.</p>
      <div class="tips">
        <div class="tip"><i style="background:var(--good)">Yes</i><span>Got it? Tilt down or tap the right side.</span></div>
        <div class="tip"><i style="background:var(--skip)">Skip</i><span>Stuck? Tilt up or tap the left side.</span></div>
      </div>
      <div class="actions center"><button class="btn btn-lime btn-big" type="button" data-act="start">Start</button></div>
    </section>`;
  }
  function viewResults() {
    const got = S.results.filter(r => r.ok).length;
    return header() + `
    <section class="center">
      <p class="eyebrow">${S.guesser ? esc(S.guesser) + ' scored' : "Time's up"}</p>
      <div class="score-big">${got}</div>
      <p class="lead">${got === 0 ? 'Tough deck. Shake it off.' : got >= 10 ? 'Unstoppable.' : got >= 6 ? 'Great round.' : 'Nice work.'} ${P.plural(S.results.length - got, 'pass', 'passes')}.</p>
      <ul class="results">${S.results.map(r => `<li class="${r.ok ? 'ok' : 'no'}">${esc(r.word)}</li>`).join('')}</ul>
      <div class="actions center">
        <button class="btn btn-ghost" type="button" data-act="setup">Change deck</button>
        <button class="btn btn-lime btn-big" type="button" data-act="next">Next guesser</button>
      </div>
      ${board()}
    </section>`;
  }

  /* ---------- Play ---------- */
  function playShell(inner) {
    return `<div class="play" id="play" style="--bg:${BG[S.color % BG.length]}">${inner}</div>`;
  }
  function viewCount() { return playShell(`<div class="count" id="count">3</div>`); }
  function viewPlay() {
    return playShell(`
      <div class="bar"><i id="bar"></i></div>
      <div class="clock" id="clock" role="timer">${S.settings.time}</div>
      <div class="mode" id="mode">${tilt.seen ? 'Tilt or tap' : 'Tap to play'}</div>
      <button class="zone l" type="button" data-act="pass" aria-label="Pass"><span>Pass</span></button>
      <button class="zone r" type="button" data-act="got" aria-label="Got it"><span>Got it</span></button>
      <div class="word" id="word" aria-live="assertive">${esc(S.word)}</div>
      <div class="flash" id="flash"></div>`);
  }

  function drawWord() {
    if (!S.pile) S.pile = P.deck('forehead-' + S.settings.deck, deckOf(S.settings.deck).words);
    const seen = S.results.map(r => r.word);
    if (S.word) seen.push(S.word);
    return S.pile.one(seen);
  }
  async function startRound() {
    sfx.unlock();
    P.stayAwake();
    await enableTilt();
    try {
      const el = document.documentElement;
      if (el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
    } catch (e) { /* not supported */ }
    S.results = [];
    S.word = null;
    S.pile = null;
    S.color = Math.floor(Math.random() * BG.length);
    S.screen = 'count';
    render();
    let n = 3;
    sfx.beep(false);
    const t = setInterval(() => {
      n--;
      const c = document.getElementById('count');
      if (n > 0) { if (c) { c.textContent = n; c.style.animation = 'none'; void c.offsetWidth; c.style.animation = ''; } sfx.beep(false); }
      else { clearInterval(t); sfx.beep(true); beginPlay(); }
    }, 900);
  }
  function beginPlay() {
    S.word = drawWord();
    S.total = S.settings.time * 1000;
    S.left = S.total;
    S.last = performance.now();
    S.lastSec = null;
    S.locked = false;
    tilt.base = null;
    tilt.armed = true;
    S.screen = 'play';
    render();
    clearInterval(loop);
    loop = setInterval(step, 100);
  }
  function step() {
    if (S.screen !== 'play') { clearInterval(loop); return; }
    const now = performance.now();
    S.left -= now - S.last;
    S.last = now;
    const sec = Math.max(0, Math.ceil(S.left / 1000));
    const c = document.getElementById('clock'), bar = document.getElementById('bar');
    if (bar) bar.style.transform = 'scaleX(' + Math.max(0, S.left / S.total).toFixed(3) + ')';
    if (c && sec !== S.lastSec) {
      S.lastSec = sec;
      c.textContent = sec;
      c.classList.toggle('low', sec <= 5);
      if (sec > 0 && sec <= 5) sfx.tick(1700);
    }
    if (S.left <= 0) endRound();
  }
  function mark(ok) {
    if (S.screen !== 'play' || S.locked) return;
    S.locked = true;
    S.results.push({ word: S.word, ok });
    const f = document.getElementById('flash');
    if (f) { f.className = 'flash'; void f.offsetWidth; f.className = 'flash ' + (ok ? 'good' : 'skip'); f.textContent = ok ? 'Correct' : 'Pass'; }
    if (ok) sfx.ding(); else sfx.whoosh();
    P.vibrate(ok ? 60 : [30, 40, 30]);
    setTimeout(() => {
      if (S.screen !== 'play') return;
      S.word = drawWord();
      S.color++;
      const play = document.getElementById('play'), w = document.getElementById('word');
      if (play) play.style.setProperty('--bg', BG[S.color % BG.length]);
      if (w) { w.textContent = S.word; w.style.animation = 'none'; void w.offsetWidth; w.style.animation = ''; }
      S.locked = false;
    }, 700);
  }
  function endRound() {
    clearInterval(loop);
    sfx.buzz(0.9);
    P.vibrate([300, 100, 300]);
    const got = S.results.filter(r => r.ok).length;
    if (S.guesser) { S.scores[S.guesser] = (S.scores[S.guesser] || 0) + got; persist(); }
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch (e) { /* ignore */ }
    S.screen = 'results';
    render();
    if (got >= 6) P.confetti({ colors: ['#c6ff3d', '#ffffff', '#ff6fb5', '#ffd23f'] });
  }

  const VIEWS = { setup: viewSetup, who: viewWho, ready: viewReady, count: viewCount, play: viewPlay, results: viewResults };
  function render() {
    document.body.classList.toggle('playing', S.screen === 'count' || S.screen === 'play');
    app.innerHTML = (VIEWS[S.screen] || viewSetup)();
    if (S.screen !== shown) window.scrollTo(0, 0);
    shown = S.screen;
  }
  function afterSetupChoice() {
    S.screen = P.getRoster().length ? 'who' : 'ready';
    render();
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    switch (b.getAttribute('data-act')) {
      case 'go': afterSetupChoice(); break;
      case 'who': {
        const i = Number(b.getAttribute('data-i'));
        S.guesser = i >= 0 ? P.getRoster()[i] : null;
        S.screen = 'ready';
        render();
        break;
      }
      case 'start': startRound(); break;
      case 'got': mark(true); break;
      case 'pass': mark(false); break;
      case 'next': afterSetupChoice(); break;
      case 'setup': S.screen = 'setup'; render(); break;
      case 'reset': S.scores = {}; persist(); render(); break;
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.name === 'deck') { S.settings.deck = t.value; persist(); }
    else if (t.name === 'time') { S.settings.time = Number(t.value); persist(); }
    else if (t.id === 'tilt') { S.settings.tilt = t.checked; persist(); }
  });
  document.addEventListener('keydown', e => {
    if (S.screen !== 'play') return;
    const onButton = !!(e.target.closest && e.target.closest('button'));
    if (e.key === 'ArrowRight' || (e.key === 'Enter' && !onButton)) { e.preventDefault(); mark(true); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); mark(false); }
  });

  render();
})();
</script>
</body>
</html>
