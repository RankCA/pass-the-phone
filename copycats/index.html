<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copycats | Pass the Phone</title>
<meta name="description" content="Everyone writes a one-word clue for the guesser. If two clues match, both get thrown out. A team game for one phone.">
<meta name="theme-color" content="#ff7a1a">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: a fridge door. Clues are sticky notes slapped on in a loose cluster; everything else stays round and friendly. */
:root{
  color-scheme:light;
  --tang:#ff7a1a;
  --tang-deep:#c94f06;
  --cream:#fff6ea;
  --ink:#22140a;
  --soft:#6b4a33;
  --n1:#fff36b;
  --n2:#ffc2dc;
  --n3:#a8e9ff;
  --n4:#c4f7a1;
  --red:#e8112d;
  --good:#11a35b;
  --f:"Baloo 2","Trebuchet MS",system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--tang)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f);font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(255,255,255,.28),transparent 70%),repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 18px,transparent 18px 36px),var(--tang);background-attachment:fixed}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(48px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:4px 16px 4px 10px;border-radius:999px;background:var(--cream);color:var(--ink);text-decoration:none;font-weight:700;font-size:16px}
.back svg{width:16px;height:16px}
.ptp-sound{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:var(--cream);color:var(--ink);cursor:pointer}
.ptp-sound svg{width:22px;height:22px}
:is(.back,.ptp-sound,.btn,.pp-add,.pp-remove,.note-btn,.howto summary):focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.title{display:flex;flex-wrap:wrap;align-items:center;gap:.16em;margin:22px 0 0;font-weight:800;font-size:clamp(44px,14vw,112px);line-height:.95;letter-spacing:-.02em;color:var(--cream);-webkit-text-stroke:.06em var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--tang-deep)}
.title svg{width:.9em;height:.9em;flex:none}
.tagline{margin:10px 0 0;font-size:20px;font-weight:700;color:var(--ink)}
.box{margin-top:22px;padding:18px;border-radius:26px;background:var(--cream);box-shadow:0 10px 0 var(--tang-deep)}
.label{display:block;margin:0 0 8px;font-weight:800;font-size:21px}
.sec+.sec{margin-top:20px}
.hint{margin:6px 0 0;color:var(--soft);font-size:16px}

.pp-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.pp-row{display:flex;align-items:center;gap:8px}
.pp-num{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:var(--n1);font-weight:800}
.pp-input{flex:1;min-width:0;width:0;height:48px;padding:0 14px;border:2px solid #e7d6c2;border-radius:14px;background:#fff;color:var(--ink);font:700 19px/1 var(--f)}
.pp-input::placeholder{color:#8c7258;font-weight:500}
.pp-input:focus{outline:none;border-color:var(--tang)}
.pp-remove{display:grid;place-items:center;flex:none;width:42px;height:42px;border:0;border-radius:50%;background:#f3e4d2;color:var(--ink);cursor:pointer}
.pp-remove:disabled{opacity:.35;cursor:default}
.pp-add{margin-top:10px;min-height:44px;padding:4px 18px;border:2px dashed #d7bfa6;border-radius:999px;background:transparent;font-weight:700;cursor:pointer}
.pp-add:disabled{opacity:.5;cursor:default}
.pp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.seg span{display:grid;place-items:center;min-width:64px;height:46px;padding:0 16px;border-radius:999px;background:#f3e4d2;font-weight:800;font-size:17px}
.seg input:checked+span{background:var(--ink);color:var(--cream)}
.seg input:focus-visible+span{outline:3px solid var(--tang);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:6px 26px;border:0;border-radius:999px;cursor:pointer;font-weight:800;font-size:20px;touch-action:manipulation;transition:transform .08s ease}
.btn:active{transform:translateY(2px)}
.btn-ink{background:var(--ink);color:var(--cream);box-shadow:0 5px 0 #000}
.btn-cream{background:var(--cream);color:var(--ink);box-shadow:0 5px 0 var(--tang-deep)}
.btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2.5px var(--ink)}
.btn-big{min-height:62px;padding-inline:34px;font-size:23px}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:22px}
.actions.center{justify-content:center}
.textbtn{background:none;border:0;padding:8px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.center{text-align:center}
.eyebrow{margin:26px 0 0;font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.big{margin:4px 0 0;font-weight:800;font-size:clamp(38px,9.5vw,68px);line-height:1;letter-spacing:-.015em;text-wrap:balance;overflow-wrap:anywhere}
.big.light{color:var(--cream);-webkit-text-stroke:.06em var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--tang-deep)}
.lead{margin:12px auto 0;max-width:30em;font-size:20px;font-weight:600;text-wrap:pretty}
.status{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
.status span{padding:4px 14px;border-radius:999px;background:rgba(255,246,234,.85);font-weight:800;font-size:16px}

.secret{margin:20px auto 0;max-width:420px;padding:20px 18px 22px;border-radius:26px;background:var(--cream);box-shadow:0 10px 0 var(--tang-deep)}
.secret small{display:block;font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.secret b{display:block;margin-top:2px;font-size:clamp(40px,11vw,64px);line-height:1.05;overflow-wrap:anywhere}
.field{display:grid;gap:6px;max-width:420px;margin:18px auto 0;text-align:left}
.field label{font-weight:800}
.field input{height:58px;padding:0 16px;border:0;border-radius:18px;background:#fff;color:var(--ink);font:800 24px/1 var(--f);box-shadow:inset 0 0 0 3px var(--ink)}
.field input:focus{outline:none;box-shadow:inset 0 0 0 3px var(--ink),0 0 0 5px rgba(255,246,234,.8)}
.err{min-height:1.5em;margin:6px 0 0;font-weight:800;color:var(--cream);text-shadow:0 2px 0 var(--tang-deep)}

.notes{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:22px}
.note,.note-btn{position:relative;display:grid;place-items:center;align-content:center;gap:2px;width:min(42vw,160px);min-height:118px;padding:14px 10px;border:0;border-radius:4px;background:var(--n);color:var(--ink);text-align:center;font-weight:800;font-size:clamp(22px,5.5vw,30px);line-height:1.1;overflow-wrap:anywhere;transform:rotate(var(--r,0deg));box-shadow:0 12px 18px -12px rgba(0,0,0,.55)}
.note-btn{cursor:pointer;touch-action:manipulation}
.note small,.note-btn small{display:block;font-size:14px;font-weight:700;color:var(--soft)}
.note.out,.note-btn.out{background:#ece2d6;color:#65554a}
.note.out .w,.note-btn.out .w{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:4px}
.stamp{position:absolute;right:-8px;top:-10px;padding:0 8px;border-radius:6px;background:var(--red);color:#fff;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;transform:rotate(8deg)}
.verdict{margin-top:22px;font-weight:800;font-size:clamp(54px,15vw,100px);line-height:1;color:var(--cream);-webkit-text-stroke:.06em var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--tang-deep)}
.verdict.bad{color:var(--ink);-webkit-text-stroke:0;text-shadow:none}
.online{margin-top:20px;padding:16px 18px;border-radius:26px;background:rgba(255,246,234,.55)}
.online p{margin:0;font-weight:600}
.waiting{margin:14px auto 0;max-width:30em;font-weight:700}
.howto{margin-top:26px}
.howto summary{display:flex;align-items:center;min-height:44px;cursor:pointer;font-weight:800;font-size:21px}
.howto ol{margin:4px 0 0;padding-left:1.3em;display:grid;gap:6px;font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../shared/party.js?v=ab12cd68"></script>
<script src="../shared/online.js?v=a70bfe61"></script>
<script src="words.js?v=4f2a28ca"></script>
<script>
(function () {
  'use strict';
  const P = window.Party, sfx = P.sfx, esc = P.esc;
  const WORDS = window.COPYCAT_WORDS || ['Banana'];
  const KEY = 'ptp.copycats';
  const NOTES = ['var(--n1)', 'var(--n2)', 'var(--n3)', 'var(--n4)'];
  const BACK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CAT = '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M14 88l6-66 28 22h4l28-22 6 66z" fill="#22140a"/><circle cx="50" cy="62" r="34" fill="#22140a"/><ellipse cx="36" cy="58" rx="8" ry="10" fill="#fff6ea"/><ellipse cx="64" cy="58" rx="8" ry="10" fill="#fff6ea"/><circle cx="38" cy="60" r="4" fill="#22140a"/><circle cx="66" cy="60" r="4" fill="#22140a"/><path d="M46 72h8l-4 5z" fill="#ffc2dc"/></svg>';
  const app = document.getElementById('app');
  const deck = P.deck('copycats', WORDS);

  const saved = P.store.get(KEY, {}) || {};
  const S = {
    settings: Object.assign({ cards: 13 }, saved.settings || {}),
    best: saved.best || {},
    screen: 'setup', players: [], pile: 0, score: 0, gIdx: 0, C: null
  };
  let editor = null, shown = null;
  function persist() { P.store.set(KEY, { settings: S.settings, best: S.best }); }

  /* ---------- Word matching ---------- */
  function key(w) {
    let s = String(w || '').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g, '');
    if (/(ss|x|z|ch|sh)es$/.test(s)) s = s.slice(0, -2);
    else if (s.length > 4 && /ies$/.test(s)) s = s.slice(0, -3) + 'y';
    else if (s.length > 3 && /[^s]s$/.test(s)) s = s.slice(0, -1);
    if (s.length > 5 && /ing$/.test(s)) s = s.slice(0, -3);
    else if (s.length > 4 && /ed$/.test(s)) s = s.slice(0, -2);
    if (/([b-df-hj-np-tv-z])\1$/.test(s) && s.length > 3) s = s.slice(0, -1);
    return s;
  }
  function lev(a, b) {
    const m = a.length, n = b.length;
    if (!m || !n) return m || n;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  function tooClose(clue, word) {
    const c = key(clue);
    if (!c) return true;
    const whole = key(word.replace(/[\s-]+/g, ''));
    if (c === whole) return true;
    const parts = word.toLowerCase().split(/[\s-]+/).map(key).filter(t => t.length >= 3);
    return parts.some(t => c === t || c.includes(t) || (c.length >= 4 && t.includes(c)));
  }
  function sameWord(guess, word) {
    const g = key(String(guess).trim().replace(/^(a|an|the)\s+/i, '').replace(/[\s-]+/g, ''));
    const w = key(word.replace(/[\s-]+/g, ''));
    if (!g) return false;
    if (g === w) return true;
    return Math.max(g.length, w.length) >= 5 && lev(g, w) <= 1;
  }
  function markCopycats(clues) {
    const counts = {};
    clues.forEach(c => { const k = key(c.text); counts[k] = (counts[k] || 0) + 1; });
    clues.forEach(c => { c.out = counts[key(c.text)] > 1; c.auto = c.out; });
  }

  /* ---------- Views ---------- */
  function header() { return `<header class="top"><a class="back" href="../">${BACK}All games</a>${P.soundToggle()}</header>`; }
  function statusHTML() {
    return `<div class="status"><span>Score ${S.score}</span><span>${P.plural(S.pile, 'card')} left</span></div>`;
  }
  function viewSetup() {
    return header() + `
    <h1 class="title">${CAT}Copycats</h1>
    <p class="tagline">One guesser, a pile of clues, and no copying allowed.</p>
    <div class="box">
      <div class="sec"><span class="label">Players</span><div id="players"></div><p class="hint">Everyone plays on the same team. Three or more players.</p></div>
      <div class="sec"><span class="label">Cards in the pile</span>
        <div class="seg" role="radiogroup">${[[8, '8 cards'], [13, '13 cards']].map(([v, t]) => `<label><input type="radio" name="cards" id="cards-${v}" value="${v}"${S.settings.cards === v ? ' checked' : ''}><span>${t}</span></label>`).join('')}</div>
      </div>
      <div class="actions"><button class="btn btn-ink btn-big" type="button" data-act="start">Start</button></div>
    </div>
    <div class="online">
      <span class="label">Play online</span>
      <p>Everyone writes their clue on their own phone at the same time, and the guesser never sees the copycats. Make a game, then send the code.</p>
      <div class="actions"><a class="btn btn-line" href="?lobby=new">Make an online game</a><a class="btn btn-line" href="../online/">Join with a code</a></div>
    </div>
    <details class="howto">
      <summary>How to play</summary>
      <ol>
        <li>One player is the guesser and closes their eyes.</li>
        <li>Everyone else takes the phone in turn, sees the secret word and types a one-word clue.</li>
        <li>Matching clues cancel each other out. So do clues that are too close to the word.</li>
        <li>The guesser sees the clues that survived and gets one guess.</li>
        <li>Right: keep the card. Pass: lose this card. Wrong: lose this card and the next one.</li>
      </ol>
    </details>`;
  }
  function viewPass() {
    const C = S.C, giver = C.givers[C.pos];
    return header() + `
    <section class="center">
      <p class="eyebrow">Clue ${C.pos + 1} of ${C.givers.length}</p>
      <h2 class="big light">Pass to ${esc(S.players[giver])}</h2>
      <p class="lead">${esc(C.guesser)} is guessing this card and keeps their eyes closed.</p>
      <div class="actions center"><button class="btn btn-ink btn-big" type="button" data-act="me">I'm ${esc(S.players[giver])}</button></div>
      ${statusHTML()}
    </section>`;
  }
  function viewClue() {
    const C = S.C, giver = S.players[C.givers[C.pos]];
    return header() + `
    <section class="center">
      <p class="eyebrow">${esc(giver)}, your clue for ${esc(C.guesser)}</p>
      <div class="secret"><small>The secret word</small><b>${esc(C.word)}</b></div>
      <div class="field"><label for="clue">One word only</label><input id="clue" type="text" maxlength="24" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Type your clue"></div>
      <p class="err" id="err" aria-live="polite"></p>
      <div class="actions center"><button class="btn btn-ink btn-big" type="button" data-act="clue">Hide it and pass</button></div>
      ${C.pos === 0 ? '<div class="actions center"><button class="textbtn" type="button" data-act="swap">Nobody knows this word? Get a new one</button></div>' : ''}
    </section>`;
  }
  function noteHTML(c, i, opts) {
    const tag = opts && opts.button ? 'button' : 'div';
    const attrs = tag === 'button' ? ` type="button" data-act="toggle" data-i="${i}" aria-pressed="${c.out}" aria-label="${esc(c.text)} by ${esc(c.by)}. ${c.out ? 'Thrown out' : 'Kept'}. Tap to change."` : '';
    return `<${tag} class="${tag === 'button' ? 'note-btn' : 'note'}${c.out ? ' out' : ''}" style="--n:${NOTES[i % NOTES.length]};--r:${((i * 41) % 9) - 4}deg"${attrs}>
      <span class="w">${esc(c.text)}</span>${opts && opts.by ? `<small>${esc(c.by)}</small>` : ''}${c.out ? `<span class="stamp">${c.auto ? 'Copycat' : 'Out'}</span>` : ''}</${tag}>`;
  }
  function viewCheck() {
    const C = S.C;
    const outN = C.clues.filter(c => c.out).length;
    return header() + `
    <section class="center">
      <p class="eyebrow">Clue givers only</p>
      <h2 class="big light">Check the clues</h2>
      <p class="lead">${outN ? 'Matching clues are thrown out.' : 'No copycats this time.'} Tap a clue to throw it out or bring it back, for example if two clues mean the same thing. ${esc(C.guesser)} keeps their eyes closed.</p>
      <div class="notes">${C.clues.map((c, i) => noteHTML(c, i, { button: true, by: true })).join('')}</div>
      <div class="actions center"><button class="btn btn-ink btn-big" type="button" data-act="checked">Give it to ${esc(C.guesser)}</button></div>
    </section>`;
  }
  function viewPassGuesser() {
    const C = S.C;
    return header() + `
    <section class="center">
      <p class="eyebrow">Your turn to guess</p>
      <h2 class="big light">Pass to ${esc(C.guesser)}</h2>
      <p class="lead">${esc(C.guesser)}, open your eyes. You get one guess.</p>
      <div class="actions center"><button class="btn btn-ink btn-big" type="button" data-act="me-guess">I'm ${esc(C.guesser)}</button></div>
    </section>`;
  }
  function viewGuess() {
    const C = S.C;
    const kept = C.clues.filter(c => !c.out);
    return header() + `
    <section class="center">
      <p class="eyebrow">${esc(C.guesser)}, what is the word?</p>
      ${kept.length ? `<div class="notes">${kept.map((c, i) => noteHTML(c, i)).join('')}</div>` : `<h2 class="big light">Every clue was a copycat</h2><p class="lead">No clues survived. You can still take a wild guess, or pass.</p>`}
      <div class="field"><label for="guess">Your guess</label><input id="guess" type="text" maxlength="40" autocomplete="off" enterkeyhint="go" placeholder="Type one guess"></div>
      <div class="actions center">
        <button class="btn btn-line" type="button" data-act="pass">Pass</button>
        <button class="btn btn-ink btn-big" type="button" data-act="guess" id="guessBtn" disabled>Guess</button>
      </div>
    </section>`;
  }
  function viewResult() {
    const C = S.C, r = C.result;
    let verdict, line;
    if (r === 'right') { verdict = 'Got it'; line = `${esc(C.guesser)} guessed ${esc(C.word)}. You keep the card.`; }
    else if (r === 'pass') { verdict = 'Passed'; line = `The word was ${esc(C.word)}. That card is gone.`; }
    else {
      verdict = 'Not quite';
      line = `${esc(C.guesser)} said ${esc(C.guess)}. The word was ${esc(C.word)}. ${C.penalty === 'score' ? 'You also lose one card you already won.' : 'You lose this card and the next one.'}`;
    }
    return header() + `
    <section class="center">
      <div class="verdict${r === 'right' ? '' : ' bad'}">${verdict}</div>
      <p class="lead">${line}</p>
      <div class="notes">${C.clues.map((c, i) => noteHTML(c, i, { by: true })).join('')}</div>
      ${statusHTML()}
      <div class="actions center">
        ${r === 'wrong' ? '<button class="btn btn-line" type="button" data-act="override">That was right. Count it</button>' : ''}
        <button class="btn btn-ink btn-big" type="button" data-act="next">${S.pile > 0 ? 'Next card' : 'See your score'}</button>
      </div>
    </section>`;
  }
  function viewFinal() {
    const total = S.settings.cards, pct = S.score / total;
    const verdict = S.score === total ? 'Perfect score' : pct >= 0.85 ? 'Basically telepathic' : pct >= 0.7 ? 'Great teamwork' : pct >= 0.5 ? 'Not bad at all' : pct >= 0.3 ? 'Room to improve' : 'Too many copycats';
    const best = S.best[total] || 0;
    return header() + `
    <section class="center">
      <p class="eyebrow">Game over</p>
      <div class="verdict">${S.score} / ${total}</div>
      <h2 class="big">${verdict}</h2>
      <p class="lead">${best && S.score < best ? 'Your best with ' + total + ' cards is ' + best + '.' : 'That is your best score with ' + total + ' cards so far.'}</p>
      <div class="actions center">
        <button class="btn btn-line" type="button" data-act="setup">Change setup</button>
        <button class="btn btn-ink btn-big" type="button" data-act="again">Play again</button>
      </div>
    </section>`;
  }

  /* ---------- Flow ---------- */
  function startGame() {
    S.players = editor.get();
    S.pile = S.settings.cards;
    S.score = 0;
    S.gIdx = Math.floor(Math.random() * S.players.length);
    sfx.unlock();
    P.stayAwake();
    newCard();
  }
  function newCard() {
    if (S.pile <= 0) { finishGame(); return; }
    const n = S.players.length, g = S.gIdx % n;
    const givers = [];
    for (let k = 1; k < n; k++) givers.push((g + k) % n);
    S.pile--;
    S.C = { word: deck.one(), guesser: S.players[g], givers, pos: 0, clues: [], guess: '', result: null, penalty: null };
    S.screen = 'pass';
    render();
  }
  function submitClue() {
    const C = S.C, input = document.getElementById('clue'), err = document.getElementById('err');
    const v = (input ? input.value : '').trim();
    let msg = '';
    if (!v) msg = 'Type a clue first.';
    else if (/\s/.test(v)) msg = 'One word only. No spaces.';
    else if (tooClose(v, C.word)) msg = 'Too close to the secret word. Try another.';
    if (msg) { if (err) err.textContent = msg; sfx.buzz(0.25); if (input) input.focus(); return; }
    C.clues.push({ text: v, by: S.players[C.givers[C.pos]], out: false, auto: false });
    C.pos++;
    sfx.whoosh();
    if (C.pos < C.givers.length) S.screen = 'pass';
    else {
      markCopycats(C.clues);
      C.clues = P.shuffle(C.clues);
      S.screen = 'check';
      if (C.clues.some(c => c.out)) setTimeout(() => sfx.tone(220, { type: 'sawtooth', to: 110, dur: 0.35, gain: 0.08, lowpass: 900 }), 150);
    }
    render();
  }
  function judge(kind) {
    const C = S.C;
    if (kind === 'pass') { C.result = 'pass'; sfx.whoosh(); }
    else {
      const v = document.getElementById('guess').value.trim();
      if (!v) return;
      C.guess = v;
      if (sameWord(v, C.word)) { C.result = 'right'; S.score++; sfx.ding(); P.confetti({ colors: ['#fff36b', '#ffc2dc', '#a8e9ff', '#c4f7a1', '#fff6ea'], count: 90 }); }
      else {
        C.result = 'wrong';
        if (S.pile > 0) { S.pile--; C.penalty = 'pile'; }
        else if (S.score > 0) { S.score--; C.penalty = 'score'; }
        sfx.buzz(0.6);
      }
    }
    S.screen = 'result';
    render();
  }
  function override() {
    const C = S.C;
    if (C.result !== 'wrong') return;
    if (C.penalty === 'pile') S.pile++;
    else if (C.penalty === 'score') S.score++;
    C.penalty = null;
    C.result = 'right';
    S.score++;
    sfx.ding();
    render();
  }
  function finishGame() {
    const total = S.settings.cards;
    if (S.score > (S.best[total] || 0)) S.best[total] = S.score;
    persist();
    S.screen = 'final';
    render();
    if (S.score / total >= 0.7) { sfx.win(); P.confetti({ colors: ['#fff36b', '#ffc2dc', '#a8e9ff', '#c4f7a1', '#22140a'] }); }
  }

  const VIEWS = { setup: viewSetup, pass: viewPass, clue: viewClue, check: viewCheck, passGuesser: viewPassGuesser, guess: viewGuess, result: viewResult, final: viewFinal };
  function render() {
    app.innerHTML = (VIEWS[S.screen] || viewSetup)();
    if (S.screen === 'setup') editor = P.playerEditor(document.getElementById('players'), { min: 3, max: 10 });
    if (S.screen === 'clue') { const i = document.getElementById('clue'); if (i) i.focus(); }
    if (S.screen === 'guess') { const i = document.getElementById('guess'); if (i) i.focus(); }
    if (S.screen !== shown || S.screen === 'pass') window.scrollTo(0, 0);
    shown = S.screen;
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    switch (b.getAttribute('data-act')) {
      case 'start': startGame(); break;
      case 'me': S.screen = 'clue'; render(); break;
      case 'swap': S.C.word = deck.one([S.C.word]); render(); break;
      case 'clue': submitClue(); break;
      case 'toggle': {
        const c = S.C.clues[Number(b.getAttribute('data-i'))];
        if (c) { c.out = !c.out; c.auto = false; sfx.pop(); render(); }
        break;
      }
      case 'checked': S.screen = 'passGuesser'; render(); break;
      case 'me-guess': S.screen = 'guess'; render(); break;
      case 'guess': judge('guess'); break;
      case 'pass': judge('pass'); break;
      case 'override': override(); break;
      case 'next': S.gIdx++; newCard(); break;
      case 'again': S.pile = S.settings.cards; S.score = 0; S.gIdx++; newCard(); break;
      case 'setup': S.screen = 'setup'; render(); break;
    }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'guess') document.getElementById('guessBtn').disabled = !e.target.value.trim();
    if (e.target.id === 'clue') { const err = document.getElementById('err'); if (err) err.textContent = ''; }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'clue') { e.preventDefault(); submitClue(); }
    if (e.target.id === 'guess') { e.preventDefault(); judge('guess'); }
  });
  document.addEventListener('change', e => {
    if (e.target.name === 'cards') { S.settings.cards = Number(e.target.value); persist(); }
  });

  /* ---------- Online: clues on everyone's own phone ---------- */
  function catCard(F) {
    F.n++;
    if (F.pile <= 0) { F.phase = 'final'; return; }
    const g = F.gIdx % F.players.length;
    F.guesser = F.players[g].id;
    F.givers = F.players.filter(p => p.id !== F.guesser).map(p => p.id);
    F.pile--;
    F.word = deck.one([F.word]);
    F.clues = {};
    F.err = {};
    F.list = [];
    F.guess = '';
    F.result = null;
    F.penalty = null;
    F.phase = 'clue';
  }
  function catClueProblem(F, v) {
    if (!v) return 'Type a clue first.';
    if (/\s/.test(v)) return 'One word only. No spaces.';
    if (tooClose(v, F.word)) return 'Too close to the secret word. Try another.';
    return '';
  }
  function catCheck(F) {
    F.list = P.shuffle(F.givers.filter(id => F.clues[id]).map(id => ({ text: F.clues[id], by: id, out: false, auto: false })));
    markCopycats(F.list);
    F.phase = 'check';
  }
  const ONLINE = {
    game: 'copycats', title: 'Copycats', min: 3, max: 10, header,
    ui: { main: 'btn btn-ink btn-big', alt: 'btn btn-line', inAlt: 'btn btn-line', panel: 'box', eyebrow: 'eyebrow', big: 'big', lead: 'lead', label: 'label', textbtn: 'textbtn' },
    options() {
      return `<span class="label">Cards in the pile</span>
        <div class="seg" role="radiogroup">${[[8, '8 cards'], [13, '13 cards']].map(([v, t]) => `<label><input type="radio" name="o-cards" id="o-cards-${v}" value="${v}"${S.settings.cards === v ? ' checked' : ''}><span>${t}</span></label>`).join('')}</div>`;
    },
    readOptions() { return { cards: S.settings.cards }; },
    start(players, o) {
      const F = { players, total: o.cards, pile: o.cards, score: 0, gIdx: Math.floor(Math.random() * players.length), game: 1, n: 0, word: '' };
      catCard(F);
      return F;
    },
    view(F) {
      const v = { players: F.players, total: F.total, pile: F.pile, score: F.score, n: F.n, game: F.game, phase: F.phase, guesser: F.guesser, givers: F.givers,
        written: Object.keys(F.clues) };
      if (F.phase === 'guess') v.kept = F.list.filter(c => !c.out).map(c => ({ text: c.text }));
      if (F.phase === 'result') Object.assign(v, { list: F.list, word: F.word, guess: F.guess, result: F.result, penalty: F.penalty });
      return v;
    },
    secrets(F) {
      const out = {};
      F.players.forEach(p => {
        if (p.id === F.guesser) { out[p.id] = { n: F.n, guesser: true }; return; }
        out[p.id] = { n: F.n, word: F.word, clue: F.clues[p.id] || '', err: F.err[p.id] && F.err[p.id].n === F.n ? F.err[p.id].text : '',
          list: F.phase === 'check' ? F.list : null };
      });
      return out;
    },
    act(F, from, a, ctx) {
      if (!F.players.some(p => p.id === from)) return false;
      const host = from === ctx.host, giver = F.givers && F.givers.includes(from);
      if (a.t === 'again') {
        if (F.phase !== 'final' || a.g !== F.game) return false;
        F.pile = F.total;
        F.score = 0;
        F.gIdx++;
        F.game++;
        catCard(F);
        return true;
      }
      if (a.n !== F.n) return false;
      switch (a.t) {
        case 'clue': {
          const v = String(a.text == null ? '' : a.text).trim().slice(0, 24);
          if (F.phase !== 'clue' || !giver) return false;
          const why = catClueProblem(F, v);
          if (why) { F.err[from] = { n: F.n, text: why }; return true; }
          delete F.err[from];
          F.clues[from] = v;
          if (F.givers.every(id => F.clues[id])) catCheck(F);
          return true;
        }
        case 'swap':
          if (F.phase !== 'clue' || !(giver || host) || Object.keys(F.clues).length) return false;
          F.word = deck.one([F.word]);
          F.n++;
          return true;
        case 'go':
          if (!host || F.phase !== 'clue' || !Object.keys(F.clues).length) return false;
          catCheck(F);
          return true;
        case 'toggle': {
          const c = F.list[Number(a.i)];
          if (F.phase !== 'check' || !giver || !c) return false;
          c.out = !c.out;
          c.auto = false;
          return true;
        }
        case 'checked':
          if (F.phase !== 'check' || !giver) return false;
          F.phase = 'guess';
          return true;
        case 'guess': {
          const g = String(a.g == null ? '' : a.g).trim().slice(0, 40);
          if (F.phase !== 'guess' || from !== F.guesser || !g) return false;
          F.guess = g;
          if (sameWord(g, F.word)) { F.result = 'right'; F.score++; }
          else {
            F.result = 'wrong';
            if (F.pile > 0) { F.pile--; F.penalty = 'pile'; }
            else if (F.score > 0) { F.score--; F.penalty = 'score'; }
          }
          F.phase = 'result';
          return true;
        }
        case 'pass':
          if (F.phase !== 'guess' || from !== F.guesser) return false;
          F.result = 'pass';
          F.phase = 'result';
          return true;
        case 'override':
          if (F.phase !== 'result' || F.result !== 'wrong') return false;
          if (F.penalty === 'pile') F.pile++;
          else if (F.penalty === 'score') F.score++;
          F.penalty = null;
          F.result = 'right';
          F.score++;
          return true;
        case 'next':
          if (F.phase !== 'result') return false;
          F.gIdx++;
          catCard(F);
          return true;
      }
      return false;
    },
    leave(F, ids) {
      const gone = F.players.filter(p => !ids.includes(p.id)).map(p => p.id);
      if (!gone.length) return;
      F.players = F.players.filter(p => ids.includes(p.id));
      if (F.players.length < 3) return 'open';
      if (F.phase === 'final' || F.phase === 'result') return;
      // The guesser walked out, so put the card back and deal the next one.
      if (gone.includes(F.guesser)) { F.pile++; catCard(F); return; }
      F.givers = F.givers.filter(id => !gone.includes(id));
      gone.forEach(id => { delete F.clues[id]; });
      F.list = F.list.filter(c => !gone.includes(c.by));
      if (F.phase === 'clue' && F.givers.every(id => F.clues[id])) catCheck(F);
    },
    render(v) {
      const F = v.pub, me = v.me;
      const m = v.mine && v.mine.n === F.n ? v.mine : null;
      const nm = id => (id === me ? 'you' : ((F.players.find(x => x.id === id) || {}).name || 'Someone'));
      const Nm = id => (id === me ? 'You' : esc(nm(id)));
      const send = a => Online.sendAttr(Object.assign({ n: F.n }, a));
      const status = `<div class="status"><span>Score ${F.score}</span><span>${P.plural(F.pile, 'card')} left</span></div>`;
      const note = (c, i, opts) => {
        const tag = opts && opts.button ? 'button' : 'div';
        const attrs = tag === 'button' ? ` type="button" ${send({ t: 'toggle', i })} aria-pressed="${c.out}" aria-label="${esc(c.text)} by ${esc(nm(c.by))}. ${c.out ? 'Thrown out' : 'Kept'}. Tap to change."` : '';
        return `<${tag} class="${tag === 'button' ? 'note-btn' : 'note'}${c.out ? ' out' : ''}" style="--n:${NOTES[i % NOTES.length]};--r:${((i * 41) % 9) - 4}deg"${attrs}>
          <span class="w">${esc(c.text)}</span>${opts && opts.by ? `<small>${Nm(c.by)}</small>` : ''}${c.out ? `<span class="stamp">${c.auto ? 'Copycat' : 'Out'}</span>` : ''}</${tag}>`;
      };
      if (F.phase === 'clue') {
        const waiting = F.givers.filter(id => !F.written.includes(id));
        if (F.guesser === me) {
          return `<section class="center"><p class="eyebrow">You are guessing</p><h2 class="big light">Eyes on your own screen</h2>
            <p class="lead">Everyone else is writing a one-word clue for you. ${waiting.length ? 'Waiting for ' + esc(P.listNames(waiting.map(nm))) + '.' : ''}</p>${status}</section>`;
        }
        const mine = m && m.clue, editing = v.local.catEdit === F.n;
        return `<section class="center">
          <p class="eyebrow">Your clue for ${esc(nm(F.guesser))}</p>
          <div class="secret"><small>The secret word</small><b>${esc(m ? m.word : '')}</b></div>
          ${mine && !editing ? `<p class="lead">Your clue is <b>${esc(mine)}</b>.</p><div class="actions center"><button class="btn btn-line" type="button" data-ui="edit">Change it</button></div>`
            : `<div class="field"><label for="oclue-${F.n}">One word only</label><input id="oclue-${F.n}" data-keep data-enter="clue" type="text" maxlength="24" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Type your clue"></div>
               <p class="err" role="alert">${esc((v.local.catErr && v.local.catErr.n === F.n ? v.local.catErr.text : '') || (m && m.err) || '')}</p>
               <div class="actions center"><button class="btn btn-ink btn-big" type="button" data-ui="clue"${v.pending ? ' disabled' : ''}>Hide it</button></div>`}
          <p class="waiting">${waiting.length ? 'Still writing: ' + esc(P.listNames(waiting.map(nm))) + '.' : 'Every clue is in.'}</p>
          ${!F.written.length ? `<div class="actions center"><button class="textbtn" type="button" ${send({ t: 'swap' })}>Nobody knows this word? Get a new one</button></div>` : ''}
          ${v.host && F.written.length && waiting.length ? `<div class="actions center"><button class="btn btn-line" type="button" ${send({ t: 'go' })}>Check the clues now</button></div>` : ''}
          ${status}
        </section>`;
      }
      if (F.phase === 'check') {
        if (F.guesser === me) {
          return `<section class="center"><p class="eyebrow">You are guessing</p><h2 class="big light">The others are checking the clues</h2>
            <p class="lead">Matching clues get thrown out before you see them.</p>${status}</section>`;
        }
        const list = (m && m.list) || [];
        const outN = list.filter(c => c.out).length;
        return `<section class="center">
          <p class="eyebrow">Clue givers only</p>
          <h2 class="big light">Check the clues</h2>
          <p class="lead">${outN ? 'Matching clues are thrown out.' : 'No copycats this time.'} Tap a clue to throw it out or bring it back, for example if two clues mean the same thing.</p>
          <div class="notes">${list.map((c, i) => note(c, i, { button: true, by: true })).join('')}</div>
          <div class="actions center"><button class="btn btn-ink btn-big" type="button" ${send({ t: 'checked' })}>Give it to ${esc(nm(F.guesser))}</button></div>
        </section>`;
      }
      if (F.phase === 'guess') {
        const kept = F.kept || [];
        if (F.guesser !== me) {
          return `<section class="center"><p class="eyebrow">${esc(nm(F.guesser))} is guessing</p>
            ${kept.length ? `<div class="notes">${kept.map((c, i) => note(c, i)).join('')}</div>` : '<h2 class="big light">Every clue was a copycat</h2>'}
            <p class="lead">${esc(nm(F.guesser))} gets one guess.</p>${status}</section>`;
        }
        return `<section class="center">
          <p class="eyebrow">What is the word?</p>
          ${kept.length ? `<div class="notes">${kept.map((c, i) => note(c, i)).join('')}</div>` : '<h2 class="big light">Every clue was a copycat</h2><p class="lead">No clues survived. You can still take a wild guess, or pass.</p>'}
          <div class="field"><label for="oguess-${F.n}">Your guess</label><input id="oguess-${F.n}" data-keep data-enter="guess" type="text" maxlength="40" autocomplete="off" enterkeyhint="go" placeholder="Type one guess"></div>
          <div class="actions center">
            <button class="btn btn-line" type="button" ${send({ t: 'pass' })}>Pass</button>
            <button class="btn btn-ink btn-big" type="button" data-ui="guess"${v.pending ? ' disabled' : ''}>Guess</button>
          </div>
        </section>`;
      }
      if (F.phase === 'result') {
        const r = F.result, gName = Nm(F.guesser);
        let verdict, line;
        if (r === 'right') { verdict = 'Got it'; line = `${gName} guessed ${esc(F.word)}. You keep the card.`; }
        else if (r === 'pass') { verdict = 'Passed'; line = `The word was ${esc(F.word)}. That card is gone.`; }
        else { verdict = 'Not quite'; line = `${gName} said ${esc(F.guess)}. The word was ${esc(F.word)}. ${F.penalty === 'score' ? 'You also lose one card you already won.' : 'You lose this card and the next one.'}`; }
        return `<section class="center">
          <div class="verdict${r === 'right' ? '' : ' bad'}">${verdict}</div>
          <p class="lead">${line}</p>
          <div class="notes">${F.list.map((c, i) => note(c, i, { by: true })).join('')}</div>
          ${status}
          <div class="actions center">
            ${r === 'wrong' ? `<button class="btn btn-line" type="button" ${send({ t: 'override' })}>That was right. Count it</button>` : ''}
            <button class="btn btn-ink btn-big" type="button" ${send({ t: 'next' })}>${F.pile > 0 ? 'Next card' : 'See your score'}</button>
          </div>
        </section>`;
      }
      const total = F.total, pct = F.score / total;
      const verdict = F.score === total ? 'Perfect score' : pct >= 0.85 ? 'Basically telepathic' : pct >= 0.7 ? 'Great teamwork' : pct >= 0.5 ? 'Not bad at all' : pct >= 0.3 ? 'Room to improve' : 'Too many copycats';
      return `<section class="center">
        <p class="eyebrow">Game over</p>
        <div class="verdict">${F.score} / ${total}</div>
        <h2 class="big">${verdict}</h2>
        <div class="actions center"><button class="btn btn-ink btn-big" type="button" ${Online.sendAttr({ t: 'again', g: F.game })}>Play again</button></div>
      </section>`;
    },
    click(name, el, v) {
      const F = v.pub;
      if (name === 'edit') { v.local.catEdit = F.n; v.redraw(); return; }
      if (name === 'clue') {
        const f = document.getElementById('oclue-' + F.n), t = (f ? f.value : '').trim();
        const why = v.mine && v.mine.word ? catClueProblem({ word: v.mine.word }, t) : (!t ? 'Type a clue first.' : '');
        if (why) { v.local.catErr = { n: F.n, text: why }; sfx.buzz(0.25); v.redraw(); return; }
        v.local.catErr = null;
        v.local.catEdit = null;
        v.send({ t: 'clue', n: F.n, text: t });
        sfx.whoosh();
      }
      if (name === 'guess') {
        const f = document.getElementById('oguess-' + F.n), g = (f ? f.value : '').trim();
        if (!g) { if (f) f.focus(); return; }
        v.send({ t: 'guess', n: F.n, g });
      }
    },
    fx(v, prev) {
      const F = v.pub, B = prev && prev.pub;
      if (!B || B.game !== F.game) return;
      if (F.phase === 'check' && B.phase !== 'check' && v.mine && v.mine.list && v.mine.list.some(c => c.out)) setTimeout(() => sfx.tone(220, { type: 'sawtooth', to: 110, dur: 0.35, gain: 0.08, lowpass: 900 }), 150);
      if (F.phase === 'result' && B.phase !== 'result') {
        if (F.result === 'right') { sfx.ding(); P.confetti({ colors: ['#fff36b', '#ffc2dc', '#a8e9ff', '#c4f7a1', '#fff6ea'], count: 90 }); }
        else if (F.result === 'wrong') sfx.buzz(0.6); else sfx.whoosh();
      }
      if (F.phase === 'final' && B.phase !== 'final') {
        if (F.score > (S.best[F.total] || 0)) { S.best[F.total] = F.score; persist(); }
        if (F.score / F.total >= 0.7) { sfx.win(); P.confetti({ colors: ['#fff36b', '#ffc2dc', '#a8e9ff', '#c4f7a1', '#22140a'] }); }
      }
    }
  };
  document.addEventListener('change', e => { if (e.target.name === 'o-cards') { S.settings.cards = Number(e.target.value); persist(); } });

  if (window.Online && Online.wanted()) Online.room(ONLINE);
  else render();
})();
</script>
</body>
</html>
