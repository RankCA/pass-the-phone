<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Werewolf | Pass the Phone</title>
<meta name="description" content="The phone deals secret roles and reads the night out loud. Find the werewolves before they find you.">
<meta name="theme-color" content="#0e1330">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Spectral:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../shared/base.css?v=21cb0b0f">
<style>
/* Layout: a moonlit village. Night screens are mostly sky so nothing glows in a dark room; day brings the sun up over the same trees. */
:root{
  color-scheme:dark;
  --bg:#0e1330;
  --fg:#f3ecd8;
  --muted:#b8b5cf;
  --panel:rgba(243,236,216,.08);
  --line:rgba(243,236,216,.3);
  --field:#f3ecd8;
  --field-ink:#151833;
  --accent:#f0c75e;
  --accent-ink:#1a1530;
  --accent-shadow:#8f7024;
  --wolf:#e85a5a;
  --focus:#f0c75e;
  --f-display:"Cinzel","Times New Roman",serif;
  --f-body:"Spectral",Georgia,serif;
}
body{background:linear-gradient(180deg,#0a0e2a 0%,#151c49 55%,#231b45 100%);background-attachment:fixed;transition:background .8s ease}
body.day{--fg:#20182e;--muted:#4c4258;--line:rgba(32,24,46,.32);--panel:rgba(255,255,255,.5);--field:#ffffff;--accent:#5b3fa0;--accent-ink:#fff6e0;--accent-shadow:#33215f;--focus:#5b3fa0;
  background:linear-gradient(180deg,#ffb36b 0%,#ffd99a 42%,#a9cce6 100%);background-attachment:fixed}
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.sky svg{position:absolute;left:0;bottom:0;width:100%;height:100%}
.star{fill:#fff;animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:.9}}
body.day .star{opacity:0!important;animation:none}
.orb{transition:fill .8s ease}
body.day .orb{fill:#fff3b0}
.trees{fill:#070a1f;transition:fill .8s ease}
body.day .trees{fill:#2f4a3b}
.title{font-weight:800;letter-spacing:.04em;font-size:clamp(40px,12vw,96px);text-shadow:0 0 30px rgba(240,199,94,.35)}
.panel{box-shadow:inset 0 0 0 1px var(--line)}
.pp-input{font-family:var(--f-body)}
.seg span,.opt-box b,.pick button,.btn{font-family:var(--f-display)}
.btn{font-weight:600;letter-spacing:.04em}
.night-word{margin:40px 0 0;font-family:var(--f-display);font-weight:800;font-size:clamp(42px,11vw,84px);line-height:1.05;letter-spacing:.03em;text-wrap:balance}
.whisper{margin:14px auto 0;max-width:28em;font-size:20px;color:var(--muted)}
.moonbig{display:block;width:min(46vw,200px);height:auto;margin:30px auto 0;filter:drop-shadow(0 0 40px rgba(240,199,94,.45))}
.role-art{width:44%;max-width:160px;height:auto}
.reveal-front{background:radial-gradient(circle at 50% 35%,#2b3570,#141a44 70%);box-shadow:inset 0 0 0 3px var(--accent);color:var(--fg)}
.reveal-front b{font-family:var(--f-display);font-size:22px;letter-spacing:.08em}
.reveal-front small{font-size:16px;color:var(--muted)}
.reveal-back{background:linear-gradient(180deg,#f7efd9,#e8dcbc);color:#1d1830;box-shadow:inset 0 0 0 3px var(--accent)}
.reveal-back.wolf{background:linear-gradient(180deg,#3a1420,#1c0b16);color:#ffe9e9;box-shadow:inset 0 0 0 3px var(--wolf)}
.role-name{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,44px);letter-spacing:.04em;line-height:1}
.role-text{margin:6px 0 0;font-size:16px;line-height:1.35;max-width:24em}
.role-team{margin:4px 0 0;font-weight:700;font-size:15px}
.result-card{margin:26px auto 0;max-width:460px;padding:22px;border-radius:var(--radius);background:var(--panel);box-shadow:inset 0 0 0 2px var(--line)}
.result-card.bad{box-shadow:inset 0 0 0 3px var(--wolf)}
.result-card p{margin:0;font-size:22px}
.cast{list-style:none;margin:22px auto 0;padding:0;max-width:520px;display:grid;gap:6px;text-align:left}
.cast li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-weight:700}
.cast li.dead span:first-child{text-decoration:line-through;color:var(--muted)}
.cast li .wolfname{color:var(--wolf)}
body.day .cast li .wolfname{color:#a32424}
.alive-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
.alive-row span{padding:4px 12px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-weight:700}
.alive-row span.dead{background:transparent;color:var(--muted);text-decoration:line-through}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.pack{list-style:none;margin:16px auto 0;padding:0;max-width:440px;display:grid;gap:6px;text-align:left}
.pack li{display:flex;justify-content:space-between;gap:12px;padding:8px 14px;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-weight:700}
.checks{margin:14px auto 0;max-width:30em;font-size:17px;color:var(--muted)}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><svg id="sky" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMax slice"></svg></div>
<div class="wrap" id="app"></div>
<script src="../shared/party.js?v=ab12cd68"></script>
<script src="../shared/online.js?v=2a414f29"></script>
<script>
(function () {
  'use strict';
  const P = window.Party, sfx = P.sfx, esc = P.esc;
  const KEY = 'ptp.werewolf';
  const app = document.getElementById('app');

  const ART = {
    wolf: '<svg class="role-art" viewBox="0 0 100 100" aria-hidden="true"><path d="M18 30L30 6l14 22h12L70 6l12 24-4 24-14 18-6 18H42l-6-18-14-18z" fill="#2a1018" stroke="#e85a5a" stroke-width="3" stroke-linejoin="round"/><path d="M34 44l10 6-10 2zM66 44l-10 6 10 2z" fill="#f0c75e"/><path d="M44 74h12l-6 8z" fill="#e85a5a"/></svg>',
    seer: '<svg class="role-art" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="44" r="32" fill="#c9d6ff" stroke="#1d1830" stroke-width="3"/><path d="M26 44c8-12 40-12 48 0-8 12-40 12-48 0z" fill="#fff" stroke="#1d1830" stroke-width="3"/><circle cx="50" cy="44" r="8" fill="#5b3fa0"/><path d="M30 76h40l6 14H24z" fill="#8f7024" stroke="#1d1830" stroke-width="3" stroke-linejoin="round"/></svg>',
    doctor: '<svg class="role-art" viewBox="0 0 100 100" aria-hidden="true"><path d="M40 8h20v18l16 22v34a10 10 0 0 1-10 10H34a10 10 0 0 1-10-10V48l16-22z" fill="#d7f5e6" stroke="#1d1830" stroke-width="3" stroke-linejoin="round"/><path d="M45 48h10v10h10v10H55v10H45V68H35V58h10z" fill="#e85a5a"/></svg>',
    villager: '<svg class="role-art" viewBox="0 0 100 100" aria-hidden="true"><path d="M14 46L50 14l36 32" fill="none" stroke="#1d1830" stroke-width="4" stroke-linejoin="round"/><path d="M22 42h56v46H22z" fill="#f0c75e" stroke="#1d1830" stroke-width="3"/><path d="M42 88V64h16v24" fill="#8a5a3c" stroke="#1d1830" stroke-width="3"/><rect x="30" y="52" width="10" height="10" fill="#fff" stroke="#1d1830" stroke-width="2"/><rect x="60" y="52" width="10" height="10" fill="#fff" stroke="#1d1830" stroke-width="2"/></svg>'
  };
  const ROLES = {
    wolf: { name: 'Werewolf', team: 'Werewolf team', text: 'Each night, wake up with the other werewolves and choose someone to attack. By day, act like a normal villager.' },
    seer: { name: 'Seer', team: 'Village team', text: 'Each night, wake up and check one player. The phone tells you if they are a werewolf.' },
    doctor: { name: 'Doctor', team: 'Village team', text: 'Each night, choose one player to protect. If the werewolves pick them, they live. You can pick yourself.' },
    villager: { name: 'Villager', team: 'Village team', text: 'No special power. Talk, watch closely, and vote out the werewolves.' }
  };
  const MOON = '<svg class="moonbig" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="#f3ecd8"/><circle cx="36" cy="38" r="8" fill="#d9cfb2"/><circle cx="62" cy="58" r="11" fill="#d9cfb2"/><circle cx="58" cy="30" r="5" fill="#d9cfb2"/></svg>';

  const saved = P.store.get(KEY, {}) || {};
  const S = {
    settings: Object.assign({ wolves: 0, seer: true, doctor: true, reveal: true, voice: P.canSpeak(), talk: 180 }, saved.settings || {}),
    screen: 'setup', players: [], roles: [], alive: [], deal: 0, peeked: false,
    night: 0, gen: 0, step: 'sleep', narration: '', target: null, pending: null, check: null, save: null,
    died: null, exiled: null, winner: null, resolve: null
  };
  let editor = null, shown = null, talk = null;
  function persist() { P.store.set(KEY, { settings: S.settings }); }
  const nameOf = i => S.players[i];
  const roleOf = i => S.roles[i];
  const aliveIdx = () => S.players.map((_, i) => i).filter(i => S.alive[i]);
  const asRole = r => (r === 'wolf' ? 'a werewolf' : r === 'villager' ? 'a villager' : 'the ' + ROLES[r].name.toLowerCase());

  /* ---------- Sky ---------- */
  (function drawSky() {
    const svg = document.getElementById('sky');
    let stars = '';
    for (let i = 0; i < 70; i++) {
      const x = Math.random() * 1000, y = Math.random() * 640, r = Math.random() * 1.8 + 0.6;
      stars += '<circle class="star" cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="' + r.toFixed(1) + '" style="animation-delay:' + (Math.random() * 3).toFixed(2) + 's"/>';
    }
    let trees = '';
    for (let x = -20; x < 1040; x += 46 + Math.random() * 30) {
      const h = 90 + Math.random() * 120, w = 40 + Math.random() * 26;
      trees += '<path d="M' + x.toFixed(0) + ' 1000L' + (x + w / 2).toFixed(0) + ' ' + (1000 - h).toFixed(0) + 'L' + (x + w).toFixed(0) + ' 1000z"/>';
    }
    svg.innerHTML = stars + '<circle class="orb" cx="820" cy="150" r="60" fill="#f3ecd8"/><g class="trees">' + trees + '<rect x="0" y="985" width="1000" height="20"/></g>';
  })();

  /* ---------- Rules ---------- */
  function wolfCount(n) {
    const max = Math.max(1, Math.floor((n - 1) / 3));
    if (S.settings.wolves > 0) return Math.min(S.settings.wolves, max);
    return n <= 6 ? 1 : n <= 10 ? 2 : 3;
  }
  function deal() {
    const n = S.players.length, k = wolfCount(n);
    const roles = [];
    for (let i = 0; i < k; i++) roles.push('wolf');
    if (S.settings.seer) roles.push('seer');
    if (S.settings.doctor) roles.push('doctor');
    while (roles.length < n) roles.push('villager');
    S.roles = P.shuffle(roles.slice(0, n));
    S.alive = S.players.map(() => true);
  }
  function winnerNow() {
    const alive = aliveIdx();
    const wolves = alive.filter(i => roleOf(i) === 'wolf').length;
    if (wolves === 0) return 'village';
    if (wolves >= alive.length - wolves) return 'wolves';
    return null;
  }

  /* ---------- Narration ---------- */
  function chime() { sfx.tone(523.25, { type: 'sine', dur: 0.9, gain: 0.07 }); sfx.tone(784, { type: 'sine', at: 0.12, dur: 1.1, gain: 0.05 }); }
  async function say(text, gen) {
    if (gen !== S.gen) return;
    if (S.settings.voice && P.canSpeak()) { await P.speak(text, { rate: 0.92, pitch: 0.9 }); return; }
    S.step = 'narrate';
    S.narration = text;
    render();
    await action(gen);
    if (gen === S.gen) { S.step = 'sleep'; render(); }
  }
  function action(gen) {
    return new Promise(res => { S.resolve = v => { S.resolve = null; res(v); }; if (gen !== S.gen) res(null); });
  }
  function act(v) { if (S.resolve) S.resolve(v); }

  async function runNight() {
    const gen = ++S.gen;
    S.night++;
    S.target = null; S.save = null; S.check = null; S.pending = null;
    document.body.classList.remove('day');
    S.screen = 'night';
    S.step = 'sleep';
    render();
    chime();
    await say('Night falls on the village. Everyone, close your eyes.', gen);
    if (gen !== S.gen) return;
    await P.wait(2500);
    await phase('wolf', gen,
      'Werewolves, open your eyes. Pick up the phone and choose who to attack.',
      'Werewolves, put the phone down and close your eyes.');
    if (S.settings.seer) await phase('seer', gen,
      'Seer, open your eyes. Pick up the phone and choose someone to check.',
      'Seer, put the phone down and close your eyes.');
    if (S.settings.doctor) await phase('doctor', gen,
      'Doctor, open your eyes. Pick up the phone and choose someone to protect.',
      'Doctor, put the phone down and close your eyes.');
    if (gen !== S.gen) return;
    morning(gen);
  }
  async function phase(role, gen, wake, sleep) {
    if (gen !== S.gen) return;
    S.step = 'sleep';
    render();
    await P.wait(1800);
    if (gen !== S.gen) return;
    chime();
    await say(wake, gen);
    if (gen !== S.gen) return;
    const someone = aliveIdx().some(i => roleOf(i) === role);
    if (someone) {
      S.step = role;
      render();
      await action(gen);
    } else {
      S.step = 'waiting';
      S.narration = ROLES[role].name;
      render();
      await P.wait(6000 + Math.random() * 4000);
    }
    if (gen !== S.gen) return;
    S.step = 'sleep';
    render();
    await say(sleep, gen);
    await P.wait(1200);
  }
  async function morning(gen) {
    const died = S.target != null && S.target !== S.save ? S.target : null;
    S.died = died;
    if (died != null) S.alive[died] = false;
    document.body.classList.add('day');
    S.winner = winnerNow();
    S.screen = 'morning';
    render();
    sfx.win();
    let line = 'Everyone, wake up. ';
    line += died != null ? 'Last night, ' + nameOf(died) + ' was attacked by the werewolves.' : 'Last night, nobody was hurt.';
    if (died != null && S.settings.reveal) line += ' ' + nameOf(died) + ' was ' + asRole(roleOf(died)) + '.';
    if (S.settings.voice && P.canSpeak()) await P.speak(line, { rate: 0.92, pitch: 0.9 });
  }

  /* ---------- Views ---------- */
  function viewSetup() {
    const st = S.settings;
    return P.header() + `
    <h1 class="title">Werewolf</h1>
    <p class="tagline">The phone deals secret roles and reads the night out loud. Nobody has to sit out as the narrator.</p>
    <div class="panel">
      <div class="sec"><span class="label">Villagers</span><div id="players"></div><p class="hint" id="pnote"></p></div>
      <div class="sec"><span class="label">Werewolves</span>${P.seg('wolves', [[0, 'Auto'], [1, '1'], [2, '2'], [3, '3']], st.wolves)}<p class="hint">Auto picks 1 for up to 6 players, 2 for up to 10, then 3.</p></div>
      <div class="sec"><span class="label">Special roles</span>
        <label class="check"><input type="checkbox" id="seer"${st.seer ? ' checked' : ''}> Seer: checks one player each night</label>
        <label class="check" style="margin-top:10px"><input type="checkbox" id="doctor"${st.doctor ? ' checked' : ''}> Doctor: protects one player each night</label>
      </div>
      <div class="sec"><span class="label">Rules</span>
        <label class="check"><input type="checkbox" id="reveal"${st.reveal ? ' checked' : ''}> Show the role of anyone who is out</label>
        <label class="check" style="margin-top:10px"><input type="checkbox" id="voice"${st.voice ? ' checked' : ''}${P.canSpeak() ? '' : ' disabled'}> The phone reads the night out loud</label>
        <p class="hint">${P.canSpeak() ? 'Turn this off if a person who is not playing wants to narrate.' : 'This browser cannot talk, so a person who is not playing reads the night from the screen.'}</p>
      </div>
      <div class="sec"><span class="label">Talk time each day</span>${P.seg('talk', [[0, 'No timer'], [120, '2 min'], [180, '3 min'], [300, '5 min']], st.talk)}</div>
      <div class="actions"><button class="btn btn-main btn-big" type="button" data-act="start">Deal the roles</button></div>
    </div>
    <div class="panel">
      <span class="label">Play online</span>
      <p class="hint">Everyone gets their role and makes their night moves on their own phone, so nobody has to narrate. Make a game, then send the code.</p>
      <div class="actions"><a class="btn btn-alt" href="?lobby=new">Make an online game</a><a class="btn btn-alt" href="../online/">Join with a code</a></div>
    </div>
    <details class="howto">
      <summary>How to play</summary>
      <ol>
        <li>Pass the phone around. Each player presses and holds the card to see their secret role.</li>
        <li>At night everyone closes their eyes and the phone calls each role in turn. Whoever is called opens their eyes, picks up the phone, taps a name and puts it back.</li>
        <li>In the morning the phone announces who was attacked. Everyone talks it over and votes someone out.</li>
        <li>The village wins when every werewolf is gone. The werewolves win when they match the village in number.</li>
      </ol>
    </details>`;
  }
  function viewPass() {
    const i = S.deal;
    return P.header() + P.passScreen({ eyebrow: 'Role ' + (i + 1) + ' of ' + S.players.length, name: nameOf(i), lead: 'Only ' + esc(nameOf(i)) + ' looks at the screen.' });
  }
  function viewCard() {
    const i = S.deal, r = roleOf(i), R = ROLES[r];
    const others = r === 'wolf' ? S.players.map((n, k) => k).filter(k => k !== i && roleOf(k) === 'wolf').map(nameOf) : [];
    return P.header() + `
    <section class="center">
      <p class="eyebrow">For ${esc(nameOf(i))} only</p>
      <div class="reveal" id="card" tabindex="0" role="button" aria-label="Press and hold to see your role">
        <div class="reveal-in">
          <div class="reveal-face reveal-front">${MOON.replace('moonbig', 'role-art')}<b>Your role</b><small>Press and hold</small></div>
          <div class="reveal-face reveal-back${r === 'wolf' ? ' wolf' : ''}">${ART[r]}<p class="role-name">${R.name}</p><p class="role-team">${R.team}</p><p class="role-text">${R.text}</p>
            ${r === 'wolf' ? `<p class="role-team">${others.length ? 'Your pack: ' + esc(P.listNames(others)) : 'You hunt alone.'}</p>` : ''}</div>
        </div>
      </div>
      <div class="actions center"><button class="btn btn-main btn-big" type="button" data-act="seen" id="seenBtn"${S.peeked ? '' : ' disabled'}>${i < S.players.length - 1 ? 'Done. Pass it on' : 'Done'}</button></div>
      <p class="lead">Let go to hide it again. The button unlocks after you look.</p>
    </section>`;
  }
  function viewDealt() {
    return P.header() + `
    <section class="center">
      ${MOON}
      <h2 class="big">Everyone has a role</h2>
      <p class="lead">Put the phone in the middle where everyone can reach it. When the phone says so, close your eyes.</p>
      <div class="actions center"><button class="btn btn-main btn-big" type="button" data-act="night">Start the first night</button></div>
    </section>`;
  }
  function choose(list, act, extra) {
    return `<div class="pick">${list.map(i => `<button type="button" data-act="${act}" data-i="${i}">${esc(nameOf(i))}${extra ? extra(i) : ''}</button>`).join('')}</div>`;
  }
  function viewNight() {
    const st = S.step;
    if (st === 'narrate') {
      return `<section class="center"><p class="eyebrow">Narrator, read this out loud</p><p class="night-word">${esc(S.narration)}</p>
        <div class="actions center"><button class="btn btn-main btn-big" type="button" data-act="next">Next</button></div></section>`;
    }
    if (st === 'wolf') {
      if (S.pending != null) {
        return `<section class="center"><p class="eyebrow">Werewolves</p><h2 class="big">Attack ${esc(nameOf(S.pending))}?</h2>
          <div class="actions center"><button class="btn btn-alt" type="button" data-act="wolf-back">Pick again</button><button class="btn btn-main btn-big" type="button" data-act="wolf-yes">Yes</button></div></section>`;
      }
      const prey = aliveIdx().filter(i => roleOf(i) !== 'wolf');
      return `<section class="center"><p class="eyebrow">Werewolves only</p><h2 class="big">Who do you attack?</h2><p class="lead">Agree by pointing, then one of you taps.</p>${choose(prey, 'wolf-pick')}</section>`;
    }
    if (st === 'seer') {
      if (S.check != null) {
        const bad = roleOf(S.check) === 'wolf';
        return `<section class="center"><p class="eyebrow">Seer only</p><div class="result-card${bad ? ' bad' : ''}"><p><b>${esc(nameOf(S.check))}</b> ${bad ? 'is a werewolf.' : 'is not a werewolf.'}</p></div>
          <div class="actions center"><button class="btn btn-main btn-big" type="button" data-act="seer-done">Got it</button></div></section>`;
      }
      const me = aliveIdx().find(i => roleOf(i) === 'seer');
      return `<section class="center"><p class="eyebrow">Seer only</p><h2 class="big">Who do you check?</h2>${choose(aliveIdx().filter(i => i !== me), 'seer-pick')}</section>`;
    }
    if (st === 'doctor') {
      return `<section class="center"><p class="eyebrow">Doctor only</p><h2 class="big">Who do you protect?</h2>${choose(aliveIdx(), 'doc-pick', i => roleOf(i) === 'doctor' ? ' (you)' : '')}</section>`;
    }
    if (st === 'waiting') {
      return `<section class="center">${MOON}<p class="night-word">Eyes closed</p><p class="whisper">The ${esc(S.narration.toLowerCase())} is taking a turn.</p></section>`;
    }
    return `<section class="center">${MOON}<p class="night-word">Eyes closed</p><p class="whisper">Night ${S.night}. Only open your eyes when the phone calls your role.</p>
      <div class="actions center"><button class="textbtn" type="button" data-act="quit">Stop the game</button></div></section>`;
  }
  function aliveRow() {
    return `<div class="alive-row">${S.players.map((n, i) => `<span class="${S.alive[i] ? '' : 'dead'}">${esc(n)}</span>`).join('')}</div>`;
  }
  function viewMorning() {
    const d = S.died;
    let body;
    if (d == null) body = '<h2 class="big">Nobody was hurt</h2><p class="lead">The werewolves struck, but someone was protected. Or they missed.</p>';
    else body = `<h2 class="big">${esc(nameOf(d))} was attacked</h2><p class="lead">${S.settings.reveal ? esc(nameOf(d)) + ' was ' + asRole(roleOf(d)) + '.' : esc(nameOf(d)) + ' is out of the game.'} ${esc(nameOf(d))} can watch but must stay quiet.</p>`;
    return P.header() + `
    <section class="center">
      <p class="eyebrow">Morning ${S.night}</p>
      ${body}
      ${aliveRow()}
      <div class="actions center"><button class="btn btn-main btn-big" type="button" data-act="${S.winner ? 'end' : 'talk'}">${S.winner ? 'See who won' : 'Start talking'}</button></div>
    </section>`;
  }
  function viewDay() {
    return P.header() + `
    <section class="center">
      <p class="eyebrow">Day ${S.night}</p>
      <h2 class="big">Who is a werewolf?</h2>
      <p class="lead">Share what you know, accuse, defend yourself. Then vote someone out.</p>
      ${S.settings.talk ? `<div class="timer" id="timer" role="timer">${P.clock(talk ? talk.left : S.settings.talk * 1000)}</div>
        <div class="actions center"><button class="btn btn-alt" type="button" data-act="pause" id="pauseBtn">${talk && talk.running ? 'Pause' : 'Start timer'}</button></div>` : ''}
      ${aliveRow()}
      <div class="actions center"><button class="btn btn-main btn-big" type="button" data-act="vote">Time to vote</button></div>
    </section>`;
  }
  function viewVote() {
    return P.header() + `
    <section class="center">
      <p class="eyebrow">The vote</p>
      <h2 class="big">Point on three</h2>
      <p class="lead">Count down out loud. Whoever gets the most fingers is voted out.</p>
      ${choose(aliveIdx(), 'exile')}
      <div class="actions center"><button class="btn btn-alt" type="button" data-act="exile" data-i="-1">It was a tie. Nobody goes</button></div>
    </section>`;
  }
  function viewExile() {
    const e = S.exiled;
    let body;
    if (e < 0) body = '<h2 class="big">Nobody was voted out</h2><p class="lead">The village could not agree.</p>';
    else body = `<h2 class="big">${esc(nameOf(e))} is out</h2><p class="lead">${S.settings.reveal ? esc(nameOf(e)) + ' was ' + asRole(roleOf(e)) + '.' : 'Their role stays secret until the end.'}</p>`;
    return P.header() + `
    <section class="center">
      <p class="eyebrow">The village has spoken</p>
      ${body}
      ${aliveRow()}
      <div class="actions center"><button class="btn btn-main btn-big" type="button" data-act="${S.winner ? 'end' : 'night'}">${S.winner ? 'See who won' : 'Night falls'}</button></div>
    </section>`;
  }
  function viewEnd() {
    const wolvesWin = S.winner === 'wolves';
    return P.header() + `
    <section class="center">
      <p class="eyebrow">Game over</p>
      <h2 class="big">${wolvesWin ? 'The werewolves win' : 'The village wins'}</h2>
      <p class="lead">${wolvesWin ? 'The werewolves now match the village. Nobody is safe.' : 'Every werewolf has been found. The village sleeps soundly.'}</p>
      <ul class="cast">${S.players.map((n, i) => `<li class="${S.alive[i] ? '' : 'dead'}"><span>${esc(n)}</span><span class="${roleOf(i) === 'wolf' ? 'wolfname' : ''}">${ROLES[roleOf(i)].name}</span></li>`).join('')}</ul>
      <div class="actions center"><button class="btn btn-alt" type="button" data-act="setup">Change setup</button><button class="btn btn-main btn-big" type="button" data-act="again">Play again</button></div>
    </section>`;
  }

  /* ---------- Render and events ---------- */
  const VIEWS = { setup: viewSetup, pass: viewPass, card: viewCard, dealt: viewDealt, night: viewNight, morning: viewMorning, day: viewDay, vote: viewVote, exile: viewExile, end: viewEnd };
  function render() {
    app.innerHTML = (VIEWS[S.screen] || viewSetup)();
    if (S.screen === 'setup') {
      editor = P.playerEditor(document.getElementById('players'), { min: 5, max: 16, onChange: note });
      note();
    }
    if (S.screen === 'card') P.holdToReveal(document.getElementById('card'), () => { S.peeked = true; document.getElementById('seenBtn').disabled = false; });
    const key = S.screen + (S.screen === 'night' ? S.step : '');
    if (key !== shown) window.scrollTo(0, 0);
    shown = key;
  }
  function note() {
    const n = editor ? editor.count() : 0, el = document.getElementById('pnote');
    if (el) el.textContent = 'With ' + n + ' players: ' + P.plural(wolfCount(n), 'werewolf', 'werewolves') + '.';
  }
  function startTalk() {
    if (talk) talk.stop();
    talk = S.settings.talk ? P.countdown(S.settings.talk * 1000, {
      tickLast: 10,
      onTick: ms => { const t = document.getElementById('timer'); if (t) { t.textContent = P.clock(ms); t.classList.toggle('low', ms <= 10000); } },
      onEnd: () => { sfx.buzz(0.8); const b = document.getElementById('pauseBtn'); if (b) b.textContent = 'Time is up'; }
    }) : null;
  }
  function startGame() {
    S.players = editor.get();
    deal();
    S.night = 0;
    S.deal = 0;
    S.peeked = false;
    S.winner = null;
    sfx.unlock();
    if (S.settings.voice) P.speak(' ', {});
    P.stayAwake();
    document.body.classList.remove('day');
    S.screen = 'pass';
    render();
  }
  function quit() {
    S.gen++;
    P.hush();
    if (talk) talk.stop();
    document.body.classList.remove('day');
    S.screen = 'setup';
    render();
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const i = Number(b.getAttribute('data-i'));
    switch (b.getAttribute('data-act')) {
      case 'start': startGame(); break;
      case 'me': S.peeked = false; S.screen = 'card'; render(); break;
      case 'seen':
        S.deal++;
        S.screen = S.deal < S.players.length ? 'pass' : 'dealt';
        render();
        break;
      case 'night': if (talk) talk.stop(); runNight(); break;
      case 'next': act(true); break;
      case 'wolf-pick': S.pending = i; render(); break;
      case 'wolf-back': S.pending = null; render(); break;
      case 'wolf-yes': S.target = S.pending; S.pending = null; act(true); break;
      case 'seer-pick': S.check = i; render(); break;
      case 'seer-done': S.check = null; act(true); break;
      case 'doc-pick': S.save = i; act(true); break;
      case 'talk': startTalk(); S.screen = 'day'; render(); break;
      case 'pause':
        if (!talk) break;
        if (talk.running) talk.stop(); else talk.start();
        b.textContent = talk.running ? 'Pause' : 'Resume';
        break;
      case 'vote': if (talk) talk.stop(); S.screen = 'vote'; render(); break;
      case 'exile':
        S.exiled = i;
        if (i >= 0) S.alive[i] = false;
        S.winner = winnerNow();
        S.screen = 'exile';
        render();
        sfx.tone(110, { to: 55, dur: 0.6, gain: 0.3 });
        if (S.settings.voice && P.canSpeak()) P.speak(i >= 0 ? 'The village has voted out ' + nameOf(i) + '.' : 'The village could not agree.', { rate: 0.92, pitch: 0.9 });
        break;
      case 'end':
        S.screen = 'end';
        render();
        sfx.win();
        P.confetti({ colors: S.winner === 'wolves' ? ['#e85a5a', '#2a1018', '#f0c75e'] : ['#f0c75e', '#f3ecd8', '#5b3fa0', '#a9cce6'] });
        if (S.settings.voice && P.canSpeak()) P.speak(S.winner === 'wolves' ? 'The werewolves win.' : 'The village wins.', { rate: 0.92, pitch: 0.9 });
        break;
      case 'again': startGame(); break;
      case 'setup': quit(); break;
      case 'quit': quit(); break;
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.name === 'wolves' || t.name === 'talk') { S.settings[t.name] = Number(t.value); persist(); note(); }
    else if (['seer', 'doctor', 'reveal', 'voice'].includes(t.id)) { S.settings[t.id] = t.checked; persist(); }
  });

  /* ---------- Online: roles and night moves on everyone's own phone ---------- */
  const DAYTIME = ['morning', 'day', 'vote', 'exile', 'end'];
  function onlineWolves(n, w) {
    const max = Math.max(1, Math.floor((n - 1) / 3));
    if (w > 0) return Math.min(w, max);
    return n <= 6 ? 1 : n <= 10 ? 2 : 3;
  }
  function wwDeal(F) {
    const n = F.players.length, k = onlineWolves(n, F.set.wolves);
    const roles = [];
    for (let i = 0; i < k; i++) roles.push('wolf');
    if (F.set.seer) roles.push('seer');
    if (F.set.doctor) roles.push('doctor');
    while (roles.length < n) roles.push('villager');
    const dealt = P.shuffle(roles.slice(0, n));
    F.roles = {};
    F.alive = {};
    F.players.forEach((p, i) => { F.roles[p.id] = dealt[i]; F.alive[p.id] = true; });
    F.n++;
    F.night = 0;
    F.phase = 'read';
    F.read = [];
    F.acts = {};
    F.checks = {};
    F.votes = {};
    F.died = null;
    F.exiled = null;
    F.winner = null;
    F.ends = 0;
  }
  const wwAlive = F => F.players.filter(p => F.alive[p.id]).map(p => p.id);
  function wwWinner(F) {
    const alive = wwAlive(F), wolves = alive.filter(id => F.roles[id] === 'wolf').length;
    if (wolves === 0) return 'village';
    if (wolves >= alive.length - wolves) return 'wolves';
    return null;
  }
  function wwNight(F) {
    F.n++;
    F.night++;
    F.phase = 'night';
    F.acts = {};
    F.died = null;
    F.exiled = null;
    F.votes = {};
    F.ends = 0;
  }
  const wwWolfIds = F => wwAlive(F).filter(id => F.roles[id] === 'wolf');
  function wwPackAgrees(F) {
    const picks = wwWolfIds(F).map(id => F.acts[id]);
    return picks.length > 0 && picks.every(t => t && t === picks[0]);
  }
  function wwMorning(F) {
    const picks = wwWolfIds(F).map(id => F.acts[id]).filter(Boolean);
    const c = {};
    picks.forEach(t => { c[t] = (c[t] || 0) + 1; });
    const top = Math.max(0, ...Object.values(c));
    const lead = Object.keys(c).filter(t => c[t] === top);
    const target = lead.length ? P.pick(lead) : null;
    const doc = wwAlive(F).find(id => F.roles[id] === 'doctor');
    const save = doc ? F.acts[doc] : null;
    F.died = target && target !== save ? target : null;
    if (F.died) F.alive[F.died] = false;
    F.n++;
    F.winner = wwWinner(F);
    F.phase = 'morning';
  }
  function wwNightDone(F) {
    return wwAlive(F).every(id => F.acts[id]) && wwPackAgrees(F);
  }
  function wwTally(F) {
    const c = {};
    Object.keys(F.votes).forEach(k => { const t = F.votes[k]; c[t] = (c[t] || 0) + 1; });
    const top = Math.max(0, ...Object.values(c));
    const lead = Object.keys(c).filter(id => c[id] === top);
    F.exiled = lead.length === 1 ? lead[0] : 'tie';
    if (F.exiled !== 'tie') F.alive[F.exiled] = false;
    F.n++;
    F.winner = wwWinner(F);
    F.phase = 'exile';
  }
  const ONLINE = {
    game: 'werewolf', title: 'Werewolf', min: 5, max: 16,
    options() {
      const st = S.settings;
      return `<p class="label">Werewolves</p>${P.seg('o-wolves', [[0, 'Auto'], [1, '1'], [2, '2'], [3, '3']], st.wolves)}<p class="hint">Auto picks 1 for up to 6 players, 2 for up to 10, then 3.</p>
        <p class="label" style="margin-top:18px">Special roles</p>
        <label class="check"><input type="checkbox" id="o-seer"${st.seer ? ' checked' : ''}> Seer: checks one player each night</label>
        <label class="check" style="margin-top:10px"><input type="checkbox" id="o-doctor"${st.doctor ? ' checked' : ''}> Doctor: protects one player each night</label>
        <p class="label" style="margin-top:18px">Rules</p>
        <label class="check"><input type="checkbox" id="o-reveal"${st.reveal ? ' checked' : ''}> Show the role of anyone who is out</label>
        <p class="label" style="margin-top:18px">Talk time each day</p>${P.seg('o-talk', [[0, 'No timer'], [120, '2 min'], [180, '3 min'], [300, '5 min']], st.talk)}`;
    },
    readOptions() { const st = S.settings; return { wolves: st.wolves, seer: st.seer, doctor: st.doctor, reveal: st.reveal, talk: st.talk }; },
    start(players, o) {
      const F = { players, set: o, game: 1, n: 0 };
      wwDeal(F);
      return F;
    },
    view(F) {
      const v = { players: F.players, game: F.game, n: F.n, phase: F.phase, night: F.night, alive: F.alive, read: F.read,
        acted: wwAlive(F).filter(id => F.acts[id]).length, voted: Object.keys(F.votes), died: F.died, exiled: F.exiled,
        winner: F.winner, ends: F.ends, set: { reveal: F.set.reveal, talk: F.set.talk, seer: F.set.seer, doctor: F.set.doctor },
        wolves: F.players.filter(p => F.roles[p.id] === 'wolf').length };
      const shown = {};
      if (F.set.reveal) F.players.forEach(p => { if (!F.alive[p.id]) shown[p.id] = F.roles[p.id]; });
      v.outRoles = shown;
      if (F.phase === 'end') v.roles = F.roles;
      return v;
    },
    secrets(F) {
      const out = {}, wolves = F.players.filter(p => F.roles[p.id] === 'wolf').map(p => p.id);
      F.players.forEach(p => {
        const r = F.roles[p.id];
        const s = { n: F.n, role: r, alive: !!F.alive[p.id], pick: F.acts[p.id] || null, vote: F.votes[p.id] || null };
        if (r === 'wolf') {
          s.pack = wolves.filter(id => id !== p.id);
          if (F.phase === 'night') { s.packPicks = {}; wolves.forEach(id => { if (F.alive[id]) s.packPicks[id] = F.acts[id] || null; }); }
        }
        if (r === 'seer') s.checks = F.checks[p.id] || [];
        out[p.id] = s;
      });
      return out;
    },
    act(F, from, a, ctx) {
      if (!F.players.some(p => p.id === from)) return false;
      const host = from === ctx.host;
      if (a.t === 'again') {
        if (F.phase !== 'end' || a.g !== F.game) return false;
        F.game++;
        wwDeal(F);
        return true;
      }
      if (a.n !== F.n) return false;
      const alive = !!F.alive[from], role = F.roles[from];
      switch (a.t) {
        case 'read':
          if (F.phase !== 'read' || F.read.includes(from)) return false;
          F.read.push(from);
          if (F.players.every(p => F.read.includes(p.id))) wwNight(F);
          return true;
        case 'go':
          if (!host || F.phase !== 'read') return false;
          wwNight(F);
          return true;
        case 'night': {
          if (F.phase !== 'night' || !alive || !F.alive[a.id]) return false;
          if (role === 'wolf' && F.roles[a.id] === 'wolf') return false;
          if ((role === 'seer' || role === 'villager') && a.id === from) return false;
          if (role === 'seer') {
            if (F.acts[from]) return false;
            (F.checks[from] = F.checks[from] || []).push([a.id, F.roles[a.id] === 'wolf', F.night]);
          }
          F.acts[from] = a.id;
          if (wwNightDone(F)) wwMorning(F);
          return true;
        }
        case 'dawn':
          if (!host || F.phase !== 'night' || !wwAlive(F).some(id => F.acts[id])) return false;
          wwMorning(F);
          return true;
        case 'talk':
          if (F.phase !== 'morning' || F.winner) return false;
          F.n++;
          F.phase = 'day';
          F.ends = F.set.talk ? Date.now() + F.set.talk * 1000 : 0;
          return true;
        case 'vote':
          if (F.phase === 'day') { F.n++; F.phase = 'vote'; F.ends = 0; F.votes = {}; return true; }
          return false;
        case 'cast':
          if (F.phase !== 'vote' || !alive || a.id === from || !F.alive[a.id]) return false;
          F.votes[from] = a.id;
          if (wwAlive(F).every(id => F.votes[id])) wwTally(F);
          return true;
        case 'count':
          if (!host || F.phase !== 'vote' || !Object.keys(F.votes).length) return false;
          wwTally(F);
          return true;
        case 'nextnight':
          if (F.phase !== 'exile' || F.winner) return false;
          wwNight(F);
          return true;
        case 'end':
          if ((F.phase !== 'morning' && F.phase !== 'exile') || !F.winner) return false;
          F.n++;
          F.phase = 'end';
          return true;
      }
      return false;
    },
    leave(F, ids) {
      const gone = F.players.filter(p => !ids.includes(p.id)).map(p => p.id);
      if (!gone.length) return;
      F.players = F.players.filter(p => ids.includes(p.id));
      if (F.players.length < 3) return 'open';
      gone.forEach(id => { delete F.alive[id]; delete F.acts[id]; delete F.votes[id]; });
      Object.keys(F.votes).forEach(k => { if (gone.includes(F.votes[k])) delete F.votes[k]; });
      if (F.phase === 'end') return;
      F.read = F.read.filter(id => !gone.includes(id));
      if (F.phase === 'read' && F.players.every(p => F.read.includes(p.id))) { wwNight(F); return; }
      const w = wwWinner(F);
      if (w && F.phase !== 'read') { F.winner = w; F.n++; F.phase = 'end'; return; }
      if (F.phase === 'night' && wwNightDone(F)) wwMorning(F);
      if (F.phase === 'vote' && wwAlive(F).every(id => F.votes[id])) wwTally(F);
    },
    render(v) {
      const F = v.pub, me = v.me;
      // The role never changes, so keep showing it while a new save is on its way.
      const m = v.mine || null, fresh = !!(m && m.n === F.n);
      const nm = id => { const p = F.players.find(x => x.id === id); return p ? p.name : 'Someone'; };
      const send = a => Online.sendAttr(Object.assign({ n: F.n }, a));
      const outLine = id => (F.outRoles[id] ? esc(nm(id)) + ' was ' + asRole(F.outRoles[id]) + '.' : esc(nm(id)) + ' is out of the game.');
      const aliveRowO = () => `<div class="alive-row">${F.players.map(p => `<span class="${F.alive[p.id] ? '' : 'dead'}">${esc(p.name)}${p.id === me ? ' (you)' : ''}</span>`).join('')}</div>`;
      const meAlive = !!F.alive[me];
      if (F.phase === 'read') {
        const r = m && m.role, R = r ? ROLES[r] : null;
        const done = F.read.includes(me);
        const waiting = F.players.filter(p => !F.read.includes(p.id)).map(p => p.id);
        const back = R ? `${ART[r]}<p class="role-name">${R.name}</p><p class="role-team">${R.team}</p><p class="role-text">${R.text}</p>
          ${r === 'wolf' ? `<p class="role-team">${m.pack.length ? 'Your pack: ' + esc(P.listNames(m.pack.map(nm))) : 'You hunt alone.'}</p>` : ''}` : '<p class="role-name">Dealing</p>';
        return `<section class="center">
          <p class="eyebrow">For your eyes only</p>
          <div class="reveal" id="ocard" tabindex="0" role="button" aria-label="Press and hold to see your role">
            <div class="reveal-in">
              <div class="reveal-face reveal-front">${MOON.replace('moonbig', 'role-art')}<b>Your role</b><small>Press and hold</small></div>
              <div class="reveal-face reveal-back${r === 'wolf' ? ' wolf' : ''}">${back}</div>
            </div>
          </div>
          ${done ? `<p class="lead">Waiting for ${esc(P.listNames(waiting.map(nm)))} to look.</p>`
            : `<div class="actions center"><button class="btn btn-main btn-big" type="button" data-ui="read" id="oread"${v.local.wwPeek === F.n && R ? '' : ' disabled'}>I've seen my role</button></div>
               <p class="lead">Let go to hide it again. The button unlocks after you look.</p>`}
          ${v.host && waiting.length && waiting.length < F.players.length ? `<div class="actions center"><button class="btn btn-alt" type="button" ${send({ t: 'go' })}>Start the night without them</button></div>` : ''}
        </section>`;
      }
      if (F.phase === 'night') {
        const total = F.players.filter(p => F.alive[p.id]).length;
        const status = `<p class="whisper">${F.acted} of ${total} players have chosen.</p>`;
        const hostEnd = v.host && F.acted ? `<div class="actions center"><button class="textbtn" type="button" ${send({ t: 'dawn' })}>End the night now</button></div>` : '';
        if (!meAlive) return `<section class="center">${MOON}<p class="night-word">Night ${F.night}</p><p class="whisper">You are out of the game. Watch quietly, and do not give anything away.</p>${status}${hostEnd}</section>`;
        const r = m && m.role;
        const alive = F.players.filter(p => F.alive[p.id]);
        const pickBtns = (list, extra) => `<div class="pick">${list.map(p => `<button type="button" ${send({ t: 'night', id: p.id })} aria-pressed="${fresh && m.pick === p.id}"${v.pending ? ' disabled' : ''}>${esc(p.name)}${extra ? extra(p) : ''}</button>`).join('')}</div>`;
        let body;
        if (r === 'wolf') {
          const pack = m.packPicks || {};
          const ids = Object.keys(pack);
          const agree = ids.length && ids.every(id => pack[id] && pack[id] === pack[ids[0]]);
          body = `<p class="eyebrow">Werewolves only</p><h2 class="big">Who do you attack?</h2>
            ${pickBtns(alive.filter(p => p.id !== me && !m.pack.includes(p.id)))}
            ${ids.length > 1 ? `<ul class="pack">${ids.map(id => `<li><span>${id === me ? 'You' : esc(nm(id))}</span><span>${pack[id] ? esc(nm(pack[id])) : 'Not yet'}</span></li>`).join('')}</ul>
              <p class="whisper">${agree ? 'Your pack agrees.' : 'Your pack has to agree on one name.'}</p>` : ''}`;
        } else if (r === 'seer') {
          const checks = m.checks || [];
          const tonight = checks.find(c => c[2] === F.night);
          const past = checks.filter(c => c[2] !== F.night);
          body = tonight
            ? `<p class="eyebrow">Seer only</p><div class="result-card${tonight[1] ? ' bad' : ''}"><p><b>${esc(nm(tonight[0]))}</b> ${tonight[1] ? 'is a werewolf.' : 'is not a werewolf.'}</p></div>`
            : `<p class="eyebrow">Seer only</p><h2 class="big">Who do you check?</h2>${pickBtns(alive.filter(p => p.id !== me))}`;
          if (past.length) body += `<p class="checks">Earlier: ${esc(past.map(c => nm(c[0]) + (c[1] ? ' is a werewolf' : ' is not a werewolf')).join('. '))}.</p>`;
        } else if (r === 'doctor') {
          body = `<p class="eyebrow">Doctor only</p><h2 class="big">Who do you protect?</h2>${pickBtns(alive, p => (p.id === me ? ' (you)' : ''))}`;
        } else {
          body = `<p class="eyebrow">The village sleeps</p><h2 class="big">Who do you suspect?</h2>${pickBtns(alive.filter(p => p.id !== me))}
            <p class="whisper">Everyone taps a name at night, so nobody can tell who has a special role. Your pick here does nothing.</p>`;
        }
        return `<section class="center">${body}${fresh && m.pick ? '<p class="whisper">Done. Wait for the night to end.</p>' : ''}${status}${hostEnd}</section>`;
      }
      if (F.phase === 'morning') {
        const d = F.died;
        const body = d == null ? '<h2 class="big">Nobody was hurt</h2><p class="lead">The werewolves struck, but someone was protected. Or they missed.</p>'
          : `<h2 class="big">${d === me ? 'You were' : esc(nm(d)) + ' was'} attacked</h2><p class="lead">${outLine(d)} ${d === me ? 'You can watch, but stay quiet.' : esc(nm(d)) + ' can watch but must stay quiet.'}</p>`;
        return `<section class="center"><p class="eyebrow">Morning ${F.night}</p>${body}${aliveRowO()}
          <div class="actions center"><button class="btn btn-main btn-big" type="button" ${send({ t: F.winner ? 'end' : 'talk' })}>${F.winner ? 'See who won' : 'Start talking'}</button></div></section>`;
      }
      if (F.phase === 'day') {
        return `<section class="center"><p class="eyebrow">Day ${F.night}</p><h2 class="big">Who is a werewolf?</h2>
          <p class="lead">Share what you know, accuse, defend yourself. Then vote someone out.</p>
          ${F.ends ? '<div class="timer" id="otimer" role="timer"></div>' : ''}
          ${aliveRowO()}
          <div class="actions center"><button class="btn btn-main btn-big" type="button" ${send({ t: 'vote' })}>Time to vote</button></div></section>`;
      }
      if (F.phase === 'vote') {
        const waiting = F.players.filter(p => F.alive[p.id] && !F.voted.includes(p.id)).map(p => p.id);
        const mineVote = fresh && m.vote;
        return `<section class="center"><p class="eyebrow">The vote</p><h2 class="big">Who goes?</h2>
          ${meAlive ? `<div class="pick">${F.players.filter(p => F.alive[p.id] && p.id !== me).map(p => `<button type="button" ${send({ t: 'cast', id: p.id })} aria-pressed="${mineVote === p.id}">${esc(p.name)}</button>`).join('')}</div>
            <p class="lead">${mineVote ? 'Vote saved. You can change it until everyone has voted.' : 'Tap who you want to vote out.'}</p>` : '<p class="lead">You are out, so you do not vote.</p>'}
          <p class="whisper">${waiting.length ? 'Still voting: ' + esc(P.listNames(waiting.map(nm))) + '.' : 'Counting the votes.'}</p>
          ${v.host && F.voted.length && waiting.length ? `<div class="actions center"><button class="btn btn-alt" type="button" ${send({ t: 'count' })}>Count the votes now</button></div>` : ''}</section>`;
      }
      if (F.phase === 'exile') {
        const e = F.exiled;
        const body = e === 'tie' ? '<h2 class="big">Nobody was voted out</h2><p class="lead">The village could not agree.</p>'
          : `<h2 class="big">${e === me ? 'You are' : esc(nm(e)) + ' is'} out</h2><p class="lead">${F.set.reveal ? outLine(e) : 'Their role stays secret until the end.'}</p>`;
        return `<section class="center"><p class="eyebrow">The village has spoken</p>${body}${aliveRowO()}
          <div class="actions center"><button class="btn btn-main btn-big" type="button" ${send({ t: F.winner ? 'end' : 'nextnight' })}>${F.winner ? 'See who won' : 'Night falls'}</button></div></section>`;
      }
      const wolvesWin = F.winner === 'wolves';
      return `<section class="center"><p class="eyebrow">Game over</p>
        <h2 class="big">${wolvesWin ? 'The werewolves win' : 'The village wins'}</h2>
        <p class="lead">${wolvesWin ? 'The werewolves now match the village. Nobody is safe.' : 'Every werewolf has been found. The village sleeps soundly.'}</p>
        <ul class="cast">${F.players.map(p => `<li class="${F.alive[p.id] ? '' : 'dead'}"><span>${esc(p.name)}${p.id === me ? ' (you)' : ''}</span><span class="${F.roles[p.id] === 'wolf' ? 'wolfname' : ''}">${ROLES[F.roles[p.id]].name}</span></li>`).join('')}</ul>
        <div class="actions center"><button class="btn btn-main btn-big" type="button" ${Online.sendAttr({ t: 'again', g: F.game })}>Play again</button></div></section>`;
    },
    bind(v) {
      const F = v.pub;
      document.body.classList.toggle('day', DAYTIME.includes(F.phase));
      const c = document.getElementById('ocard');
      if (c) {
        P.holdToReveal(c, () => {
          if (v.local.wwPeek === F.n) return;
          v.local.wwPeek = F.n;
          const b = document.getElementById('oread');
          if (b && v.mine && v.mine.role) b.disabled = false;
        });
      }
      if (F.phase === 'day' && F.ends) Online.ticker(v.local, 'otimer', F.ends, { tick: true, onEnd: () => sfx.buzz(0.8) });
    },
    unbind() { document.body.classList.remove('day'); },
    click(name, el, v) {
      if (name === 'read') { el.disabled = true; v.send({ t: 'read', n: v.pub.n }); sfx.pop(); }
    },
    fx(v, prev) {
      const F = v.pub, B = prev && prev.pub;
      if (!B || B.game !== F.game || B.phase === F.phase) return;
      if (F.phase === 'night') chime();
      if (F.phase === 'morning') sfx.win();
      if (F.phase === 'exile') sfx.tone(110, { to: 55, dur: 0.6, gain: 0.3 });
      if (F.phase === 'end') {
        sfx.win();
        P.confetti({ colors: F.winner === 'wolves' ? ['#e85a5a', '#2a1018', '#f0c75e'] : ['#f0c75e', '#f3ecd8', '#5b3fa0', '#a9cce6'] });
      }
    }
  };
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.name === 'o-wolves' || t.name === 'o-talk') { S.settings[t.name.slice(2)] = Number(t.value); persist(); }
    else if (['o-seer', 'o-doctor', 'o-reveal'].includes(t.id)) { S.settings[t.id.slice(2)] = t.checked; persist(); }
  });

  if (window.Online && Online.wanted()) Online.room(ONLINE);
  else render();
})();
</script>
</body>
</html>
