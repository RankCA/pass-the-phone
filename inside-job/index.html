<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inside Job | Pass the Phone</title>
<meta name="description" content="Find the secret word with yes or no questions before the clock runs out. Then work out who knew it all along.">
<meta name="theme-color" content="#22252b">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../shared/base.css?v=21cb0b0f">
<style>
/* Layout: an interrogation room. Concrete walls, one warm lamp, amber for anything that matters. */
:root{
  color-scheme:dark;
  --bg:#22252b;
  --fg:#f2efe8;
  --muted:#c4c0b6;
  --panel:rgba(242,239,232,.07);
  --line:rgba(242,239,232,.28);
  --field:#f2efe8;
  --field-ink:#22252b;
  --accent:#f5b301;
  --accent-ink:#1d1a12;
  --accent-shadow:#8f6a05;
  --focus:#f5b301;
  --f-display:"Bebas Neue","Arial Narrow",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,sans-serif;
}
body{background:radial-gradient(ellipse 70% 45% at 50% -5%,rgba(255,214,120,.16),transparent 70%),linear-gradient(180deg,#272b32,#1b1d22)}
.title{font-size:clamp(64px,19vw,140px);letter-spacing:.02em;line-height:.9}
.big{font-size:clamp(44px,12vw,76px);letter-spacing:.01em;line-height:.95}
.btn{font-family:var(--f-body);font-weight:800;font-size:19px}
.btn-big{font-size:21px}
.label,.howto summary{font-family:var(--f-body);font-weight:800;font-size:18px}
.hero{display:block;width:min(56vw,210px);height:auto;margin-top:6px}
.rolecard .reveal-front{background:repeating-linear-gradient(0deg,#2c3038 0 2px,#262a31 2px 6px);box-shadow:inset 0 0 0 2px var(--line);color:var(--fg)}
.rolecard .reveal-front b{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,10vw,46px);letter-spacing:.02em}
.rolecard .reveal-front small{font-size:16px;color:var(--muted)}
.rolecard .reveal-back{background:#f2efe8;color:#1d1a12}
.rolecard .reveal-back small{font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#5a4a1a}
.rolecard .reveal-back b{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,12vw,58px);line-height:1}
.rolecard .reveal-back p{margin:0;max-width:22em;font-size:16px;line-height:1.35}
.rolecard .reveal-back .word{display:inline-block;margin-top:4px;padding:4px 14px;border-radius:10px;background:#1d1a12;color:#f5b301;font-family:var(--f-display);font-size:clamp(30px,9vw,42px);letter-spacing:.03em}
.clock{display:inline-block;margin-top:14px;padding:6px 26px;border-radius:16px;background:var(--panel);font-family:var(--f-display);font-size:clamp(70px,22vw,120px);line-height:1;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.clock.low{background:#fff;color:#b3261e}
.host{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:6px 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px}
.verdict{margin:6px 0 0;font-family:var(--f-display);font-size:clamp(40px,11vw,64px);line-height:1;letter-spacing:.01em}
.tally{list-style:none;margin:16px auto 0;padding:0;display:grid;gap:6px;max-width:440px;text-align:left}
.tally li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--panel);font-weight:700}
.tally li.top{box-shadow:inset 0 0 0 2px var(--accent)}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.note{margin:14px auto 0;max-width:30em;font-size:16px;color:var(--muted)}
.tally li span{flex:1;min-width:0;overflow-wrap:anywhere}
.tally li b{font-family:var(--f-display);font-size:26px;font-weight:400}
.tally small{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../shared/party.js?v=ab12cd68"></script>
<script src="../shared/online.js?v=f82a3556"></script>
<script src="words.js?v=2f1a8bd5"></script>
<script>
(function () {
  'use strict';
  const P = window.Party, sfx = P.sfx, esc = P.esc;
  const KEY = 'ptp.inside';
  const app = document.getElementById('app');
  const deck = P.deck('inside', window.INSIDE_WORDS || ['Penguin']);

  const saved = P.store.get(KEY, {}) || {};
  const S = {
    settings: Object.assign({ time: 240, talk: 90 }, saved.settings || {}),
    screen: 'setup', players: [], hostAt: 0, insider: '', word: '', order: [], at: 0, peeked: false,
    clock: null, finder: '', accused: '', outcome: '', scores: {}, round: 0, gains: {}
  };
  let editor = null, shown = null;
  function persist() { P.store.set(KEY, { settings: S.settings }); }
  const host = () => S.players[S.hostAt % S.players.length];
  const others = () => S.players.filter(n => n !== host());

  /* ---------- Rounds ---------- */
  function newRound() {
    S.round++;
    S.word = deck.one([S.word]);
    S.insider = P.pick(others());
    S.order = [host()].concat(others());
    S.at = 0;
    S.finder = '';
    S.accused = '';
    S.gains = {};
    if (S.clock) S.clock.stop();
    S.clock = null;
    S.screen = 'pass';
    render();
  }
  function startClock(ms, onEnd) {
    if (S.clock) S.clock.stop();
    S.clock = P.countdown(ms, {
      tickLast: 10,
      onTick(left) {
        const el = document.getElementById('clock');
        if (el) { el.textContent = P.clock(left); el.classList.toggle('low', left <= 10000); }
      },
      onEnd
    });
  }
  function settle(caught) {
    S.gains = {};
    if (S.outcome === 'timeout') { /* nobody scores */ }
    else if (caught) { [host()].concat(others().filter(n => n !== S.insider)).forEach(n => { S.gains[n] = 1; }); }
    else S.gains[S.insider] = 2;
    Object.entries(S.gains).forEach(([n, g]) => { S.scores[n] = (S.scores[n] || 0) + g; });
  }

  /* ---------- Views ---------- */
  function tallyHTML() {
    const rows = S.players.map(n => [n, S.scores[n] || 0]).sort((a, b) => b[1] - a[1]);
    const top = rows[0] ? rows[0][1] : 0;
    return '<ol class="tally">' + rows.map(r => `<li class="${top > 0 && r[1] === top ? 'top' : ''}"><span>${esc(r[0])}</span>${S.gains[r[0]] ? `<small>+${S.gains[r[0]]}</small>` : ''}<b>${r[1]}</b></li>`).join('') + '</ol>';
  }
  function viewSetup() {
    return P.header() + `
    <h1 class="title">Inside Job</h1>
    <svg class="hero" viewBox="0 0 210 110" aria-hidden="true"><path d="M105 6 60 66h90z" fill="rgba(255,214,120,.35)"/><path d="M90 6h30l-4 10h-22z" fill="#f5b301" stroke="#111" stroke-width="3"/><circle cx="60" cy="86" r="16" fill="#3a3f48" stroke="#111" stroke-width="4"/><path d="M38 108c2-14 10-20 22-20s20 6 22 20" fill="#3a3f48" stroke="#111" stroke-width="4"/><circle cx="150" cy="86" r="16" fill="#3a3f48" stroke="#111" stroke-width="4"/><path d="M128 108c2-14 10-20 22-20s20 6 22 20" fill="#3a3f48" stroke="#111" stroke-width="4"/><circle cx="105" cy="80" r="17" fill="#f5b301" stroke="#111" stroke-width="4"/><path d="M82 108c2-15 11-21 23-21s21 6 23 21" fill="#f5b301" stroke="#111" stroke-width="4"/><path d="M98 78h4M108 78h4" stroke="#111" stroke-width="3" stroke-linecap="round"/></svg>
    <p class="tagline">Find the secret word with yes or no questions before the clock runs out. Then work out who knew it all along.</p>
    <div class="panel">
      <div class="sec"><span class="label">Players</span><div id="players"></div></div>
      <div class="sec"><span class="label">Time to find the word</span>${P.seg('time', [[180, '3 min'], [240, '4 min'], [300, '5 min']], S.settings.time)}</div>
      <div class="sec"><span class="label">Time to find the insider</span>${P.seg('talk', [[60, '1 min'], [90, '90 sec'], [120, '2 min']], S.settings.talk)}</div>
      <div class="actions"><button class="btn btn-main btn-big" type="button" data-act="start">Deal the roles</button></div>
    </div>
    <div class="panel">
      <span class="label">Play online</span>
      <p class="hint">Everyone reads their card and votes on their own phone. Ask your questions out loud or on a call. Make a game, then send the code.</p>
      <div class="actions"><a class="btn btn-alt" href="?lobby=new">Make an online game</a><a class="btn btn-alt" href="../online/">Join with a code</a></div>
    </div>
    <details class="howto">
      <summary>How to play</summary>
      <ol>
        <li>One player is the host each round, and everyone knows who. The host sees the secret word and can only answer yes, no or not sure.</li>
        <li>One other player is the insider. They know the word too, and secretly steer the questions towards it.</li>
        <li>Everyone asks the host yes or no questions. Find the word before the clock runs out, or nobody wins.</li>
        <li>Once the word is found, talk it over and point at who you think the insider is.</li>
        <li>Catch the insider and the host and everyone else score a point. If the insider gets away, they score 2.</li>
      </ol>
    </details>`;
  }
  function viewPass() {
    const n = S.order[S.at];
    return P.header() + P.passScreen({ eyebrow: 'Round ' + S.round + '. Card ' + (S.at + 1) + ' of ' + S.order.length, name: n, lead: n === host() ? esc(n) + ' is the host this round.' : 'Only ' + esc(n) + ' looks.', act: 'me' });
  }
  function viewCard() {
    const n = S.order[S.at], role = n === host() ? 'host' : n === S.insider ? 'insider' : 'guesser';
    const back = role === 'host'
      ? `<small>You are the host</small><span class="word">${esc(S.word)}</span><p>Answer questions with yes, no or not sure. Nothing else.</p>`
      : role === 'insider'
        ? `<small>You are the insider</small><span class="word">${esc(S.word)}</span><p>Steer the questions towards it without getting caught.</p>`
        : `<small>You are a guesser</small><b>Find the word</b><p>Ask the host yes or no questions. Then catch the insider.</p>`;
    return P.header() + `
    <section class="center">
      <p class="eyebrow">${esc(n)}, this is your card</p>
      <div class="reveal rolecard" id="card" tabindex="0" role="button" aria-label="Press and hold to see your card">
        <div class="reveal-in">
          <div class="reveal-face reveal-front"><b>Hold to read</b><small>Keep it to yourself.</small></div>
          <div class="reveal-face reveal-back">${back}</div>
        </div>
      </div>
      <div class="actions center"><button class="btn btn-main btn-big" type="button" data-act="seen" id="doneBtn"${S.peeked ? '' : ' disabled'}>${S.at < S.order.length - 1 ? 'Done. Pass it on' : 'Done'}</button></div>
    </section>`;
  }
  function viewAsk() {
    const running = S.clock && S.clock.running;
    return P.header() + `
    <section class="center">
      <p class="eyebrow">Round ${S.round}. Find the word</p>
      <span class="host">Host: ${esc(host())}</span>
      <div><span class="clock" id="clock">${P.clock(S.clock ? S.clock.left : S.settings.time * 1000)}</span></div>
      <p class="lead">Ask ${esc(host())} yes or no questions. Shout it out when you think you know the word.</p>
      <div class="actions center">
        ${S.clock ? `<button class="btn btn-alt" type="button" data-act="pause">${running ? 'Pause' : 'Carry on'}</button>` : '<button class="btn btn-alt btn-big" type="button" data-act="go">Start the clock</button>'}
        <button class="btn btn-main btn-big" type="button" data-act="found">Someone said it</button>
      </div>
    </section>`;
  }
  function viewFound() {
    return P.header() + `
    <section class="center">
      <p class="eyebrow">The word was ${esc(S.word)}</p>
      <h2 class="big">Who said it?</h2>
      <div class="pick">${others().map(n => `<button type="button" data-act="finder" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>
      <div class="actions center"><button class="btn btn-alt" type="button" data-act="ask">Back to the questions</button></div>
    </section>`;
  }
  function viewTalk() {
    const running = S.clock && S.clock.running;
    return P.header() + `
    <section class="center">
      <p class="eyebrow">${esc(S.finder)} found ${esc(S.word)}</p>
      <h2 class="big">Find the insider</h2>
      <div><span class="clock" id="clock">${P.clock(S.clock ? S.clock.left : S.settings.talk * 1000)}</span></div>
      <p class="lead">Who knew too much? Was it ${esc(S.finder)}, or someone who kept nudging the questions?</p>
      <div class="actions center"><button class="btn btn-alt" type="button" data-act="pause">${running ? 'Pause' : 'Carry on'}</button><button class="btn btn-main btn-big" type="button" data-act="vote">Vote now</button></div>
    </section>`;
  }
  function viewVote() {
    return P.header() + `
    <section class="center">
      <p class="eyebrow">The vote</p>
      <h2 class="big">Point on three</h2>
      <p class="lead">Count down out loud and point at the insider. ${esc(host())} taps whoever got the most fingers.</p>
      <div class="pick">${others().map(n => `<button type="button" data-act="accuse" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>
      <div class="actions center"><button class="btn btn-alt" type="button" data-act="accuse" data-n="">It was a tie</button></div>
    </section>`;
  }
  function viewResult() {
    const caught = S.outcome === 'caught';
    const head = S.outcome === 'timeout' ? 'Out of time' : caught ? 'Insider caught' : 'Insider got away';
    const line = S.outcome === 'timeout'
      ? 'Nobody found ' + S.word + ', so nobody wins this round.'
      : caught ? 'Everyone pointed at ' + S.insider + ', and they were the insider.'
        : (S.accused ? 'Everyone pointed at ' + S.accused + ', but the insider was ' + S.insider + '.' : 'The vote was tied, so ' + S.insider + ' slips away.');
    return P.header() + `
    <section class="center">
      <p class="eyebrow">The insider was ${esc(S.insider)}</p>
      <h2 class="verdict">${head}</h2>
      <p class="lead">${esc(line)}</p>
      ${tallyHTML()}
      <div class="actions center"><button class="btn btn-alt" type="button" data-act="setup">Change setup</button><button class="btn btn-main btn-big" type="button" data-act="next">Next round</button></div>
      <p class="hint">${esc(S.players[(S.hostAt + 1) % S.players.length])} hosts next.</p>
    </section>`;
  }

  const VIEWS = { setup: viewSetup, pass: viewPass, card: viewCard, ask: viewAsk, found: viewFound, talk: viewTalk, vote: viewVote, result: viewResult };
  function render() {
    app.innerHTML = (VIEWS[S.screen] || viewSetup)();
    if (S.screen === 'setup') editor = P.playerEditor(document.getElementById('players'), { min: 4, max: 12 });
    const card = document.getElementById('card');
    if (card) P.holdToReveal(card, () => { if (!S.peeked) { S.peeked = true; const d = document.getElementById('doneBtn'); if (d) d.disabled = false; } });
    if (S.screen !== shown) window.scrollTo(0, 0);
    shown = S.screen;
  }
  function timeUp() {
    S.outcome = 'timeout';
    settle(false);
    S.screen = 'result';
    render();
    sfx.buzz(0.8);
    P.vibrate([200, 80, 200]);
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    switch (b.getAttribute('data-act')) {
      case 'start':
        S.players = editor.get();
        S.scores = {};
        S.round = 0;
        S.hostAt = Math.floor(Math.random() * S.players.length);
        sfx.unlock();
        P.stayAwake();
        newRound();
        break;
      case 'me': S.peeked = false; S.screen = 'card'; render(); break;
      case 'seen':
        S.at++;
        if (S.at >= S.order.length) { S.screen = 'ask'; S.clock = null; }
        else S.screen = 'pass';
        render();
        break;
      case 'go': startClock(S.settings.time * 1000, timeUp); S.clock.start(); sfx.beep(true); render(); break;
      case 'pause':
        if (!S.clock) break;
        if (S.clock.running) S.clock.stop(); else S.clock.start();
        render();
        break;
      case 'found': if (S.clock) S.clock.stop(); S.screen = 'found'; render(); break;
      case 'ask': if (S.clock && S.clock.left > 0) S.clock.start(); S.screen = 'ask'; render(); break;
      case 'finder':
        S.finder = b.getAttribute('data-n');
        sfx.ding();
        startClock(S.settings.talk * 1000, () => { S.screen = 'vote'; render(); sfx.beep(true); });
        S.clock.start();
        S.screen = 'talk';
        render();
        break;
      case 'vote': if (S.clock) S.clock.stop(); S.screen = 'vote'; render(); break;
      case 'accuse':
        S.accused = b.getAttribute('data-n');
        S.outcome = S.accused && S.accused === S.insider ? 'caught' : 'escaped';
        settle(S.outcome === 'caught');
        S.screen = 'result';
        render();
        if (S.outcome === 'caught') { sfx.win(); P.confetti({ colors: ['#f5b301', '#f2efe8', '#c4c0b6'] }); } else sfx.lose();
        break;
      case 'next': S.hostAt++; newRound(); break;
      case 'setup': if (S.clock) S.clock.stop(); S.screen = 'setup'; render(); break;
    }
  });
  document.addEventListener('change', e => {
    if (e.target.name === 'time' || e.target.name === 'talk') { S.settings[e.target.name] = Number(e.target.value); persist(); }
  });

  /* ---------- Online: cards and votes on everyone's own phone ---------- */
  const ijMaster = F => F.players[F.masterAt % F.players.length].id;
  function ijDeal(F) {
    F.n++;
    F.round++;
    F.word = deck.one([F.word]);
    const master = ijMaster(F);
    F.insider = P.pick(F.players.filter(p => p.id !== master)).id;
    F.phase = 'read';
    F.read = [];
    F.ends = 0;
    F.left = F.time * 1000;
    F.finder = null;
    F.votes = {};
    F.accused = null;
    F.outcome = null;
    F.gains = {};
  }
  function ijSettle(F) {
    F.gains = {};
    const master = ijMaster(F);
    if (F.outcome === 'caught') F.players.forEach(p => { if (p.id !== F.insider) F.gains[p.id] = 1; });
    else if (F.outcome === 'escaped') F.gains[F.insider] = 2;
    Object.keys(F.gains).forEach(id => { F.scores[id] = (F.scores[id] || 0) + F.gains[id]; });
    F.ends = 0;
    F.n++;
    F.phase = 'result';
    return master;
  }
  function ijTally(F) {
    const c = {};
    Object.keys(F.votes).forEach(k => { const t = F.votes[k]; c[t] = (c[t] || 0) + 1; });
    const top = Math.max(0, ...Object.values(c));
    const lead = Object.keys(c).filter(id => c[id] === top);
    F.accused = lead.length === 1 ? lead[0] : 'tie';
    F.outcome = F.accused === F.insider ? 'caught' : 'escaped';
    ijSettle(F);
  }
  const ijVoters = F => F.players.filter(p => p.id !== ijMaster(F)).map(p => p.id);
  const ONLINE = {
    game: 'inside-job', title: 'Inside Job', min: 4, max: 12,
    options() {
      return `<p class="label">Time to find the word</p>${P.seg('o-time', [[180, '3 min'], [240, '4 min'], [300, '5 min']], S.settings.time)}
        <p class="label" style="margin-top:18px">Time to find the insider</p>${P.seg('o-talk', [[60, '1 min'], [90, '90 sec'], [120, '2 min']], S.settings.talk)}`;
    },
    readOptions() { return { time: S.settings.time, talk: S.settings.talk }; },
    start(players, o) {
      const F = { players, scores: {}, game: 1, n: 0, round: 0, masterAt: Math.floor(Math.random() * players.length), time: o.time, talk: o.talk, word: '' };
      ijDeal(F);
      return F;
    },
    view(F) {
      const v = { players: F.players, scores: F.scores, game: F.game, n: F.n, round: F.round, master: ijMaster(F), phase: F.phase, read: F.read,
        ends: F.ends, left: F.left, finder: F.finder, voted: Object.keys(F.votes), accused: F.accused, outcome: F.outcome, gains: F.gains };
      if (F.phase !== 'read' && F.phase !== 'ask') v.word = F.word;
      if (F.phase === 'result') v.insider = F.insider;
      return v;
    },
    secrets(F) {
      const out = {}, master = ijMaster(F);
      F.players.forEach(p => {
        const role = p.id === master ? 'master' : p.id === F.insider ? 'insider' : 'guesser';
        out[p.id] = { n: F.n, role, word: role === 'guesser' ? null : F.word, vote: F.votes[p.id] || null };
      });
      return out;
    },
    act(F, from, a, ctx) {
      if (!F.players.some(p => p.id === from) || a.n !== F.n) return false;
      const host = from === ctx.host, master = ijMaster(F), runs = from === master || host;
      switch (a.t) {
        case 'read':
          if (F.phase !== 'read' || F.read.includes(from)) return false;
          F.read.push(from);
          if (F.players.every(p => F.read.includes(p.id))) { F.phase = 'ask'; F.ends = Date.now() + F.left; }
          return true;
        case 'go':
          if (!host || F.phase !== 'read') return false;
          F.phase = 'ask';
          F.ends = Date.now() + F.left;
          return true;
        case 'pause':
          if (!runs || (F.phase !== 'ask' && F.phase !== 'talk') || !F.ends) return false;
          F.left = Math.max(0, F.ends - Date.now());
          F.ends = 0;
          return true;
        case 'resume':
          if (!runs || (F.phase !== 'ask' && F.phase !== 'talk') || F.ends || !F.left) return false;
          F.ends = Date.now() + F.left;
          return true;
        case 'found':
          if (from !== master || F.phase !== 'ask' || a.id === master || !F.players.some(p => p.id === a.id)) return false;
          F.finder = a.id;
          F.n++;
          F.phase = 'talk';
          F.left = F.talk * 1000;
          F.ends = Date.now() + F.left;
          return true;
        case 'votenow':
          if (F.phase !== 'talk') return false;
          F.n++;
          F.phase = 'vote';
          F.ends = 0;
          return true;
        case 'vote':
          if (F.phase !== 'vote' || from === master || a.id === from || a.id === master || !F.players.some(p => p.id === a.id)) return false;
          F.votes[from] = a.id;
          if (ijVoters(F).every(id => F.votes[id])) ijTally(F);
          return true;
        case 'count':
          if (!host || F.phase !== 'vote' || !Object.keys(F.votes).length) return false;
          ijTally(F);
          return true;
        case 'next':
          if (F.phase !== 'result') return false;
          F.masterAt++;
          ijDeal(F);
          return true;
      }
      return false;
    },
    tick(F, now) {
      if (!F.ends || now < F.ends) return false;
      if (F.phase === 'ask') { F.outcome = 'timeout'; ijSettle(F); return true; }
      if (F.phase === 'talk') { F.n++; F.ends = 0; F.phase = 'vote'; return true; }
      return false;
    },
    leave(F, ids) {
      const gone = F.players.filter(p => !ids.includes(p.id)).map(p => p.id);
      if (!gone.length) return;
      const master = ijMaster(F);
      F.players = F.players.filter(p => ids.includes(p.id));
      gone.forEach(id => { delete F.scores[id]; });
      if (F.players.length < 4) return 'open';
      if (F.phase === 'result') return;
      // The quizmaster or the insider walked out, so deal a fresh round.
      if (gone.includes(master) || gone.includes(F.insider)) { F.masterAt = F.masterAt % F.players.length; ijDeal(F); return; }
      F.masterAt = F.players.findIndex(p => p.id === master);
      F.read = F.read.filter(id => !gone.includes(id));
      Object.keys(F.votes).forEach(k => { if (gone.includes(k) || gone.includes(F.votes[k])) delete F.votes[k]; });
      if (F.phase === 'read' && F.players.every(p => F.read.includes(p.id))) { F.phase = 'ask'; F.ends = Date.now() + F.left; }
      if (F.phase === 'vote' && ijVoters(F).every(id => F.votes[id])) ijTally(F);
    },
    render(v) {
      const F = v.pub, me = v.me, m = v.mine || null, fresh = !!(m && m.n === F.n);
      const nm = id => { const p = F.players.find(x => x.id === id); return p ? p.name : 'Someone'; };
      const send = a => Online.sendAttr(Object.assign({ n: F.n }, a));
      const masterName = F.master === me ? 'you' : esc(nm(F.master));
      const clock = `<div><span class="clock" id="otimer">${F.ends ? '' : P.clock(F.left)}</span></div>`;
      const runs = F.master === me || v.host;
      const pauseBtn = runs ? `<button class="btn btn-alt" type="button" ${send({ t: F.ends ? 'pause' : 'resume' })}>${F.ends ? 'Pause' : 'Carry on'}</button>` : '';
      const role = m && m.role;
      const back = !role ? '<small>Your card</small><b>Dealing</b>'
        : role === 'master' ? `<small>You are the host</small><span class="word">${esc(m.word)}</span><p>Answer questions with yes, no or not sure. Nothing else.</p>`
          : role === 'insider' ? `<small>You are the insider</small><span class="word">${esc(m.word)}</span><p>Steer the questions towards it without getting caught.</p>`
            : '<small>You are a guesser</small><b>Find the word</b><p>Ask the host yes or no questions. Then catch the insider.</p>';
      const card = hint => `<div class="reveal rolecard" id="ocard" tabindex="0" role="button" aria-label="Press and hold to see your card">
          <div class="reveal-in">
            <div class="reveal-face reveal-front"><b>${hint}</b><small>Keep it to yourself.</small></div>
            <div class="reveal-face reveal-back">${back}</div>
          </div>
        </div>`;
      if (F.phase === 'read') {
        const done = F.read.includes(me);
        const waiting = F.players.filter(p => !F.read.includes(p.id)).map(p => p.id);
        return `<section class="center">
          <p class="eyebrow">Round ${F.round}. This is your card</p>
          <span class="host">Host this round: ${masterName}</span>
          ${card('Hold to read')}
          ${done ? `<p class="lead">Waiting for ${esc(P.listNames(waiting.map(nm)))}.</p>`
            : `<div class="actions center"><button class="btn btn-main btn-big" type="button" data-ui="read" id="oread"${v.local.ijPeek === F.n && role ? '' : ' disabled'}>I've read it</button></div>`}
          ${v.host && waiting.length && waiting.length < F.players.length ? `<div class="actions center"><button class="btn btn-alt" type="button" ${send({ t: 'go' })}>Start without them</button></div>` : ''}
        </section>`;
      }
      if (F.phase === 'ask') {
        if (F.master === me) {
          const choosing = v.local.ijFound === F.n;
          return `<section class="center">
            <p class="eyebrow">Round ${F.round}. You are the host</p>
            <p class="lead">The secret word is <b>${esc(m && m.word)}</b>. Answer only yes, no or not sure.</p>
            ${clock}
            ${choosing ? `<h2 class="big">Who said it?</h2><div class="pick">${F.players.filter(p => p.id !== me).map(p => `<button type="button" ${send({ t: 'found', id: p.id })}>${esc(p.name)}</button>`).join('')}</div>
              <div class="actions center"><button class="btn btn-alt" type="button" data-ui="unfound">Back to the questions</button></div>`
              : `<div class="actions center">${pauseBtn}<button class="btn btn-main btn-big" type="button" data-ui="found">Someone said it</button></div>`}
          </section>`;
        }
        return `<section class="center">
          <p class="eyebrow">Round ${F.round}. Find the word</p>
          <span class="host">Host: ${masterName}</span>
          ${clock}
          <p class="lead">Ask ${masterName} yes or no questions. Shout it out when you think you know the word.</p>
          ${v.host ? `<div class="actions center">${pauseBtn}</div>` : ''}
          ${card('Hold to check your card')}
        </section>`;
      }
      if (F.phase === 'talk') {
        return `<section class="center">
          <p class="eyebrow">${F.finder === me ? 'You' : esc(nm(F.finder))} found ${esc(F.word)}</p>
          <h2 class="big">Find the insider</h2>
          ${clock}
          <p class="lead">Who knew too much? Was it ${F.finder === me ? 'you' : esc(nm(F.finder))}, or someone who kept nudging the questions?</p>
          <div class="actions center">${pauseBtn}<button class="btn btn-main btn-big" type="button" ${send({ t: 'votenow' })}>Vote now</button></div>
        </section>`;
      }
      if (F.phase === 'vote') {
        const waiting = F.players.filter(p => p.id !== F.master && !F.voted.includes(p.id)).map(p => p.id);
        const mineVote = fresh && m.vote;
        const body = F.master === me ? '<p class="lead">You are the host this round, so you do not vote.</p>'
          : `<div class="pick">${F.players.filter(p => p.id !== me && p.id !== F.master).map(p => `<button type="button" ${send({ t: 'vote', id: p.id })} aria-pressed="${mineVote === p.id}">${esc(p.name)}</button>`).join('')}</div>
            <p class="note">${mineVote ? 'Vote saved. You can change it until everyone has voted.' : 'Tap who you think the insider is.'}</p>`;
        return `<section class="center">
          <p class="eyebrow">The vote</p>
          <h2 class="big">Who is the insider?</h2>
          ${body}
          <p class="note">${waiting.length ? 'Still voting: ' + esc(P.listNames(waiting.map(nm))) + '.' : 'Counting the votes.'}</p>
          ${v.host && F.voted.length && waiting.length ? `<div class="actions center"><button class="btn btn-alt" type="button" ${send({ t: 'count' })}>Count the votes now</button></div>` : ''}
        </section>`;
      }
      const caught = F.outcome === 'caught';
      const head = F.outcome === 'timeout' ? 'Out of time' : caught ? 'Insider caught' : 'Insider got away';
      const ins = F.insider === me ? 'you' : nm(F.insider);
      const line = F.outcome === 'timeout' ? 'Nobody found ' + F.word + ', so nobody wins this round.'
        : caught ? 'Most of you pointed at ' + ins + ', and they were the insider.'
          : (F.accused && F.accused !== 'tie' ? 'Most of you pointed at ' + nm(F.accused) + ', but the insider was ' + ins + '.' : 'The vote was tied, so ' + ins + ' slipped away.');
      const rows = F.players.map(p => [p, F.scores[p.id] || 0]).sort((a, b) => b[1] - a[1]);
      const top = rows[0] ? rows[0][1] : 0;
      const next = F.players[(F.players.findIndex(p => p.id === F.master) + 1) % F.players.length];
      return `<section class="center">
        <p class="eyebrow">The insider was ${esc(ins)}</p>
        <h2 class="verdict">${head}</h2>
        <p class="lead">${esc(line)}</p>
        <ol class="tally">${rows.map(([p, n]) => `<li class="${top > 0 && n === top ? 'top' : ''}"><span>${esc(p.name)}${p.id === me ? ' (you)' : ''}</span>${F.gains[p.id] ? `<small>+${F.gains[p.id]}</small>` : ''}<b>${n}</b></li>`).join('')}</ol>
        <div class="actions center"><button class="btn btn-main btn-big" type="button" ${send({ t: 'next' })}>Next round</button></div>
        <p class="hint">${next.id === me ? 'You host' : esc(next.name) + ' hosts'} next.</p>
      </section>`;
    },
    bind(v) {
      const F = v.pub, c = document.getElementById('ocard');
      if (c) {
        P.holdToReveal(c, () => {
          if (v.local.ijPeek === F.n) return;
          v.local.ijPeek = F.n;
          const b = document.getElementById('oread');
          if (b && v.mine && v.mine.role) b.disabled = false;
        });
      }
      if ((F.phase === 'ask' || F.phase === 'talk') && F.ends) Online.ticker(v.local, 'otimer', F.ends, { tick: true });
    },
    click(name, el, v) {
      const F = v.pub;
      if (name === 'read') { el.disabled = true; v.send({ t: 'read', n: F.n }); sfx.pop(); }
      if (name === 'found') { v.local.ijFound = F.n; v.redraw(); }
      if (name === 'unfound') { v.local.ijFound = null; v.redraw(); }
    },
    fx(v, prev) {
      const F = v.pub, B = prev && prev.pub;
      if (!B || B.game !== F.game || B.phase === F.phase) return;
      if (F.phase === 'ask') sfx.beep(true);
      if (F.phase === 'talk') sfx.ding();
      if (F.phase === 'vote') sfx.beep(true);
      if (F.phase === 'result') {
        if (F.outcome === 'timeout') { sfx.buzz(0.8); P.vibrate([200, 80, 200]); }
        else if ((F.outcome === 'caught') !== (F.insider === v.me)) { sfx.win(); P.confetti({ colors: ['#f5b301', '#f2efe8', '#c4c0b6'] }); }
        else sfx.lose();
      }
    }
  };
  document.addEventListener('change', e => {
    if (e.target.name === 'o-time' || e.target.name === 'o-talk') { S.settings[e.target.name.slice(2)] = Number(e.target.value); persist(); }
  });

  if (window.Online && Online.wanted()) Online.room(ONLINE);
  else render();
})();
</script>
</body>
</html>
